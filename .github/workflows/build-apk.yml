            @override
            State<RegisterMaterialScreen>
                createState() {
              return _RegisterMaterialScreenState();
            }
          }

          class _RegisterMaterialScreenState
              extends State<RegisterMaterialScreen> {
            final GlobalKey<FormState> formKey =
                GlobalKey<FormState>();

            final TextEditingController
                nameController =
                TextEditingController();

            final TextEditingController
                serialController =
                TextEditingController();

            final TextEditingController
                deviceController =
                TextEditingController();

            final TextEditingController
                departmentController =
                TextEditingController(
              text: 'قسم الكيمياء',
            );

            final TextEditingController
                boxCountController =
                TextEditingController(
              text: '1',
            );

            final TextEditingController
                quantityPerBoxController =
                TextEditingController(
              text: '1',
            );

            String materialType = 'Reagent';
            String unit = 'mL';

            late DateTime expiryDate;

            @override
            void initState() {
              super.initState();

              serialController.text =
                  widget.parsed.serial;

              expiryDate =
                  widget.parsed.expiryDate ??
                      DateTime.now().add(
                        const Duration(
                          days: 365,
                        ),
                      );
            }

            double get totalPreview {
              final int boxes =
                  int.tryParse(
                        boxCountController.text,
                      ) ??
                      0;

              final double quantityPerBox =
                  parseQuantity(
                quantityPerBoxController.text,
              );

              return boxes * quantityPerBox;
            }

            String? requiredValidator(
              String? value,
            ) {
              if (value == null ||
                  value.trim().isEmpty) {
                return 'هذا البيان مطلوب';
              }

              return null;
            }

            Future<void> saveMaterial() async {
              if (!(formKey.currentState
                      ?.validate() ??
                  false)) {
                return;
              }

              final int boxes = int.tryParse(
                    boxCountController.text,
                  ) ??
                  0;

              final double quantityPerBox =
                  parseQuantity(
                quantityPerBoxController.text,
              );

              if (boxes <= 0) {
                ScaffoldMessenger.of(context)
                    .showSnackBar(
                  const SnackBar(
                    content: Text(
                      'عدد العلب يجب أن يكون أكبر من صفر',
                    ),
                  ),
                );

                return;
              }

              if (quantityPerBox <= 0) {
                ScaffoldMessenger.of(context)
                    .showSnackBar(
                  const SnackBar(
                    content: Text(
                      'كمية كل علبة يجب أن تكون أكبر من صفر',
                    ),
                  ),
                );

                return;
              }

              final MaterialRecord? duplicate =
                  widget.store.findMaterial(
                widget.rawBarcode,
                widget.parsed,
              );

              if (duplicate != null) {
                ScaffoldMessenger.of(context)
                    .showSnackBar(
                  const SnackBar(
                    content: Text(
                      'هذه المادة مسجلة مسبقًا',
                    ),
                  ),
                );

                return;
              }

              final MaterialRecord material =
                  MaterialRecord(
                id: 'CHEM-'
                    '${DateTime.now().millisecondsSinceEpoch}',
                barcode:
                    widget.rawBarcode,
                name:
                    nameController.text.trim(),
                materialType: materialType,
                serialNumber:
                    serialController.text.trim(),
                gtin: widget.parsed.gtin,
                lotNumber:
                    widget.parsed.lot,
                catalogNumber:
                    widget.parsed.catalog,
                deviceName:
                    deviceController.text.trim(),
                department:
                    departmentController.text
                        .trim(),
                boxCount: boxes,
                quantityPerBox:
                    quantityPerBox,
                unit: unit,
                expiryDate: expiryDate,
                registeredBy:
                    widget.store.currentUser?.name ??
                        'غير معروف',
                registeredAt:
                    DateTime.now(),
                totalUsed: 0,
                usageHistory: <UsageRecord>[],
              );

              await widget.store.registerMaterial(
                material,
              );

              if (!mounted) {
                return;
              }

              Navigator.of(context).pop(
                material,
              );
            }

            @override
            void dispose() {
              nameController.dispose();
              serialController.dispose();
              deviceController.dispose();
              departmentController.dispose();
              boxCountController.dispose();
              quantityPerBoxController.dispose();
              super.dispose();
            }

