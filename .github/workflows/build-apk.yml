name: Build SmartChem Track v5

on:
  workflow_dispatch:
  push:
    branches:
      - smartchem-apk-build
      - smartchem-v5-products-cartons-units
  pull_request:
    branches:
      - smartchem-apk-build

permissions:
  contents: read

concurrency:
  group: smartchem-v5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Analyze, test, and build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    defaults:
      run:
        working-directory: smartchem_v5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: Get Flutter packages
        run: flutter pub get

      - name: Analyze Flutter source
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload SmartChem debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartChemTrack-v5-debug-apk
          path: smartchem_v5/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
