name: Build SmartChem Track v2 Fixed

on:
  push:
    branches:
      - smartchem-apk-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android application
        run: |
          flutter create smartchem_v2 \
            --platforms=android \
            --org om.smartchem \
            --project-name smartchem_track_v2

      - name: Add required packages
        working-directory: smartchem_v2
        run: |
          flutter pub add mobile_scanner
          flutter pub add intl

      - name: Write SmartChem Track v2 application
        working-directory: smartchem_v2
        shell: bash
        run: |
          cat > lib/main.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:intl/intl.dart';
          import 'package:mobile_scanner/mobile_scanner.dart';

          void main() {
            runApp(const SmartChemApp());
          }

          class SmartChemApp extends StatelessWidget {
            const SmartChemApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'SmartChem Track v2.0.1',
                builder: (context, child) {
                  return Directionality(
                    textDirection: TextDirection.rtl,
                    child: child ?? const SizedBox.shrink(),
                  );
                },
                theme: ThemeData(
                  useMaterial3: true,
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: const Color(0xFF006C70),
                  ),
                  scaffoldBackgroundColor: const Color(0xFFF4F8F8),
                  inputDecorationTheme: const InputDecorationTheme(
                    border: OutlineInputBorder(),
                    filled: true,
                  ),
                  cardTheme: const CardThemeData(
                    elevation: 1,
                    margin: EdgeInsets.zero,
                  ),
                ),
                home: const LoginScreen(),
              );
            }
          }

          class AppUser {
            AppUser({
              required this.name,
              required this.username,
              required this.password,
              required this.admin,
              this.active = true,
              this.canScan = true,
              this.canReports = true,
              this.canUseMaterials = true,
            });

            String name;
            String username;
            String password;
            bool admin;
            bool active;
            bool canScan;
            bool canReports;
            bool canUseMaterials;
          }

          enum ItemStatus {
            valid,
            nearExpiry,
            expired,
            unapproved,
            empty,
          }

          class LabItem {
            LabItem({
              required this.name,
              required this.type,
              required this.rawCode,
              required this.gtin,
              required this.lot,
              required this.catalog,
              required this.serial,
              required this.expiry,
              required this.device,
              required this.department,
              required this.employee,
              required this.totalQuantity,
              required this.approved,
            });

            String name;
            String type;
            String rawCode;
            String gtin;
            String lot;
            String catalog;
            String serial;
            DateTime expiry;
            String device;
            String department;
            String employee;
            double totalQuantity;
            double usedQuantity = 0.0;
            DateTime? openedAt;
            bool approved;

            double get remaining {
              final result = totalQuantity - usedQuantity;
              return result < 0 ? 0.0 : result;
            }

            ItemStatus status() {
              if (remaining <= 0) {
                return ItemStatus.empty;
              }

              if (!approved) {
                return ItemStatus.unapproved;
              }

              final now = DateTime.now();

              final today = DateTime(
                now.year,
                now.month,
                now.day,
              );

              final end = DateTime(
                expiry.year,
                expiry.month,
                expiry.day,
              );

              if (end.isBefore(today)) {
                return ItemStatus.expired;
              }

              if (end.difference(today).inDays <= 30) {
                return ItemStatus.nearExpiry;
              }

              return ItemStatus.valid;
            }
          }

          class UsageRecord {
            UsageRecord({
              required this.material,
              required this.employee,
              required this.device,
              required this.quantity,
              required this.dateTime,
            });

            final String material;
            final String employee;
            final String device;
            final double quantity;
            final DateTime dateTime;
          }

          class AppData {
            static final users = <AppUser>[
              AppUser(
                name: 'المستخدم الرئيسي',
                username: 'admin',
                password: '1234',
                admin: true,
              ),
              AppUser(
                name: 'موظف قسم الكيمياء',
                username: 'staff',
                password: '1234',
                admin: false,
              ),
            ];

            static final materials = <LabItem>[];
            static final usage = <UsageRecord>[];

            static AppUser? currentUser;
          }

          class LoginScreen extends StatefulWidget {
            const LoginScreen({super.key});

            @override
            State<LoginScreen> createState() {
              return _LoginScreenState();
            }
          }

          class _LoginScreenState extends State<LoginScreen> {
            final username = TextEditingController(text: 'admin');
            final password = TextEditingController(text: '1234');

            String error = '';

            void login() {
              AppUser? selected;

              for (final user in AppData.users) {
                if (user.username == username.text.trim() &&
                    user.password == password.text &&
                    user.active) {
                  selected = user;
                  break;
                }
              }

              if (selected == null) {
                setState(() {
                  error =
                      'بيانات الدخول غير صحيحة أو المستخدم موقوف';
                });
                return;
              }

              AppData.currentUser = selected;

              Navigator.pushReplacement(
                context,
                MaterialPageRoute(
                  builder: (_) => const HomeScreen(),
                ),
              );
            }

            @override
            void dispose() {
              username.dispose();
              password.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: Center(
                    child: SingleChildScrollView(
                      padding: const EdgeInsets.all(24),
                      child: ConstrainedBox(
                        constraints: const BoxConstraints(
                          maxWidth: 520,
                        ),
                        child: Card(
                          child: Padding(
                            padding: const EdgeInsets.all(24),
                            child: Column(
                              mainAxisSize: MainAxisSize.min,
                              crossAxisAlignment:
                                  CrossAxisAlignment.stretch,
                              children: [
                                const CircleAvatar(
                                  radius: 43,
                                  child: Icon(
                                    Icons.science_outlined,
                                    size: 48,
                                  ),
                                ),
                                const SizedBox(height: 14),
                                const Text(
                                  'SmartChem Track',
                                  textAlign: TextAlign.center,
                                  style: TextStyle(
                                    fontSize: 27,
                                    fontWeight: FontWeight.bold,
                                  ),
                                ),
                                const Text(
                                  'الإصدار 2.0.1',
                                  textAlign: TextAlign.center,
                                ),
                                const SizedBox(height: 24),
                                TextField(
                                  controller: username,
                                  decoration:
                                      const InputDecoration(
                                    labelText: 'اسم المستخدم',
                                    prefixIcon:
                                        Icon(Icons.person_outline),
                                  ),
                                ),
                                const SizedBox(height: 12),
                                TextField(
                                  controller: password,
                                  obscureText: true,
                                  decoration:
                                      const InputDecoration(
                                    labelText: 'كلمة المرور',
                                    prefixIcon:
                                        Icon(Icons.lock_outline),
                                  ),
                                ),
                                if (error.isNotEmpty) ...[
                                  const SizedBox(height: 10),
                                  Text(
                                    error,
                                    style: const TextStyle(
                                      color: Colors.red,
                                      fontWeight: FontWeight.bold,
                                    ),
                                  ),
                                ],
                                const SizedBox(height: 14),
                                FilledButton(
                                  onPressed: login,
                                  child: const Padding(
                                    padding: EdgeInsets.symmetric(
                                      vertical: 14,
                                    ),
                                    child: Text('دخول'),
                                  ),
                                ),
                                const SizedBox(height: 12),
                                const Text(
                                  'الرئيسي: admin / 1234\n'
                                  'الموظف: staff / 1234',
                                  textAlign: TextAlign.center,
                                ),
                              ],
                            ),
                          ),
                        ),
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});

            @override
            State<HomeScreen> createState() {
              return _HomeScreenState();
            }
          }

          class _HomeScreenState extends State<HomeScreen> {
