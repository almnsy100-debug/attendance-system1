                entityId: materialId,
                action: action,
                oldValue: (!value).toString(),
                newValue: value.toString(),
                reason: reason,
              );
            }

            Future<void> recordUsage({
              required UserRecord actor,
              required int materialId,
              required double quantity,
              required String note,
            }) async {
              if (quantity <= 0) {
                throw ArgumentError('INVALID_QUANTITY');
              }

              await database.transaction(
                (Transaction transaction) async {
                  final List<Map<String, Object?>> rows =
                      await transaction.query(
                    'materials',
                    where:
                        'id = ? AND deleted_at IS NULL',
                    whereArgs: <Object?>[materialId],
                    limit: 1,
                  );

                  if (rows.isEmpty) {
                    throw StateError('MATERIAL_NOT_FOUND');
                  }

                  final double original =
                      numberValue(
                    rows.first['original_quantity'],
                  );

                  final double used =
                      numberValue(
                    rows.first['used_quantity'],
                  );

                  final double remaining =
                      original - used;

                  if (quantity > remaining) {
                    throw ArgumentError(
                      'INVALID_QUANTITY',
                    );
                  }

                  final int usageId =
                      await transaction.insert(
                    'usage_records',
                    <String, Object?>{
                      'material_id': materialId,
                      'user_id': actor.id,
                      'original_quantity': original,
                      'used_quantity': quantity,
                      'previous_used_quantity': 0,
                      'note': note.trim(),
                      'created_at': isoNow(),
                      'is_approved': 1,
                      'sync_status': 'local',
                    },
                  );

                  final double newUsed =
                      used + quantity;

                  await transaction.update(
                    'materials',
                    <String, Object?>{
                      'used_quantity': newUsed,
                      'usage_count':
                          (rows.first['usage_count']
                                      as int? ??
                                  0) +
                              1,
                      'last_used_by': actor.id,
                      'last_used_at': isoNow(),
                      'status': newUsed >= original
                          ? 'empty'
                          : 'active',
                      'updated_at': isoNow(),
                      'updated_by': actor.id,
                      'sync_status': 'local',
                    },
                    where: 'id = ?',
                    whereArgs: <Object?>[materialId],
                  );

                  await transaction.insert(
                    'audit_logs',
                    <String, Object?>{
                      'entity_type': 'usage',
                      'entity_id': usageId,
                      'action': 'ADD_USAGE',
                      'new_value': quantity.toString(),
                      'reason': note,
                      'performed_by': actor.id,
                      'performed_at': isoNow(),
                      'device_name':
                          Platform.operatingSystem,
