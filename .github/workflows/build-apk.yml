name: Build SmartChem Track v4.0.8

on:
  workflow_dispatch:
  push:
    branches:
      - smartchem-apk-build

permissions:
  contents: read
  actions: read

concurrency:
  group: smartchem-v4-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build SmartChem Track v4.0.8 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: Show environment
        shell: bash
        run: |
          set -e

          echo "========== FLUTTER =========="
          flutter --version

          echo "========== DART =========="
          dart --version

          echo "========== JAVA =========="
          java -version

          echo "========== ANDROID =========="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          flutter doctor -v

      - name: Install Android SDK 36 and NDK 28
        shell: bash
        run: |
          set -e

          SDKMANAGER=""

          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -x "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

          echo "Android SDK and NDK installed"

      - name: Create clean Flutter Android project
        shell: bash
        run: |
          set -e

          rm -rf smartchem_v4
          rm -rf recovered_source

          flutter create smartchem_v4 \
            --platforms=android \
            --org om.smartchem.track \
            --project-name production

          rm -rf smartchem_v4/test
          mkdir -p smartchem_v4/test
          mkdir -p smartchem_v4/lib/l10n

          echo "Clean Flutter project created"

      - name: Download generated v4.0.7 source
        uses: actions/download-artifact@v5
        with:
          name: SmartChemTrack-v4.0.7-Diagnostic-Logs
          path: recovered_source
          repository: ${{ github.repository }}
          run-id: 29660217211
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore SmartChem source files
        shell: bash
        run: |
          set -e

          echo "Downloaded artifact files:"
          find recovered_source \
            -maxdepth 8 \
            -type f \
            -print

          python3 - <<'PY'
          from pathlib import Path
          import shutil

          recovered = Path("recovered_source")
          project = Path("smartchem_v4")

          main_files = list(
              recovered.rglob("smartchem_v4/lib/main.dart")
          )

          if not main_files:
              main_files = list(
                  recovered.rglob("lib/main.dart")
              )

          if not main_files:
              raise SystemExit(
                  "Generated SmartChem main.dart was not found"
              )

          main_file = main_files[0]

          if main_file.parent.name != "lib":
              raise SystemExit(
                  f"Unexpected main.dart location: {main_file}"
              )

          source_root = main_file.parent.parent

          print(
              f"Recovered source root: {source_root}"
          )

          required_files = [
              "pubspec.yaml",
              "l10n.yaml",
              "lib/main.dart",
              "lib/l10n/app_ar.arb",
              "lib/l10n/app_en.arb",
              "test/gs1_test.dart",
          ]

          for relative in required_files:
              source = source_root / relative
              destination = project / relative

              if not source.exists():
                  raise SystemExit(
                      f"Missing recovered file: {source}"
                  )

              destination.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              shutil.copy2(
                  source,
                  destination,
              )

              print(
                  f"Restored: {relative}"
              )
          PY

          test -s smartchem_v4/pubspec.yaml
          test -s smartchem_v4/lib/main.dart
          test -s smartchem_v4/lib/l10n/app_ar.arb
          test -s smartchem_v4/lib/l10n/app_en.arb
          test -s smartchem_v4/test/gs1_test.dart

          grep -q \
            "class SmartChemApp" \
            smartchem_v4/lib/main.dart

          grep -q \
            "class AppDatabase" \
            smartchem_v4/lib/main.dart

          grep -q \
            "class ScannerScreen" \
            smartchem_v4/lib/main.dart

          grep -q \
            "class UsersScreen" \
            smartchem_v4/lib/main.dart

          echo "SmartChem source restored successfully"

      - name: Fix FilePicker and update v4.0.8
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          pubspec_path = Path(
              "smartchem_v4/pubspec.yaml"
          )

          main_path = Path(
              "smartchem_v4/lib/main.dart"
          )

          l10n_path = Path(
              "smartchem_v4/l10n.yaml"
          )

          arabic_path = Path(
              "smartchem_v4/lib/l10n/app_ar.arb"
          )

          english_path = Path(
              "smartchem_v4/lib/l10n/app_en.arb"
          )

          pubspec = pubspec_path.read_text(
              encoding="utf-8"
          )

          main = main_path.read_text(
              encoding="utf-8"
          )

          l10n = l10n_path.read_text(
              encoding="utf-8"
          )

          arabic = arabic_path.read_text(
              encoding="utf-8"
          )

          english = english_path.read_text(
              encoding="utf-8"
          )

          # ----------------------------------------
          # Application version
          # ----------------------------------------

          pubspec, version_count = re.subn(
              r"(?m)^version:\s*[^\n]+$",
              "version: 4.0.8+9",
              pubspec,
              count=1,
          )

          if version_count != 1:
              raise SystemExit(
                  "Application version was not updated"
              )

          arabic = re.sub(
              r"الإصدار\s+\d+\.\d+\.\d+",
              "الإصدار 4.0.8",
              arabic,
              count=1,
          )

          english = re.sub(
              r"Version\s+\d+\.\d+\.\d+",
              "Version 4.0.8",
              english,
              count=1,
          )

          # ----------------------------------------
          # Remove obsolete Flutter localization key
          # ----------------------------------------

          l10n = re.sub(
              r"(?m)^\s*synthetic-package\s*:"
              r"\s*[^\n]+\n?",
              "",
              l10n,
          )

          # ----------------------------------------
          # file_picker 11.0.2 API correction
          # ----------------------------------------

          old_picker_count = main.count(
              "FilePicker.platform.pickFiles("
          )

          main = main.replace(
              "FilePicker.platform.pickFiles(",
              "FilePicker.pickFiles(",
          )

          print(
              f"FilePicker API replacements: "
              f"{old_picker_count}"
          )

          if old_picker_count < 1:
              if "FilePicker.pickFiles(" not in main:
                  raise SystemExit(
                      "FilePicker call was not found"
                  )

          # ----------------------------------------
          # Make selected file null-safe
          # ----------------------------------------

          file_path_pattern = re.compile(
              r"(?P<indent>^[ \t]*)"
              r"final String\? filePath"
              r"\s*=\s*"
              r"result\?\.files\.single\.path;",
              re.MULTILINE,
          )

          def replace_file_path(
              match: re.Match,
          ) -> str:
              indent = match.group("indent")

              return (
                  f"{indent}if (\n"
                  f"{indent}  result == null ||\n"
                  f"{indent}  result.files.isEmpty\n"
                  f"{indent}) {{\n"
                  f"{indent}  return;\n"
                  f"{indent}}}\n"
                  f"\n"
                  f"{indent}final PlatformFile "
                  f"selectedFile =\n"
                  f"{indent}    result.files.single;\n"
                  f"\n"
                  f"{indent}final String? filePath =\n"
                  f"{indent}    selectedFile.path;"
              )

          main, selected_file_count = (
              file_path_pattern.subn(
                  replace_file_path,
                  main,
                  count=1,
              )
          )

          print(
              f"Selected file null-safety fixes: "
              f"{selected_file_count}"
          )

          if selected_file_count != 1:
              if "final PlatformFile selectedFile" not in main:
                  raise SystemExit(
                      "FilePicker null-safety block "
                      "was not updated"
                  )

          reason_pattern = re.compile(
              r"reason:\s*"
              r"result\.files\.single\.name,"
          )

          main, reason_count = reason_pattern.subn(
              "reason: selectedFile.name,",
              main,
              count=1,
          )

          print(
              f"Imported filename fixes: "
              f"{reason_count}"
          )

          if reason_count != 1:
              if "reason: selectedFile.name," not in main:
                  raise SystemExit(
                      "Imported filename audit reason "
                      "was not updated"
                  )

          # ----------------------------------------
          # Verify old errors no longer exist
          # ----------------------------------------

          forbidden_values = [
              "FilePicker.platform.pickFiles(",
              "result.files.single.name",
          ]

          for value in forbidden_values:
              if value in main:
                  raise SystemExit(
                      f"Old source value remains: {value}"
                  )

          required_values = [
              "FilePicker.pickFiles(",
              "final PlatformFile selectedFile",
              "selectedFile.path",
              "reason: selectedFile.name,",
              "SharePlus.instance.share",
              "pw.TableHelper.fromTextArray",
              "tapToFocus: true",
              "useAppLifecycleState: false",
          ]

          for value in required_values:
              if value not in main:
                  raise SystemExit(
                      f"Required source value missing: "
                      f"{value}"
                  )

          pubspec_path.write_text(
              pubspec,
              encoding="utf-8",
          )

          main_path.write_text(
              main,
              encoding="utf-8",
          )

          l10n_path.write_text(
              l10n,
              encoding="utf-8",
          )

          arabic_path.write_text(
              arabic,
              encoding="utf-8",
          )

          english_path.write_text(
              english,
              encoding="utf-8",
          )

          print(
              "SmartChem v4.0.8 source corrections completed"
          )
          PY

      - name: Configure Android application
        working-directory: smartchem_v4
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          application_id = (
              "om.smartchem.track.production"
          )

          ndk_version = (
              "28.2.13676358"
          )

          # ----------------------------------------
          # AndroidManifest.xml
          # ----------------------------------------

          manifest_path = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          manifest = manifest_path.read_text(
              encoding="utf-8"
          )

          manifest_root = re.search(
              r"<manifest\b[^>]*>",
              manifest,
          )

          if manifest_root is None:
              raise SystemExit(
                  "Android manifest root was not found"
              )

          required_entries = [
              (
                  '<uses-permission '
                  'android:name="android.permission.CAMERA" />'
              ),
              (
                  '<uses-permission '
                  'android:name="android.permission.VIBRATE" />'
              ),
              (
                  '<uses-feature '
                  'android:name="android.hardware.camera.any" '
                  'android:required="false" />'
              ),
              (
                  '<uses-feature '
                  'android:name="android.hardware.camera.autofocus" '
                  'android:required="false" />'
              ),
              (
                  '<uses-feature '
                  'android:name="android.hardware.camera.flash" '
                  'android:required="false" />'
              ),
          ]

          missing_entries = [
              entry
              for entry in required_entries
              if entry not in manifest
          ]

          if missing_entries:
              insert_at = manifest_root.end()

              manifest = (
                  manifest[:insert_at]
                  + "\n    "
                  + "\n    ".join(missing_entries)
                  + manifest[insert_at:]
              )

          manifest = re.sub(
              r'android:label="[^"]*"',
              'android:label="SmartChem Track"',
              manifest,
              count=1,
          )

          manifest_path.write_text(
              manifest,
              encoding="utf-8",
          )

          # ----------------------------------------
          # Android build.gradle.kts
          # ----------------------------------------

          gradle_kts = Path(
              "android/app/build.gradle.kts"
          )

          gradle_groovy = Path(
              "android/app/build.gradle"
          )

          if gradle_kts.exists():
              gradle = gradle_kts.read_text(
                  encoding="utf-8"
              )

              gradle = re.sub(
                  r'namespace\s*=\s*"[^"]+"',
                  f'namespace = "{application_id}"',
                  gradle,
                  count=1,
              )

              gradle = re.sub(
                  r'applicationId\s*=\s*"[^"]+"',
                  f'applicationId = "{application_id}"',
                  gradle,
                  count=1,
              )

              gradle = re.sub(
                  r'compileSdk\s*=\s*[^\n]+',
                  "compileSdk = 36",
                  gradle,
                  count=1,
              )

              gradle = re.sub(
                  r'minSdk\s*=\s*[^\n]+',
                  "minSdk = 23",
                  gradle,
                  count=1,
              )

              gradle = re.sub(
                  r'targetSdk\s*=\s*[^\n]+',
                  "targetSdk = 35",
                  gradle,
                  count=1,
              )

              if re.search(
                  r"(?m)^\s*ndkVersion\s*=",
                  gradle,
              ):
                  gradle = re.sub(
                      r'(?m)^(\s*)ndkVersion'
                      r'\s*=\s*[^\n]+',
                      (
                          rf'\1ndkVersion = '
                          rf'"{ndk_version}"'
                      ),
                      gradle,
                      count=1,
                  )
              else:
                  gradle = re.sub(
                      r"(?m)^(\s*)"
                      r"compileSdk\s*=\s*36\s*$",
                      (
                          r'\1compileSdk = 36'
                          "\n"
                          rf'\1ndkVersion = '
                          rf'"{ndk_version}"'
                      ),
                      gradle,
                      count=1,
                  )

              gradle = gradle.replace(
                  "JavaVersion.VERSION_11",
                  "JavaVersion.VERSION_17",
              )

              gradle = gradle.replace(
                  "JvmTarget.JVM_11",
                  "JvmTarget.JVM_17",
              )

              gradle = gradle.replace(
                  'jvmTarget = "11"',
                  'jvmTarget = "17"',
              )

              gradle = gradle.replace(
                  (
                      "jvmTarget = "
                      "JavaVersion.VERSION_11.toString()"
                  ),
                  (
                      "jvmTarget = "
                      "JavaVersion.VERSION_17.toString()"
                  ),
              )

              gradle_kts.write_text(
                  gradle,
                  encoding="utf-8",
              )

              print(
                  "Configured build.gradle.kts"
              )

          elif gradle_groovy.exists():
              gradle = gradle_groovy.read_text(
                  encoding="utf-8"
              )

              gradle = re.sub(
                  r'namespace\s+["\'][^"\']+["\']',
                  f'namespace "{application_id}"',
                  gradle,
                  count=1,
              )

              gradle = re.sub(
                  r'applicationId\s+["\'][^"\']+["\']',
                  f'applicationId "{application_id}"',
                  gradle,
                  count=1,
              )

              gradle = re.sub(
                  r'compileSdkVersion\s+[^\n]+',
                  "compileSdkVersion 36",
                  gradle,
                  count=1,
              )

              gradle = re.sub(
                  r'minSdkVersion\s+[^\n]+',
                  "minSdkVersion 23",
                  gradle,
                  count=1,
              )

              gradle = re.sub(
                  r'targetSdkVersion\s+[^\n]+',
                  "targetSdkVersion 35",
                  gradle,
                  count=1,
              )

              if re.search(
                  r"(?m)^\s*ndkVersion\s+",
                  gradle,
              ):
                  gradle = re.sub(
                      r'(?m)^(\s*)ndkVersion'
                      r'\s+[^\n]+',
                      (
                          rf'\1ndkVersion '
                          rf'"{ndk_version}"'
                      ),
                      gradle,
                      count=1,
                  )
              else:
                  gradle = re.sub(
                      r"(?m)^(\s*)"
                      r"compileSdkVersion\s+36\s*$",
                      (
                          r'\1compileSdkVersion 36'
                          "\n"
                          rf'\1ndkVersion '
                          rf'"{ndk_version}"'
                      ),
                      gradle,
                      count=1,
                  )

              gradle = gradle.replace(
                  "JavaVersion.VERSION_11",
                  "JavaVersion.VERSION_17",
              )

              gradle = gradle.replace(
                  "jvmTarget = '11'",
                  "jvmTarget = '17'",
              )

              gradle_groovy.write_text(
                  gradle,
                  encoding="utf-8",
              )

              print(
                  "Configured build.gradle"
              )

          else:
              raise SystemExit(
                  "Android app Gradle file was not found"
              )

          # ----------------------------------------
          # Gradle properties
          # ----------------------------------------

          properties_path = Path(
              "android/gradle.properties"
          )

          properties = properties_path.read_text(
              encoding="utf-8"
          )

          properties_to_set = {
              "android.useAndroidX": "true",
              "android.enableJetifier": "true",
              "android.suppressUnsupportedCompileSdk": "36",
              "org.gradle.jvmargs":
                  "-Xmx4096m "
                  "-XX:MaxMetaspaceSize=1024m "
                  "-XX:ReservedCodeCacheSize=512m "
                  "-Dfile.encoding=UTF-8",
              "org.gradle.daemon": "false",
              "org.gradle.parallel": "true",
              "kotlin.code.style": "official",
          }

          for key, value in properties_to_set.items():
              pattern = re.compile(
                  rf"(?m)^{re.escape(key)}=.*$"
              )

              line = f"{key}={value}"

              if pattern.search(properties):
                  properties = pattern.sub(
                      line,
                      properties,
                  )
              else:
                  properties += "\n" + line

          properties_path.write_text(
              properties.strip() + "\n",
              encoding="utf-8",
          )

          print(
              f"Application ID: {application_id}"
          )

          print("compileSdk: 36")
          print("targetSdk: 35")
          print("minSdk: 23")
          print(f"NDK: {ndk_version}")
          print("Java: 17")
          PY

      - name: Clean project
        working-directory: smartchem_v4
        shell: bash
        run: |
          set -e

          flutter clean

          rm -rf android/.gradle
          rm -rf build

          echo "Project caches removed"

      - name: Install Flutter packages
        working-directory: smartchem_v4
        shell: bash
        run: |
          set -e

          flutter pub get
          flutter gen-l10n

          cp \
            pubspec.lock \
            ../smartchem-v4.0.8-pubspec.lock

          flutter pub deps \
            > ../smartchem-v4.0.8-dependencies.txt

          echo "Flutter packages installed"

      - name: Format Dart source
        working-directory: smartchem_v4
        shell: bash
        run: |
          set -e

          dart format lib test

      - name: Verify fixed source
        shell: bash
        run: |
          set -e

          grep -n \
            "version: 4.0.8+9" \
            smartchem_v4/pubspec.yaml

          grep -n \
            "FilePicker.pickFiles" \
            smartchem_v4/lib/main.dart

          grep -n \
            "final PlatformFile selectedFile" \
            smartchem_v4/lib/main.dart

          grep -n \
            "reason: selectedFile.name" \
            smartchem_v4/lib/main.dart

          grep -n \
            "ndkVersion" \
            smartchem_v4/android/app/build.gradle.kts \
            2>/dev/null || true

          if grep -n \
            "FilePicker.platform" \
            smartchem_v4/lib/main.dart; then

            echo "Old FilePicker.platform API remains"
            exit 1
          fi

          if grep -n \
            "result.files.single.name" \
            smartchem_v4/lib/main.dart; then

            echo "Unsafe nullable FilePicker result remains"
            exit 1
          fi

          if grep -n \
            "synthetic-package" \
            smartchem_v4/l10n.yaml; then

            echo "Obsolete synthetic-package remains"
            exit 1
          fi

          echo "Source verification passed"

      - name: Analyze Flutter source
        working-directory: smartchem_v4
        shell: bash
        run: |
          set -e
          set -o pipefail

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings \
            2>&1 | tee ../smartchem-v4.0.8-analyze.log

      - name: Run Flutter tests
        working-directory: smartchem_v4
        shell: bash
        run: |
          set -e
          set -o pipefail

          flutter test \
            --reporter expanded \
            2>&1 | tee ../smartchem-v4.0.8-test.log

      - name: Show Android configuration
        working-directory: smartchem_v4
        shell: bash
        run: |
          set -e

          echo "========== APP GRADLE =========="

          if [ -f android/app/build.gradle.kts ]; then
            cat android/app/build.gradle.kts
          else
            cat android/app/build.gradle
          fi

          echo "========== GRADLE PROPERTIES =========="

          cat android/gradle.properties

          echo "========== MANIFEST =========="

          cat \
            android/app/src/main/AndroidManifest.xml

      - name: Build SmartChem v4.0.8 APK
        working-directory: smartchem_v4
        shell: bash
        run: |
          set -e
          set -o pipefail

          flutter build apk \
            --debug \
            --no-pub \
            --build-name=4.0.8 \
            --build-number=9 \
            2>&1 | tee ../smartchem-v4.0.8-build.log

      - name: Locate and copy APK
        shell: bash
        run: |
          set -e

          echo "Generated APK files:"

          find smartchem_v4/build \
            -type f \
            -name "*.apk" \
            -print

          APK_PATH="$(
            find smartchem_v4/build \
              -type f \
              -name "app-debug.apk" \
              -print \
              -quit
          )"

          if [ -z "$APK_PATH" ]; then
            APK_PATH="$(
              find smartchem_v4/build \
                -type f \
                -name "*.apk" \
                -print \
                -quit
            )"
          fi

          if [ -z "$APK_PATH" ]; then
            echo "APK file was not generated"
            exit 1
          fi

          cp \
            "$APK_PATH" \
            SmartChemTrack-v4.0.8-TEST.apk

          sha256sum \
            SmartChemTrack-v4.0.8-TEST.apk \
            > SmartChemTrack-v4.0.8-SHA256.txt

          cat > SmartChemTrack-v4.0.8-BUILD-INFO.txt <<'INFO'
          SmartChem Track
          Version: 4.0.8
          Build number: 9
          Application ID: om.smartchem.track.production
          Build type: Debug test APK
          Flutter: 3.44.6
          Java: 17
          Android minimum SDK: 23
          Android target SDK: 35
          Android compile SDK: 36
          Android NDK: 28.2.13676358
          Scanner: mobile_scanner 7.1.4
          Scanner engine: CameraX and Google ML Kit
          File picker: file_picker 11.0.2
          INFO

          test -s \
            SmartChemTrack-v4.0.8-TEST.apk

          ls -lh \
            SmartChemTrack-v4.0.8-TEST.apk

          cat \
            SmartChemTrack-v4.0.8-SHA256.txt

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartChemTrack-v4.0.8-Diagnostic-Logs
          path: |
            smartchem-v4.0.8-analyze.log
            smartchem-v4.0.8-test.log
            smartchem-v4.0.8-build.log
            smartchem-v4.0.8-dependencies.txt
            smartchem-v4.0.8-pubspec.lock
