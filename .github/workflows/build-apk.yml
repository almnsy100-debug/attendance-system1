                        label: const Padding(
                          padding: EdgeInsets.symmetric(
                            vertical: 12,
                          ),
                          child: Text(
                            'التقارير اليومية والأسبوعية والشهرية',
                          ),
                        ),
                      ),
                    ],
                    if (user.admin && !staffMode) ...[
                      const SizedBox(height: 10),
                      FilledButton.tonalIcon(
                        onPressed: () {
                          open(const AdminScreen());
                        },
                        icon: const Icon(
                          Icons.admin_panel_settings,
                        ),
                        label: const Padding(
                          padding: EdgeInsets.symmetric(
                            vertical: 12,
                          ),
                          child: Text(
                            'لوحة المستخدم الرئيسي',
                          ),
                        ),
                      ),
                    ],
                  ],
                ),
              );
            }
          }

          class StatusCard extends StatelessWidget {
            const StatusCard({
              super.key,
              required this.title,
              required this.count,
              required this.color,
            });

            final String title;
            final int count;
            final Color color;

            @override
            Widget build(BuildContext context) {
              return Card(
                child: Container(
                  padding: const EdgeInsets.all(12),
                  decoration: BoxDecoration(
                    border: Border(
                      right: BorderSide(
                        color: color,
                        width: 7,
                      ),
                    ),
                  ),
                  child: Column(
                    mainAxisAlignment:
                        MainAxisAlignment.center,
                    children: [
                      Text(
                        '$count',
                        style: const TextStyle(
                          fontSize: 27,
                          fontWeight: FontWeight.bold,
                        ),
                      ),
                      Text(
                        title,
                        textAlign: TextAlign.center,
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class ParsedCode {
            const ParsedCode({
              required this.raw,
              required this.gtin,
              required this.lot,
              required this.catalog,
              required this.expiry,
            });

            final String raw;
            final String gtin;
            final String lot;
            final String catalog;
            final DateTime? expiry;
          }

          ParsedCode parseGs1(String input) {
            var raw = input.trim();

            raw = raw.replaceAll(
              '<GS>',
              String.fromCharCode(29),
            );

            if (raw.startsWith(']d2') ||
                raw.startsWith(']D2')) {
              raw = raw.substring(3);
            }

            String find(String pattern) {
              return RegExp(pattern)
                      .firstMatch(raw)
                      ?.group(1)
                      ?.trim() ??
                  '';
            }

            DateTime? parseDate(String value) {
              if (!RegExp(r'^\d{6}$').hasMatch(value)) {
                return null;
              }

              final year =
                  2000 + int.parse(value.substring(0, 2));

              final month =
                  int.parse(value.substring(2, 4));

              var day =
                  int.parse(value.substring(4, 6));

              if (month < 1 || month > 12) {
                return null;
              }

              final lastDay =
                  DateTime(year, month + 1, 0).day;

              if (day == 0 || day > lastDay) {
                day = lastDay;
              }

              return DateTime(year, month, day);
            }

            if (raw.contains('(01)') ||
                raw.contains('(10)') ||
                raw.contains('(17)') ||
                raw.contains('(240)')) {
              final expiryCode =
                  find(r'\(17\)(\d{6})');

              return ParsedCode(
                raw: input,
                gtin: find(r'\(01\)(\d{14})'),
                lot: find(
                  r'\(10\)(.*?)(?=\(\d{2,3}\)|$)',
                ),
                catalog: find(
                  r'\(240\)(.*?)(?=\(\d{2,3}\)|$)',
                ),
                expiry: parseDate(expiryCode),
              );
            }

            final gtin =
                RegExp(r'01(\d{14})')
                        .firstMatch(raw)
                        ?.group(1) ??
                    '';

            final expiryCode =
                RegExp(r'17(\d{6})')
                        .firstMatch(raw)
                        ?.group(1) ??
                    '';

            String lot = '';
            String catalog = '';

            for (final field
                in raw.split(String.fromCharCode(29))) {
              if (field.startsWith('10')) {
                lot = field.substring(2);
              }

              if (field.startsWith('240')) {
                catalog = field.substring(3);
              }
            }

            return ParsedCode(
              raw: input,
              gtin: gtin,
              lot: lot,
              catalog: catalog,
              expiry: parseDate(expiryCode),
            );
          }

          class ScannerScreen extends StatefulWidget {
            const ScannerScreen({super.key});

            @override
            State<ScannerScreen> createState() {
              return _ScannerScreenState();
            }
          }

          class _ScannerScreenState
              extends State<ScannerScreen>
              with WidgetsBindingObserver {
            late final MobileScannerController controller;

            bool processing = false;
            bool cameraStarting = false;
            bool cameraStarted = false;
            String errorMessage = '';

            @override
            void initState() {
              super.initState();

              WidgetsBinding.instance.addObserver(this);

              controller = MobileScannerController(
                autoStart: false,
                facing: CameraFacing.back,
                detectionSpeed:
                    DetectionSpeed.noDuplicates,
              );

              WidgetsBinding.instance
                  .addPostFrameCallback((_) {
                startCamera();
              });
            }

            Future<void> startCamera() async {
              if (cameraStarting || cameraStarted) {
                return;
              }

              cameraStarting = true;

              try {
                await controller.start();

                cameraStarted = true;

                if (mounted) {
                  setState(() {
                    errorMessage = '';
                  });
                }
              } catch (error) {
                cameraStarted = false;

                if (mounted) {
                  setState(() {
                    errorMessage =
                        'تعذر تشغيل الكاميرا.\n'
                        'افتح إعدادات الهاتف ثم اسمح للتطبيق '
                        'باستخدام الكاميرا، وبعدها اضغط '
                        'إعادة المحاولة.';
                  });
                }
              } finally {
                cameraStarting = false;
              }
            }

            Future<void> stopCamera() async {
              if (!cameraStarted) {
                return;
              }

              try {
                await controller.stop();
              } catch (_) {
                // تجاهل خطأ الإيقاف.
              } finally {
                cameraStarted = false;
              }
            }

            @override
            void didChangeAppLifecycleState(
              AppLifecycleState state,
            ) {
              if (state == AppLifecycleState.paused ||
                  state == AppLifecycleState.inactive ||
                  state == AppLifecycleState.detached) {
                stopCamera();
              }

              if (state == AppLifecycleState.resumed) {
                startCamera();
              }
            }

            Future<void> process(String raw) async {
              if (processing || raw.trim().isEmpty) {
                return;
              }

              processing = true;

              await stopCamera();

              final parsed = parseGs1(raw);

              if (!mounted) {
                return;
              }

              await Navigator.push(
                context,
                MaterialPageRoute(
                  builder: (_) => MaterialFormScreen(
                    parsed: parsed,
                  ),
                ),
              );

              if (mounted) {
                Navigator.pop(context);
              }
            }

            Future<void> manualEntry() async {
              final text = TextEditingController(
                text:
                    '(01)00380740150005'
                    '(17)260731'
                    '(10)50532Y600'
                    '(240)09P9510',
              );

              final value =
                  await showDialog<String>(
                context: context,
                builder: (_) => AlertDialog(
                  title: const Text(
                    'إدخال الكود يدويًا',
                  ),
                  content: TextField(
                    controller: text,
                    maxLines: 4,
                    decoration:
                        const InputDecoration(
                      labelText: 'الكود',
                    ),
                  ),
                  actions: [
                    TextButton(
                      onPressed: () {
                        Navigator.pop(context);
                      },
                      child: const Text('إلغاء'),
                    ),
                    FilledButton(
                      onPressed: () {
                        Navigator.pop(
                          context,
                          text.text.trim(),
                        );
                      },
                      child: const Text('متابعة'),
                    ),
                  ],
                ),
              );

              text.dispose();

              if (value != null && value.isNotEmpty) {
                await process(value);
              }
            }

            Future<void> toggleTorch() async {
              try {
                await controller.toggleTorch();
              } catch (_) {
                if (mounted) {
                  ScaffoldMessenger.of(context)
                      .showSnackBar(
                    const SnackBar(
                      content: Text(
                        'تعذر تشغيل إضاءة الكاميرا',
                      ),
                    ),
                  );
                }
              }
            }

            @override
            void dispose() {
              WidgetsBinding.instance.removeObserver(this);
              controller.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('مسح العبوة'),
                  actions: [
                    IconButton(
                      tooltip: 'إدخال يدوي',
                      onPressed: manualEntry,
                      icon: const Icon(Icons.keyboard),
                    ),
                    IconButton(
                      tooltip: 'الإضاءة',
                      onPressed: toggleTorch,
                      icon: const Icon(
                        Icons.flashlight_on_outlined,
                      ),
                    ),
                  ],
                ),
                body: Stack(
                  fit: StackFit.expand,
                  children: [
                    MobileScanner(
                      controller: controller,
                      onDetect: (capture) {
                        if (capture.barcodes.isEmpty) {
                          return;
                        }

                        final value =
                            capture.barcodes.first.rawValue;

                        if (value != null &&
                            value.trim().isNotEmpty) {
                          process(value);
                        }
                      },
                    ),
                    Center(
                      child: Container(
                        width: 290,
                        height: 190,
                        decoration: BoxDecoration(
                          border: Border.all(
                            color: Colors.white,
                            width: 3,
                          ),
                          borderRadius:
                              BorderRadius.circular(18),
                        ),
                      ),
                    ),
                    if (errorMessage.isNotEmpty)
                      Center(
                        child: Card(
                          margin: const EdgeInsets.all(25),
                          child: Padding(
                            padding:
                                const EdgeInsets.all(20),
                            child: Column(
                              mainAxisSize:
                                  MainAxisSize.min,
                              children: [
                                const Icon(
                                  Icons.camera_alt_outlined,
                                  size: 55,
                                ),
                                const SizedBox(height: 12),
                                Text(
                                  errorMessage,
                                  textAlign: TextAlign.center,
                                ),
                                const SizedBox(height: 12),
                                FilledButton(
                                  onPressed: startCamera,
                                  child: const Text(
                                    'إعادة المحاولة',
                                  ),
                                ),
                                const SizedBox(height: 8),
                                OutlinedButton(
                                  onPressed: manualEntry,
                                  child: const Text(
                                    'الإدخال اليدوي',
                                  ),
                                ),
                              ],
                            ),
                          ),
                        ),
                      ),
                    const Positioned(
                      right: 20,
                      left: 20,
                      bottom: 30,
                      child: Card(
                        child: Padding(
                          padding: EdgeInsets.all(14),
                          child: Text(
                            'ضع Data Matrix أو QR '
                            'أو الباركود داخل الإطار',
                            textAlign: TextAlign.center,
                          ),
                        ),
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class MaterialFormScreen extends StatefulWidget {
            const MaterialFormScreen({
              super.key,
              required this.parsed,
            });

            final ParsedCode parsed;

            @override
            State<MaterialFormScreen> createState() {
              return _MaterialFormScreenState();
            }
          }

          class _MaterialFormScreenState
              extends State<MaterialFormScreen> {
            final name = TextEditingController();
            final serial = TextEditingController();
            final device = TextEditingController();
            final department =
                TextEditingController(
                  text: 'قسم الكيمياء',
                );

            final quantity =
                TextEditingController(text: '1');

            String type = 'Reagent';
            bool approved = false;

            late DateTime expiry;

            @override
            void initState() {
              super.initState();

              expiry = widget.parsed.expiry ??
                  DateTime.now().add(
                    const Duration(days: 365),
                  );

              serial.text = widget.parsed.lot.isEmpty
                  ? DateTime.now()
                      .microsecondsSinceEpoch
                      .toString()
                  : widget.parsed.lot;
            }

            void save() {
              final qty =
                  double.tryParse(quantity.text) ?? 0.0;

              if (name.text.trim().isEmpty ||
                  device.text.trim().isEmpty ||
                  qty <= 0) {
                ScaffoldMessenger.of(context)
                    .showSnackBar(
                  const SnackBar(
                    content: Text(
                      'أكمل اسم المادة والجهاز والكمية',
                    ),
                  ),
                );

                return;
              }

              AppData.materials.insert(
                0,
                LabItem(
                  name: name.text.trim(),
                  type: type,
                  rawCode: widget.parsed.raw,
                  gtin: widget.parsed.gtin,
                  lot: widget.parsed.lot,
                  catalog: widget.parsed.catalog,
                  serial: serial.text.trim(),
                  expiry: expiry,
                  device: device.text.trim(),
                  department:
                      department.text.trim(),
                  employee:
                      AppData.currentUser?.name ?? '',
                  totalQuantity: qty,
                  approved: approved,
                ),
              );

              Navigator.pop(context);
            }

            @override
            void dispose() {
              name.dispose();
              serial.dispose();
              device.dispose();
              department.dispose();
              quantity.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('تسجيل المادة'),
