                  if (oldVersion < 2) {
                    await db.execute(
                      'ALTER TABLE materials '
                      'ADD COLUMN sync_status TEXT '
                      "NOT NULL DEFAULT 'local'",
                    );

                    await db.execute(
                      'ALTER TABLE audit_logs '
                      'ADD COLUMN sync_status TEXT '
                      "NOT NULL DEFAULT 'local'",
                    );
                  }
                },
              );

              return AppDatabase._(database);
            }

