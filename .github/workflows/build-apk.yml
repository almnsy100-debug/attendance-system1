                          count: count(ItemStatus.nearExpiry),
                          color: Colors.amber,
                        ),
                        StatusCard(
                          title: 'منتهي',
                          count: count(ItemStatus.expired),
                          color: Colors.red,
                        ),
                        StatusCard(
                          title: 'غير معتمد',
                          count: count(ItemStatus.unapproved),
                          color: Colors.orange,
