          class _MaterialFormScreenState
              extends State<MaterialFormScreen> {
            final TextEditingController
                nameController =
                TextEditingController();

            final TextEditingController
                serialController =
                TextEditingController();

            final TextEditingController
                deviceController =
                TextEditingController();

            final TextEditingController
                departmentController =
                TextEditingController(
              text: 'قسم الكيمياء',
            );

            final TextEditingController
                quantityController =
                TextEditingController(text: '1');

            String materialType = 'Reagent';

            bool approved = false;

            late DateTime expiryDate;

            @override
            void initState() {
              super.initState();

              expiryDate = widget
                      .parsedBarcode.expiryDate ??
                  DateTime.now().add(
                    const Duration(days: 365),
                  );

              if (widget.parsedBarcode
                  .serialNumber.isNotEmpty) {
                serialController.text =
                    widget.parsedBarcode
                        .serialNumber;
              } else if (widget
                  .parsedBarcode.lot.isNotEmpty) {
                serialController.text =
                    widget.parsedBarcode.lot;
              } else {
                serialController.text =
                    DateTime.now()
                        .microsecondsSinceEpoch
                        .toString();
              }
            }

            void saveMaterial() {
              final quantity =
                  double.tryParse(
                        quantityController.text,
                      ) ??
                      0.0;

              if (nameController.text
                      .trim()
                      .isEmpty ||
                  deviceController.text
                      .trim()
                      .isEmpty ||
                  quantity <= 0) {
                ScaffoldMessenger.of(context)
                    .showSnackBar(
                  const SnackBar(
                    content: Text(
                      'أدخل اسم المادة والجهاز والكمية',
                    ),
                  ),
                );

                return;
              }

              AppStore.materials.insert(
                0,
                LabMaterial(
                  id: DateTime.now()
                      .microsecondsSinceEpoch
                      .toString(),
                  name:
                      nameController.text.trim(),
                  type: materialType,
                  rawBarcode: widget
                      .parsedBarcode.rawValue,
                  gtin:
                      widget.parsedBarcode.gtin,
                  lot:
                      widget.parsedBarcode.lot,
                  catalogNumber: widget
                      .parsedBarcode
                      .catalogNumber,
                  serialNumber:
                      serialController.text.trim(),
                  expiryDate: expiryDate,
                  device:
                      deviceController.text.trim(),
                  department:
                      departmentController.text
                          .trim(),
                  registeredBy:
                      AppStore.currentUser?.name ??
                          '',
                  totalQuantity: quantity,
                  isApproved: approved,
                ),
              );

              Navigator.of(context).pop();
            }

            @override
            void dispose() {
              nameController.dispose();
              serialController.dispose();
              deviceController.dispose();
              departmentController.dispose();
              quantityController.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              final user =
                  AppStore.currentUser!;

              return Scaffold(
                appBar: AppBar(
                  title: const Text(
                    'تسجيل المادة',
                  ),
                ),
                body: ListView(
                  padding:
                      const EdgeInsets.all(16),
                  children: [
                    TextField(
                      controller: nameController,
                      decoration:
                          const InputDecoration(
                        labelText: 'اسم المادة',
                      ),
                    ),
                    const SizedBox(height: 12),
                    DropdownButtonFormField<
                        String>(
                      value: materialType,
                      decoration:
                          const InputDecoration(
                        labelText: 'نوع المادة',
                      ),
                      items: const [
                        DropdownMenuItem(
                          value: 'Reagent',
                          child: Text('Reagent'),
                        ),
                        DropdownMenuItem(
                          value: 'Control',
                          child: Text('Control'),
                        ),
                        DropdownMenuItem(
                          value: 'Calibrator',
