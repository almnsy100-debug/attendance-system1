            Future<void> saveUser({
              required UserRecord actor,
              int? userId,
              required String fullName,
              required String username,
              required String employeeNo,
              required String department,
              required String role,
              required bool isActive,
              required bool isArchived,
              String? password,
              required String reason,
            }) async {
              requireAdmin(actor);

              if (fullName.trim().isEmpty ||
                  username.trim().isEmpty) {
                throw ArgumentError('REQUIRED');
              }

              if (userId == null &&
                  (password == null ||
                      password.trim().isEmpty)) {
                throw ArgumentError('PASSWORD_REQUIRED');
              }

              if (userId != null) {
                final List<Map<String, Object?>>
                    existingRows =
                    await database.query(
                  'users',
                  where: 'id = ?',
                  whereArgs: <Object?>[userId],
                  limit: 1,
                );

                if (existingRows.isNotEmpty) {
                  final Map<String, Object?> existing =
                      existingRows.first;

                  final bool wasActiveAdmin =
                      existing['role'] ==
                              'super_admin' &&
                          existing['is_active'] == 1 &&
                          existing['is_archived'] == 0;

                  final bool remainsActiveAdmin =
                      role == 'super_admin' &&
                          isActive &&
                          !isArchived;

                  if (wasActiveAdmin &&
                      !remainsActiveAdmin) {
                    final int count =
                        Sqflite.firstIntValue(
                              await database.rawQuery(
                                '''
                                SELECT COUNT(*)
                                FROM users
                                WHERE role = 'super_admin'
                                  AND is_active = 1
                                  AND is_archived = 0
                                ''',
                              ),
                            ) ??
                            0;

                    if (count <= 1) {
                      throw StateError(
                        'LAST_ADMIN',
                      );
                    }
                  }
                }
              }

              final Map<String, Object?> values =
                  <String, Object?>{
                'full_name': fullName.trim(),
                'username': username.trim(),
                'employee_no':
                    employeeNo.trim(),
                'department':
                    department.trim(),
                'role': role,
                'is_active': isActive ? 1 : 0,
                'is_archived':
                    isArchived ? 1 : 0,
                'updated_at': isoNow(),
                'updated_by': actor.id,
              };

              if (password != null &&
                  password.trim().isNotEmpty) {
                final Map<String, String> secure =
                    passwordData(password.trim());

                values['password_hash'] =
                    secure['hash'];

                values['password_salt'] =
                    secure['salt'];
              }

              int savedId;

              if (userId == null) {
                values['created_at'] = isoNow();
                values['created_by'] = actor.id;
                values['preferred_language'] =
                    'ar';

                savedId = await database.insert(
                  'users',
                  values,
                );
              } else {
                await database.update(
                  'users',
                  values,
                  where: 'id = ?',
                  whereArgs: <Object?>[userId],
                );

                savedId = userId;
              }

              await audit(
                actor: actor,
                entityType: 'user',
                entityId: savedId,
                action: userId == null
                    ? 'ADD_USER'
                    : 'EDIT_USER',
                newValue: jsonEncode(
                  <String, Object?>{
                    'full_name': fullName,
                    'username': username,
                    'department': department,
                    'role': role,
                    'is_active': isActive,
                    'is_archived': isArchived,
                  },
                ),
                reason: reason,
                affectedUserId: savedId,
              );
            }

            Future<List<Map<String, Object?>>>
                auditLogs({
              int? materialId,
            }) async {
              final String condition =
                  materialId == null
                      ? ''
                      : "WHERE a.entity_type = 'material' "
                          'AND a.entity_id = ?';

              return database.rawQuery(
                '''
                SELECT
                  a.*,
                  performer.full_name AS performer_name
                FROM audit_logs a
                JOIN users performer
                  ON performer.id = a.performed_by
                $condition
                ORDER BY a.performed_at DESC
                LIMIT 500
                ''',
                materialId == null
                    ? <Object?>[]
                    : <Object?>[materialId],
              );
            }
          }

          class AppController extends ChangeNotifier {
            late AppDatabase db;

            UserRecord? currentUser;
            Locale locale = const Locale('ar');
            int revision = 0;

            Future<void> initialize() async {
              db = await AppDatabase.open();
            }

            Future<bool> login({
              required String username,
              required String password,
            }) async {
              final UserRecord? user =
                  await db.authenticate(
                username: username,
                password: password,
              );

              if (user == null) {
                return false;
              }

              currentUser = user;

              final String language =
                  await db.preferredLanguage(user.id);

              locale = Locale(
                language == 'en' ? 'en' : 'ar',
              );

              revision++;
              notifyListeners();

              return true;
            }

            Future<void> changeLanguage(
              String language,
            ) async {
              locale = Locale(
                language == 'en' ? 'en' : 'ar',
              );

              final UserRecord? user = currentUser;

              if (user != null) {
                await db.setPreferredLanguage(
                  userId: user.id,
                  language: locale.languageCode,
                );
              }

              notifyListeners();
            }

            void refresh() {
              revision++;
              notifyListeners();
            }

            void logout() {
              currentUser = null;
              revision++;
              notifyListeners();
            }
          }

