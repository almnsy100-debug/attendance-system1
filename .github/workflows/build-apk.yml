name: Build SmartChem Track v4.0.6

on:
  workflow_dispatch:
  push:
    branches:
      - smartchem-apk-build

permissions:
  contents: read

concurrency:
  group: smartchem-v4-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build SmartChem Track v4.0.6 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show build environment
        shell: bash
        run: |
          set -e

          echo "========== FLUTTER =========="
          flutter --version

          echo "========== DART =========="
          dart --version

          echo "========== JAVA =========="
          java -version

          echo "========== ANDROID =========="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          flutter doctor -v

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          SDKMANAGER=""

          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -x "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "Android SDK 36 installed"

      - name: Create clean Flutter project
        shell: bash
        run: |
          set -e

          rm -rf smartchem_v4

          flutter create smartchem_v4 \
            --platforms=android \
            --org om.smartchem.track \
            --project-name production

          rm -rf smartchem_v4/test
          rm -f smartchem_v4/analysis_options.yaml

          mkdir -p smartchem_v4/lib/l10n
          mkdir -p smartchem_v4/test

          echo "Clean Flutter project created"

      - name: Recover complete SmartChem application
        shell: bash
        run: |
          set -e

          SOURCE_COMMIT="9f81a3414472d86e3cb0aa820e8863967994d03c"
          SOURCE_WORKFLOW="/tmp/smartchem-v4-original.yml"

          if ! git cat-file -e "${SOURCE_COMMIT}^{commit}" 2>/dev/null; then
            git fetch origin "${SOURCE_COMMIT}"
          fi

          git show \
            "${SOURCE_COMMIT}:.github/workflows/build-apk.yml" \
            > "${SOURCE_WORKFLOW}"

          python3 - <<'PY'
          from pathlib import Path

          source_path = Path(
              "/tmp/smartchem-v4-original.yml"
          )

          source_lines = source_path.read_text(
              encoding="utf-8"
          ).splitlines()

          def extract_block(
              start_marker: str,
              end_marker: str,
              destination_path: str,
          ) -> None:
              collecting = False
              end_found = False
              output_lines: list[str] = []

              for line in source_lines:
                  if not collecting:
                      if start_marker in line:
                          collecting = True
                      continue

                  if line.strip() == end_marker:
                      end_found = True
                      break

                  if line.startswith("          "):
                      line = line[10:]

                  output_lines.append(line)

              if not collecting:
                  raise SystemExit(
                      f"Start marker not found: {start_marker}"
                  )

              if not end_found:
                  raise SystemExit(
                      f"End marker not found: {end_marker}"
                  )

              if not output_lines:
                  raise SystemExit(
                      f"No source extracted for: {destination_path}"
                  )

              destination = Path(destination_path)

              destination.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              destination.write_text(
                  "\n".join(output_lines) + "\n",
                  encoding="utf-8",
              )

              print(
                  f"Recovered {destination_path}: "
                  f"{len(output_lines)} lines"
              )

          blocks = [
              (
                  "cat > smartchem_v4/pubspec.yaml "
                  "<<'PUBSPEC'",
                  "PUBSPEC",
                  "smartchem_v4/pubspec.yaml",
              ),
              (
                  "cat > smartchem_v4/l10n.yaml "
                  "<<'L10N'",
                  "L10N",
                  "smartchem_v4/l10n.yaml",
              ),
              (
                  "cat > "
                  "smartchem_v4/lib/l10n/app_ar.arb "
                  "<<'AR'",
                  "AR",
                  "smartchem_v4/lib/l10n/app_ar.arb",
              ),
              (
                  "cat > "
                  "smartchem_v4/lib/l10n/app_en.arb "
                  "<<'EN'",
                  "EN",
                  "smartchem_v4/lib/l10n/app_en.arb",
              ),
              (
                  "cat > smartchem_v4/lib/main.dart "
                  "<<'DART'",
                  "DART",
                  "smartchem_v4/lib/main.dart",
              ),
              (
                  "cat > "
                  "smartchem_v4/test/gs1_test.dart "
                  "<<'TEST'",
                  "TEST",
                  "smartchem_v4/test/gs1_test.dart",
              ),
          ]

          for start_marker, end_marker, destination in blocks:
              extract_block(
                  start_marker,
                  end_marker,
                  destination,
              )
          PY

          test -s smartchem_v4/pubspec.yaml
          test -s smartchem_v4/l10n.yaml
          test -s smartchem_v4/lib/main.dart
          test -s smartchem_v4/lib/l10n/app_ar.arb
          test -s smartchem_v4/lib/l10n/app_en.arb
          test -s smartchem_v4/test/gs1_test.dart

          grep -q \
            "class SmartChemApp" \
            smartchem_v4/lib/main.dart

          grep -q \
            "class AppDatabase" \
            smartchem_v4/lib/main.dart

          grep -q \
            "class ScannerScreen" \
            smartchem_v4/lib/main.dart

          grep -q \
            "class InventoryScreen" \
            smartchem_v4/lib/main.dart

          grep -q \
            "class MaterialDetailsScreen" \
            smartchem_v4/lib/main.dart

          grep -q \
            "class UsersScreen" \
            smartchem_v4/lib/main.dart

          echo "Complete SmartChem application recovered"

      - name: Apply SmartChem v4.0.6 source corrections
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          pubspec_path = Path(
              "smartchem_v4/pubspec.yaml"
          )

          main_path = Path(
              "smartchem_v4/lib/main.dart"
          )

          arabic_path = Path(
              "smartchem_v4/lib/l10n/app_ar.arb"
          )

          english_path = Path(
              "smartchem_v4/lib/l10n/app_en.arb"
          )

          pubspec = pubspec_path.read_text(
              encoding="utf-8"
          )

          main = main_path.read_text(
              encoding="utf-8"
          )

          arabic = arabic_path.read_text(
              encoding="utf-8"
          )

          english = english_path.read_text(
              encoding="utf-8"
          )

          # --------------------------------------------------
          # Version
          # --------------------------------------------------

          pubspec, version_count = re.subn(
              r"(?m)^version:\s*[^\n]+$",
              "version: 4.0.6+7",
              pubspec,
              count=1,
          )

          if version_count != 1:
              raise SystemExit(
                  "Application version could not be updated"
              )

          pubspec, sdk_count = re.subn(
              r'(?m)^(\s*)sdk:\s*"[^"]+"\s*$',
              r'\1sdk: ">=3.7.0 <4.0.0"',
              pubspec,
              count=1,
          )

          if sdk_count != 1:
              raise SystemExit(
                  "Dart SDK constraint could not be updated"
              )

          arabic = re.sub(
              r"الإصدار\s+\d+\.\d+\.\d+",
              "الإصدار 4.0.6",
              arabic,
              count=1,
          )

          english = re.sub(
              r"Version\s+\d+\.\d+\.\d+",
              "Version 4.0.6",
              english,
              count=1,
          )

          # --------------------------------------------------
          # Exact package versions
          # --------------------------------------------------

          dependencies = {
              "intl": "0.20.2",
              "mobile_scanner": "7.1.4",
              "sqflite": "2.4.2",
              "path": "1.9.1",
              "crypto": "3.0.6",
              "image_picker": "1.1.2",
              "file_picker": "11.0.2",
              "excel": "4.0.6",
              "pdf": "3.12.0",
              "printing": "5.14.3",
              "path_provider": "2.1.5",
              "share_plus": "11.1.0",
              "cross_file": "0.3.4+2",
          }

          for package, version in dependencies.items():
              expression = re.compile(
                  rf"(?m)^(\s*)"
                  rf"{re.escape(package)}:"
                  rf"\s*[^\n]+$"
              )

              def replacement(
                  match: re.Match,
                  package_name: str = package,
                  package_version: str = version,
              ) -> str:
                  return (
                      f"{match.group(1)}"
                      f"{package_name}: "
                      f"{package_version}"
                  )

              pubspec, count = expression.subn(
                  replacement,
                  pubspec,
                  count=1,
              )

              if count != 1:
                  raise SystemExit(
                      f"Dependency not found: {package}"
                  )

          # --------------------------------------------------
          # PDF API
          # --------------------------------------------------

          main = main.replace(
              "pw.Table.fromTextArray(",
              "pw.TableHelper.fromTextArray(",
          )

          # --------------------------------------------------
          # Share Plus API
          # --------------------------------------------------

          old_share_pattern = re.compile(
              r"(?P<indent>^[ \t]*)"
              r"await\s+Share\.shareXFiles\("
              r"\s*<XFile>\["
              r"\s*XFile\(file\.path\),"
              r"\s*\],"
              r"\s*text:\s*"
              r"(?P<label>text\.[A-Za-z0-9_]+),"
              r"\s*\);",
              re.MULTILINE | re.DOTALL,
          )

          def replace_share(
              match: re.Match,
          ) -> str:
              indent = match.group("indent")
              label = match.group("label")

              return (
                  f"{indent}await SharePlus.instance.share(\n"
                  f"{indent}  ShareParams(\n"
                  f"{indent}    files: <XFile>[\n"
                  f"{indent}      XFile(file.path),\n"
                  f"{indent}    ],\n"
                  f"{indent}    text: {label},\n"
                  f"{indent}  ),\n"
                  f"{indent});"
              )

          main, share_count = old_share_pattern.subn(
              replace_share,
              main,
          )

          print(
              f"Share API replacements: {share_count}"
          )

          if (
              "Share.shareXFiles" in main
              and
              "SharePlus.instance.share" not in main
          ):
              raise SystemExit(
                  "Share API correction failed"
              )

          # --------------------------------------------------
          # Scanner widget
          # --------------------------------------------------

          scanner_pattern = re.compile(
              r"MobileScanner\(\s*"
              r"controller:\s*scanner,\s*"
              r"onDetect:\s*processCapture,\s*"
              r"\)",
              re.MULTILINE,
          )

          scanner_replacement = (
              "MobileScanner(\n"
              "  controller: scanner,\n"
              "  onDetect: processCapture,\n"
              "  tapToFocus: true,\n"
              "  useAppLifecycleState: false,\n"
              ")"
          )

          main, scanner_count = scanner_pattern.subn(
              scanner_replacement,
              main,
              count=1,
          )

          print(
              f"Scanner widget replacements: "
              f"{scanner_count}"
          )

          # --------------------------------------------------
          # Start camera after first frame
          # --------------------------------------------------

          initial_start_pattern = re.compile(
              r"(?m)^"
              r"(?P<indent>[ \t]*)"
              r"unawaited\("
              r"scanner\.start\(\)"
              r"\);"
              r"[ \t]*\n"
              r"[ \t]*\n"
              r"(?P=indent)"
              r"manualTimer\s*=\s*Timer\(",
          )

          def replace_initial_start(
              match: re.Match,
          ) -> str:
              indent = match.group("indent")

              return (
                  f"{indent}WidgetsBinding.instance\n"
                  f"{indent}    .addPostFrameCallback((_) {{\n"
                  f"{indent}  if (mounted) {{\n"
                  f"{indent}    unawaited(scanner.start());\n"
                  f"{indent}  }}\n"
                  f"{indent}}});\n"
                  f"\n"
                  f"{indent}manualTimer = Timer("
              )

          main, camera_start_count = (
              initial_start_pattern.subn(
                  replace_initial_start,
                  main,
                  count=1,
              )
          )

          print(
              f"Camera start replacements: "
              f"{camera_start_count}"
          )

          # --------------------------------------------------
          # Fix MaterialFilter switch fall-through
          # --------------------------------------------------

          filter_switch_pattern = re.compile(
              r"(?P<indent>[ \t]*)"
              r"switch\s*\(filter\)\s*\{"
              r".*?"
              r"(?P=indent)\}"
              r"\s*\n"
              r"\s*\n"
              r"(?P=indent)"
              r"if\s*\(query\.isNotEmpty\)",
              re.DOTALL,
          )

          def replace_filter_switch(
              match: re.Match,
          ) -> str:
              indent = match.group("indent")
              inside = indent + "  "

              return (
                  f"{indent}if (filter == MaterialFilter.all) {{\n"
                  f"{inside}result = result.where(\n"
                  f"{inside}  (MaterialRecord item) =>\n"
                  f"{inside}      !item.isArchived,\n"
                  f"{inside});\n"
                  f"{indent}}} else if (\n"
                  f"{inside}filter == MaterialFilter.available\n"
                  f"{indent}) {{\n"
                  f"{inside}result = result.where(\n"
                  f"{inside}  (MaterialRecord item) =>\n"
                  f"{inside}      item.isAvailable,\n"
                  f"{inside});\n"
                  f"{indent}}} else if (\n"
                  f"{inside}filter == MaterialFilter.expiredOrEmpty\n"
                  f"{indent}) {{\n"
                  f"{inside}result = result.where(\n"
                  f"{inside}  (MaterialRecord item) =>\n"
                  f"{inside}      item.isExpiredOrEmpty,\n"
                  f"{inside});\n"
                  f"{indent}}} else if (\n"
                  f"{inside}filter == MaterialFilter.unused\n"
                  f"{indent}) {{\n"
                  f"{inside}result = result.where(\n"
                  f"{inside}  (MaterialRecord item) =>\n"
                  f"{inside}      item.isUnused,\n"
                  f"{inside});\n"
                  f"{indent}}} else if (\n"
                  f"{inside}filter == MaterialFilter.archived\n"
                  f"{indent}) {{\n"
                  f"{inside}result = result.where(\n"
                  f"{inside}  (MaterialRecord item) =>\n"
                  f"{inside}      item.isArchived,\n"
                  f"{inside});\n"
                  f"{indent}}}\n"
                  f"\n"
                  f"{indent}if (query.isNotEmpty)"
              )

          main, filter_count = filter_switch_pattern.subn(
              replace_filter_switch,
              main,
              count=1,
          )

          print(
              f"Material filter replacements: "
              f"{filter_count}"
          )

          # --------------------------------------------------
          # Write corrected files
          # --------------------------------------------------

          pubspec_path.write_text(
              pubspec,
              encoding="utf-8",
          )

          main_path.write_text(
              main,
              encoding="utf-8",
          )

          arabic_path.write_text(
              arabic,
              encoding="utf-8",
          )

          english_path.write_text(
              english,
              encoding="utf-8",
          )

          print(
              "SmartChem v4.0.6 source corrections completed"
          )
          PY

      - name: Configure Android application
        working-directory: smartchem_v4
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          application_id = (
              "om.smartchem.track.production"
          )

          # --------------------------------------------------
          # Android manifest
          # --------------------------------------------------

          manifest_path = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          manifest = manifest_path.read_text(
              encoding="utf-8"
          )

          manifest_match = re.search(
              r"<manifest\b[^>]*>",
              manifest,
          )

          if manifest_match is None:
              raise SystemExit(
                  "Android manifest root was not found"
              )

          required_entries = [
              (
                  '<uses-permission '
                  'android:name="android.permission.CAMERA" />'
              ),
              (
                  '<uses-permission '
                  'android:name="android.permission.VIBRATE" />'
              ),
              (
                  '<uses-feature '
                  'android:name="android.hardware.camera.any" '
                  'android:required="false" />'
              ),
              (
                  '<uses-feature '
                  'android:name="android.hardware.camera.autofocus" '
                  'android:required="false" />'
              ),
              (
                  '<uses-feature '
                  'android:name="android.hardware.camera.flash" '
                  'android:required="false" />'
              ),
          ]

          missing_entries = [
              entry
              for entry in required_entries
              if entry not in manifest
          ]

          if missing_entries:
              insert_position = manifest_match.end()

              manifest = (
                  manifest[:insert_position]
                  + "\n    "
                  + "\n    ".join(missing_entries)
                  + manifest[insert_position:]
              )

          manifest = re.sub(
              r'android:label="[^"]*"',
              'android:label="SmartChem Track"',
              manifest,
              count=1,
          )

          manifest_path.write_text(
              manifest,
              encoding="utf-8",
          )

          # --------------------------------------------------
          # Android Gradle
          # --------------------------------------------------

          gradle_kts = Path(
              "android/app/build.gradle.kts"
          )

          gradle_groovy = Path(
              "android/app/build.gradle"
          )

          if gradle_kts.exists():
              gradle = gradle_kts.read_text(
                  encoding="utf-8"
              )

              gradle = re.sub(
                  r'namespace\s*=\s*"[^"]+"',
                  f'namespace = "{application_id}"',
                  gradle,
                  count=1,
              )

              gradle = re.sub(
                  r'applicationId\s*=\s*"[^"]+"',
                  f'applicationId = "{application_id}"',
                  gradle,
                  count=1,
              )

              gradle = re.sub(
                  r'compileSdk\s*=\s*[^\n]+',
                  "compileSdk = 36",
                  gradle,
                  count=1,
              )

              gradle = re.sub(
                  r'minSdk\s*=\s*[^\n]+',
                  "minSdk = 23",
                  gradle,
                  count=1,
              )

              gradle = re.sub(
                  r'targetSdk\s*=\s*[^\n]+',
                  "targetSdk = 35",
                  gradle,
                  count=1,
              )

              gradle = gradle.replace(
                  "JavaVersion.VERSION_11",
                  "JavaVersion.VERSION_17",
              )

              gradle = gradle.replace(
                  "JvmTarget.JVM_11",
                  "JvmTarget.JVM_17",
              )

              gradle = gradle.replace(
                  'jvmTarget = "11"',
                  'jvmTarget = "17"',
              )

              gradle = gradle.replace(
                  (
                      "jvmTarget = "
                      "JavaVersion.VERSION_11.toString()"
                  ),
                  (
                      "jvmTarget = "
                      "JavaVersion.VERSION_17.toString()"
                  ),
              )

              gradle_kts.write_text(
                  gradle,
                  encoding="utf-8",
              )

              print(
                  "Configured build.gradle.kts"
              )

          elif gradle_groovy.exists():
              gradle = gradle_groovy.read_text(
                  encoding="utf-8"
              )

              gradle = re.sub(
                  r'namespace\s+["\'][^"\']+["\']',
                  f'namespace "{application_id}"',
                  gradle,
                  count=1,
              )

              gradle = re.sub(
                  r'applicationId\s+["\'][^"\']+["\']',
                  f'applicationId "{application_id}"',
                  gradle,
                  count=1,
              )

              gradle = re.sub(
                  r'compileSdkVersion\s+[^\n]+',
                  "compileSdkVersion 36",
                  gradle,
                  count=1,
              )

              gradle = re.sub(
                  r'minSdkVersion\s+[^\n]+',
                  "minSdkVersion 23",
                  gradle,
                  count=1,
              )

              gradle = re.sub(
                  r'targetSdkVersion\s+[^\n]+',
                  "targetSdkVersion 35",
                  gradle,
                  count=1,
              )

              gradle = gradle.replace(
                  "JavaVersion.VERSION_11",
                  "JavaVersion.VERSION_17",
              )

              gradle = gradle.replace(
                  "jvmTarget = '11'",
                  "jvmTarget = '17'",
              )

              gradle_groovy.write_text(
                  gradle,
                  encoding="utf-8",
              )

              print(
                  "Configured build.gradle"
              )

          else:
              raise SystemExit(
                  "Android app Gradle file was not found"
              )

          # --------------------------------------------------
          # Gradle properties
          # --------------------------------------------------

          properties_path = Path(
              "android/gradle.properties"
          )

          properties = properties_path.read_text(
              encoding="utf-8"
          )

          properties_to_set = {
              "android.useAndroidX": "true",
              "android.enableJetifier": "true",
              "android.suppressUnsupportedCompileSdk": "36",
              "org.gradle.jvmargs":
                  "-Xmx4096m "
                  "-XX:MaxMetaspaceSize=1024m "
                  "-XX:ReservedCodeCacheSize=512m "
                  "-Dfile.encoding=UTF-8",
              "org.gradle.daemon": "false",
              "org.gradle.parallel": "true",
              "kotlin.code.style": "official",
          }

          for key, value in properties_to_set.items():
              expression = re.compile(
                  rf"(?m)^{re.escape(key)}=.*$"
              )

              new_line = f"{key}={value}"

              if expression.search(properties):
                  properties = expression.sub(
                      new_line,
                      properties,
                  )
              else:
                  properties += "\n" + new_line

          properties_path.write_text(
              properties.strip() + "\n",
              encoding="utf-8",
          )

          print(
              f"Application ID: {application_id}"
          )

          print("compileSdk: 36")
          print("targetSdk: 35")
          print("minSdk: 23")
          print("Java: 17")
          PY

      - name: Clean project
        working-directory: smartchem_v4
        shell: bash
        run: |
          set -e

          flutter clean

          rm -rf android/.gradle
          rm -rf build

          echo "Project caches removed"

      - name: Install Flutter packages
        working-directory: smartchem_v4
        shell: bash
        run: |
          set -e

          flutter pub get
          flutter gen-l10n

          cp \
            pubspec.lock \
            ../smartchem-pubspec-lock.txt

          flutter pub deps \
            > ../smartchem-dependencies.txt

          echo "Flutter packages installed"

      - name: Format source
        working-directory: smartchem_v4
        shell: bash
        run: |
          set -e

          dart format lib test

      - name: Verify corrected project
        shell: bash
        run: |
          set -e

          grep -n \
            "version: 4.0.6+7" \
            smartchem_v4/pubspec.yaml

          grep -n \
            "mobile_scanner: 7.1.4" \
            smartchem_v4/pubspec.yaml

          grep -n \
            "share_plus: 11.1.0" \
            smartchem_v4/pubspec.yaml

          grep -n \
            "TableHelper.fromTextArray" \
            smartchem_v4/lib/main.dart

          grep -n \
            "SharePlus.instance.share" \
            smartchem_v4/lib/main.dart

          grep -n \
            "tapToFocus: true" \
            smartchem_v4/lib/main.dart

          grep -n \
            "useAppLifecycleState: false" \
            smartchem_v4/lib/main.dart

          grep -n \
            "addPostFrameCallback" \
            smartchem_v4/lib/main.dart

          if grep -n \
            "Share.shareXFiles" \
            smartchem_v4/lib/main.dart; then

            echo "Deprecated Share API still exists"
            exit 1
          fi

          if grep -n \
            "pw.Table.fromTextArray" \
            smartchem_v4/lib/main.dart; then

            echo "Deprecated PDF table API still exists"
            exit 1
          fi

          echo "Corrected project verification passed"

      - name: Analyze Flutter source
        working-directory: smartchem_v4
        shell: bash
        run: |
          set +e
          set -o pipefail

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings \
            2>&1 | tee ../smartchem-analyze.log

          ANALYZE_STATUS=${PIPESTATUS[0]}

          echo "$ANALYZE_STATUS" \
            > ../smartchem-analyze-status.txt

          {
            echo "## Flutter Analyze"
            echo ""
            echo "Exit status: $ANALYZE_STATUS"
            echo ""
            echo '```text'
            tail -n 300 ../smartchem-analyze.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit 0

      - name: Run Flutter tests
        working-directory: smartchem_v4
        shell: bash
        run: |
          set +e
          set -o pipefail

          flutter test \
            --reporter expanded \
            2>&1 | tee ../smartchem-test.log

          TEST_STATUS=${PIPESTATUS[0]}

          echo "$TEST_STATUS" \
            > ../smartchem-test-status.txt

          {
            echo "## Flutter Tests"
            echo ""
            echo "Exit status: $TEST_STATUS"
            echo ""
            echo '```text'
            tail -n 250 ../smartchem-test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit 0

      - name: Show final Android configuration
        working-directory: smartchem_v4
        shell: bash
        run: |
          set -e

          echo "========== APP GRADLE =========="

          if [ -f android/app/build.gradle.kts ]; then
            cat android/app/build.gradle.kts
          else
            cat android/app/build.gradle
          fi

          echo "========== GRADLE WRAPPER =========="

          cat \
            android/gradle/wrapper/gradle-wrapper.properties

          echo "========== GRADLE PROPERTIES =========="

          cat android/gradle.properties

          echo "========== ANDROID MANIFEST =========="

          cat \
            android/app/src/main/AndroidManifest.xml

      - name: Build SmartChem APK
        working-directory: smartchem_v4
        shell: bash
        run: |
          set +e
          set -o pipefail

          flutter build apk \
            --debug \
            --no-pub \
            --build-name=4.0.6 \
            --build-number=7 \
            2>&1 | tee ../smartchem-build.log

          BUILD_STATUS=${PIPESTATUS[0]}

          echo "$BUILD_STATUS" \
            > ../smartchem-build-status.txt

          tail -n 1200 \
            ../smartchem-build.log \
            > ../smartchem-build-tail.log

          {
            echo "## Android APK Build"
            echo ""
            echo "Exit status: $BUILD_STATUS"
            echo ""
            echo '```text'
            tail -n 350 ../smartchem-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit 0

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartChemTrack-v4.0.6-Diagnostic-Logs
          path: |
            smartchem-analyze.log
            smartchem-analyze-status.txt
            smartchem-test.log
            smartchem-test-status.txt
            smartchem-build.log
            smartchem-build-tail.log
            smartchem-build-status.txt
            smartchem-dependencies.txt
            smartchem-pubspec-lock.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Check analysis tests and APK
        shell: bash
        run: |
          set -e

          ANALYZE_STATUS="$(
            cat smartchem-analyze-status.txt
          )"

          TEST_STATUS="$(
            cat smartchem-test-status.txt
          )"

          BUILD_STATUS="$(
            cat smartchem-build-status.txt
          )"

          echo "Analyze status: $ANALYZE_STATUS"
          echo "Test status: $TEST_STATUS"
          echo "Build status: $BUILD_STATUS"

          if [ "$ANALYZE_STATUS" -ne 0 ]; then
            echo "================================"
            echo "FLUTTER ANALYZE FAILED"
            echo "================================"

            cat smartchem-analyze.log
            exit "$ANALYZE_STATUS"
          fi

          if [ "$TEST_STATUS" -ne 0 ]; then
            echo "================================"
            echo "FLUTTER TESTS FAILED"
            echo "================================"

            cat smartchem-test.log
            exit "$TEST_STATUS"
          fi

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "================================"
            echo "SMARTCHEM APK BUILD FAILED"
            echo "================================"

            cat smartchem-build-tail.log
            exit "$BUILD_STATUS"
          fi

          APK_PATH="smartchem_v4/build/app/outputs/flutter-apk/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "Build returned success but APK was not found"
            exit 1
          fi

          echo "All checks passed"
          ls -lh "$APK_PATH"

      - name: Copy and verify APK
        shell: bash
        run: |
          set -e

          cp \
            smartchem_v4/build/app/outputs/flutter-apk/app-debug.apk \
            SmartChemTrack-v4.0.6-TEST.apk

          sha256sum \
            SmartChemTrack-v4.0.6-TEST.apk \
            > SmartChemTrack-v4.0.6-SHA256.txt

          cat > SmartChemTrack-v4.0.6-BUILD-INFO.txt <<'INFO'
          SmartChem Track
          Version: 4.0.6
          Build number: 7
          Application ID: om.smartchem.track.production
          Build type: Debug test APK
          Android minimum SDK: 23
          Android target SDK: 35
          Android compile SDK: 36
          Java: 17
          Scanner: mobile_scanner 7.1.4
          Scanner engine: CameraX and Google ML Kit
          INFO

          ls -lh \
            SmartChemTrack-v4.0.6-TEST.apk

          cat \
            SmartChemTrack-v4.0.6-SHA256.txt

      - name: Upload SmartChem APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartChemTrack-v4.0.6-TEST-APK
          path: |
            SmartChemTrack-v4.0.6-TEST.apk
            SmartChemTrack-v4.0.6-SHA256.txt
            SmartChemTrack-v4.0.6-BUILD-INFO.txt
          retention-days: 30
          if-no-files-found: error
