          class _UsersScreenState
              extends State<UsersScreen> {
            Future<void> addUser() async {
              final TextEditingController
                  nameController =
                  TextEditingController();

              final TextEditingController
                  usernameController =
                  TextEditingController();

              final TextEditingController
                  passwordController =
                  TextEditingController(
                text: '1234',
              );

              bool isAdmin = false;

              final bool? confirmed =
                  await showDialog<bool>(
                context: context,
                builder: (
                  BuildContext dialogContext,
                ) {
                  return StatefulBuilder(
                    builder: (
                      BuildContext context,
                      void Function(
                        void Function(),
                      ) updateDialog,
                    ) {
                      return AlertDialog(
                        title: const Text(
                          'إضافة مستخدم',
                        ),
                        content:
                            SingleChildScrollView(
                          child: Column(
                            mainAxisSize:
                                MainAxisSize.min,
                            children: <Widget>[
                              TextField(
                                controller:
                                    nameController,
                                decoration:
                                    const InputDecoration(
                                  labelText:
                                      'اسم الموظف',
                                ),
                              ),
                              const SizedBox(
                                height: 10,
                              ),
                              TextField(
                                controller:
                                    usernameController,
                                decoration:
                                    const InputDecoration(
                                  labelText:
                                      'اسم المستخدم',
                                ),
                              ),
                              const SizedBox(
                                height: 10,
                              ),
                              TextField(
                                controller:
                                    passwordController,
                                decoration:
                                    const InputDecoration(
                                  labelText:
                                      'كلمة المرور',
                                ),
                              ),
                              SwitchListTile(
                                title:
                                    const Text(
                                  'مستخدم رئيسي',
                                ),
                                value:
                                    isAdmin,
                                onChanged: (
                                  bool value,
                                ) {
                                  updateDialog(
                                    () {
                                      isAdmin =
                                          value;
                                    },
                                  );
                                },
                              ),
                            ],
                          ),
                        ),
                        actions: <Widget>[
                          TextButton(
                            onPressed: () {
                              Navigator.of(
                                dialogContext,
                              ).pop(false);
                            },
                            child: const Text(
                              'إلغاء',
                            ),
                          ),
                          FilledButton(
                            onPressed: () {
                              Navigator.of(
                                dialogContext,
                              ).pop(true);
                            },
                            child: const Text(
                              'إضافة',
                            ),
                          ),
                        ],
                      );
                    },
                  );
                },
              );

              if (confirmed == true) {
                final String name =
                    nameController.text.trim();

                final String username =
                    usernameController.text
                        .trim();

                final String password =
                    passwordController.text;

                if (name.isEmpty ||
                    username.isEmpty ||
                    password.isEmpty) {
                  if (mounted) {
                    ScaffoldMessenger.of(
                      context,
                    ).showSnackBar(
                      const SnackBar(
                        content: Text(
                          'أكمل جميع البيانات',
                        ),
                      ),
                    );
                  }
                } else {
                  final String? error =
                      await widget.store.addUser(
                    name: name,
                    username: username,
                    password: password,
                    isAdmin: isAdmin,
                  );

                  if (error != null &&
                      mounted) {
                    ScaffoldMessenger.of(
                      context,
                    ).showSnackBar(
                      SnackBar(
                        content: Text(error),
                      ),
                    );
                  }
                }
              }

              nameController.dispose();
              usernameController.dispose();
              passwordController.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return AnimatedBuilder(
                animation: widget.store,
                builder: (
                  BuildContext context,
                  Widget? child,
                ) {
                  return Scaffold(
                    appBar: AppBar(
                      title: const Text(
                        'إدارة المستخدمين',
                      ),
                    ),
                    floatingActionButton:
                        FloatingActionButton
                            .extended(
                      onPressed: addUser,
                      icon: const Icon(
                        Icons.person_add,
                      ),
                      label: const Text(
                        'إضافة مستخدم',
                      ),
                    ),
                    body: ListView.separated(
                      padding:
                          const EdgeInsets.all(
                        12,
                      ),
                      itemCount:
                          widget.store.users.length,
                      separatorBuilder: (
                        BuildContext context,
                        int index,
                      ) {
                        return const SizedBox(
                          height: 8,
                        );
                      },
                      itemBuilder: (
                        BuildContext context,
                        int index,
                      ) {
                        final UserAccount user =
                            widget.store.users[
                                index];

                        return Card(
                          child: ListTile(
                            leading: Icon(
                              user.isAdmin
                                  ? Icons
                                      .admin_panel_settings
                                  : Icons.person,
                            ),
                            title:
                                Text(user.name),
                            subtitle: Text(
                              '${user.username} • '
                              '${user.isAdmin ? 'مستخدم رئيسي' : 'مستخدم عادي'}',
                            ),
                            trailing: Switch(
                              value:
                                  user.isActive,
                              onChanged: user.id ==
                                      widget
                                          .store
                                          .currentUser
                                          ?.id
                                  ? null
                                  : (
                                      bool value,
                                    ) async {
                                      user.isActive =
                                          value;

                                      await widget
                                          .store
                                          .saveUsers();
                                    },
                            ),
                          ),
                        );
                      },
                    ),
                  );
                },
              );
            }
          }
          DART

      - name: Configure Android
        working-directory: smartchem_app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          manifest_text = manifest.read_text(
              encoding="utf-8"
          )

          camera_permission = (
              '<uses-permission '
              'android:name="android.permission.CAMERA" />'
          )

          camera_feature = (
              '<uses-feature '
              'android:name="android.hardware.camera.any" '
              'android:required="false" />'
          )

          if camera_permission not in manifest_text:
              first_tag_end = manifest_text.find(">")

              manifest_text = (
                  manifest_text[:first_tag_end + 1]
                  + "\n    "
                  + camera_permission
                  + "\n    "
                  + camera_feature
                  + manifest_text[first_tag_end + 1:]
              )

          manifest_text = manifest_text.replace(
              'android:label="smartchem_track"',
              'android:label="SmartChem Track"'
          )

          manifest.write_text(
              manifest_text,
              encoding="utf-8"
          )

          gradle = Path(
              "android/app/build.gradle.kts"
          )

          gradle_text = gradle.read_text(
              encoding="utf-8"
          )

          gradle_text = re.sub(
              r'applicationId\s*=\s*"[^"]+"',
              'applicationId = "om.smartchem.track.v310"',
              gradle_text,
              count=1
          )

          gradle_text = re.sub(
              r'minSdk\s*=\s*[^\n]+',
              'minSdk = 23',
              gradle_text,
              count=1
          )

          gradle.write_text(
              gradle_text,
              encoding="utf-8"
          )

          print("AndroidManifest.xml:")
          print(manifest_text)

          print("build.gradle.kts:")
          print(gradle_text)
          PY

      - name: Install Flutter packages
        working-directory: smartchem_app
        run: |
          flutter clean
          flutter pub get
          flutter pub deps

      - name: Analyze source
        working-directory: smartchem_app
        run: |
          flutter analyze \
            --no-fatal-warnings \
            --no-fatal-infos

      - name: Build release APK
        working-directory: smartchem_app
        shell: bash
        run: |
          set -o pipefail

          flutter build apk \
            --release \
            --build-name=3.1.0 \
            --build-number=11 \
            2>&1 | tee ../smartchem-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartChemTrack-v3.1.0-Build-Log
          path: smartchem-build.log
          retention-days: 30
          if-no-files-found: warn

      - name: Copy APK
        run: |
          cp \
            smartchem_app/build/app/outputs/flutter-apk/app-release.apk \
            SmartChemTrack-v3.1.0.apk

          ls -lh SmartChemTrack-v3.1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartChemTrack-v3.1.0-APK
          path: SmartChemTrack-v3.1.0.apk
          retention-days: 30
          if-no-files-found: error
