            Uint8List _randomBytes(int length) {
              final Random random = Random.secure();

              return Uint8List.fromList(
                List<int>.generate(
                  length,
                  (int index) => random.nextInt(256),
                ),
              );
            }

            Uint8List _pbkdf2({
              required String password,
              required Uint8List salt,
              int iterations = 60000,
              int outputLength = 32,
            }) {
              final Hmac hmac = Hmac(
                sha256,
                utf8.encode(password),
              );

              final List<int> output = <int>[];
              int blockNumber = 1;

              while (output.length < outputLength) {
                final ByteData blockData =
                    ByteData(4)
                      ..setUint32(
                        0,
                        blockNumber,
                        Endian.big,
                      );

                Uint8List current =
                    Uint8List.fromList(
                  hmac.convert(
                    <int>[
                      ...salt,
                      ...blockData.buffer.asUint8List(),
                    ],
                  ).bytes,
                );

                final Uint8List result =
                    Uint8List.fromList(current);

                for (int iteration = 1;
                    iteration < iterations;
                    iteration++) {
                  current = Uint8List.fromList(
                    hmac.convert(current).bytes,
                  );

                  for (int index = 0;
                      index < result.length;
                      index++) {
                    result[index] ^= current[index];
                  }
                }

                output.addAll(result);
                blockNumber++;
              }

              return Uint8List.fromList(
                output.take(outputLength).toList(),
              );
            }

            Map<String, String> passwordData(
              String password,
            ) {
              final Uint8List salt =
                  _randomBytes(16);

              final Uint8List hash = _pbkdf2(
                password: password,
                salt: salt,
              );

              return <String, String>{
                'salt': base64Encode(salt),
                'hash': base64Encode(hash),
              };
            }

            bool verifyPassword({
              required String password,
              required String saltBase64,
              required String expectedHash,
            }) {
              final Uint8List salt =
                  base64Decode(saltBase64);

              final String actualHash =
                  base64Encode(
                _pbkdf2(
                  password: password,
                  salt: salt,
                ),
              );

              return actualHash == expectedHash;
            }

