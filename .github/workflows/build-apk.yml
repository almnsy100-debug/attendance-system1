name: Build SmartChem Track v2.0.4 Safe

on:
  push:
    branches:
      - smartchem-apk-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project
        run: |
          rm -rf smartchem_safe

          flutter create smartchem_safe \
            --platforms=android \
            --org om.smartchem \
            --project-name smartchem_safe

      - name: Write pubspec
        working-directory: smartchem_safe
        shell: bash
        run: |
          rm -f analysis_options.yaml

          cat > pubspec.yaml <<'PUBSPEC'
name: smartchem_safe
description: SmartChem Track safe build
publish_to: "none"
version: 2.0.4+6

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: 5.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
PUBSPEC

          flutter pub get

      - name: Write application code
        working-directory: smartchem_safe
        shell: bash
        run: |
          cat > lib/main.dart <<'DART'
import 'package:flutter/material.dart';
import 'package:mobile_scanner/mobile_scanner.dart';

void main() {
  WidgetsFlutterBinding.ensureInitialized();
  runApp(const SmartChemApp());
}

class SmartChemApp extends StatelessWidget {
  const SmartChemApp({super.key});

  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      title: 'SmartChem Track',
      debugShowCheckedModeBanner: false,
      builder: (context, child) {
        return Directionality(
          textDirection: TextDirection.rtl,
          child: child ?? const SizedBox.shrink(),
        );
      },
      theme: ThemeData(
        useMaterial3: true,
        colorScheme: ColorScheme.fromSeed(
          seedColor: const Color(0xFF006C70),
        ),
        scaffoldBackgroundColor: const Color(0xFFF4F8F8),
        inputDecorationTheme: const InputDecorationTheme(
          border: OutlineInputBorder(),
          filled: true,
        ),
      ),
      home: const LoginScreen(),
    );
  }
}

class AppUser {
  AppUser({
    required this.name,
    required this.username,
    required this.password,
    required this.isAdmin,
    this.isActive = true,
    this.canScan = true,
    this.canUseMaterials = true,
    this.canViewReports = true,
  });

  String name;
  String username;
  String password;
  bool isAdmin;
  bool isActive;
  bool canScan;
  bool canUseMaterials;
  bool canViewReports;
}

enum MaterialStatus {
  valid,
  nearExpiry,
  expired,
  unapproved,
  empty,
}

class LabMaterial {
  LabMaterial({
    required this.name,
    required this.type,
    required this.rawCode,
    required this.gtin,
    required this.lot,
    required this.catalog,
    required this.serial,
    required this.expiry,
    required this.device,
    required this.department,
    required this.employee,
    required this.quantity,
    required this.approved,
  });

  String name;
  String type;
  String rawCode;
  String gtin;
  String lot;
  String catalog;
  String serial;
  DateTime expiry;
  String device;
  String department;
  String employee;
  double quantity;
  double used = 0.0;
  bool approved;
  DateTime? openedAt;

  double get remaining {
    final value = quantity - used;
    if (value < 0) {
      return 0.0;
    }
    return value;
  }

  MaterialStatus get status {
    if (remaining <= 0) {
      return MaterialStatus.empty;
    }

    final now = DateTime.now();
    final today = DateTime(now.year, now.month, now.day);
    final expiryDay = DateTime(expiry.year, expiry.month, expiry.day);

    if (expiryDay.isBefore(today)) {
      return MaterialStatus.expired;
    }

    if (!approved) {
      return MaterialStatus.unapproved;
    }

    if (expiryDay.difference(today).inDays <= AppStore.nearExpiryDays) {
      return MaterialStatus.nearExpiry;
    }

    return MaterialStatus.valid;
  }
}

class UsageRecord {
  UsageRecord({
    required this.materialName,
    required this.employee,
    required this.device,
    required this.quantity,
    required this.dateTime,
  });

  String materialName;
  String employee;
  String device;
  double quantity;
  DateTime dateTime;
}

class ParsedCode {
  ParsedCode({
    required this.raw,
    required this.gtin,
    required this.lot,
    required this.catalog,
    required this.serial,
    required this.expiry,
  });

  String raw;
  String gtin;
  String lot;
  String catalog;
  String serial;
  DateTime? expiry;
}

