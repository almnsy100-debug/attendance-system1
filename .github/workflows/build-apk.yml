          class ScannerScreen extends StatefulWidget {
            const ScannerScreen({super.key});

            @override
            State<ScannerScreen> createState() {
              return _ScannerScreenState();
            }
          }

          class _ScannerScreenState
              extends State<ScannerScreen>
              with WidgetsBindingObserver {
            final MobileScannerController controller =
                MobileScannerController(
              autoStart: false,
              facing: CameraFacing.back,
              detectionSpeed: DetectionSpeed.noDuplicates,
            );

            StreamSubscription<BarcodeCapture>? subscription;

            bool processing = false;
            bool startingCamera = false;
            String cameraError = '';

            @override
            void initState() {
              super.initState();

              WidgetsBinding.instance.addObserver(this);

              listenToBarcodes();

              WidgetsBinding.instance
                  .addPostFrameCallback((_) {
                unawaited(startCamera());
              });
            }

            void listenToBarcodes() {
              subscription ??=
                  controller.barcodes.listen(handleBarcode);
            }

            Future<void> startCamera() async {
              if (startingCamera) {
                return;
              }

              startingCamera = true;

              try {
                listenToBarcodes();
                await controller.start();

                if (mounted) {
                  setState(() {
                    cameraError = '';
                  });
                }
              } catch (error) {
                if (mounted) {
                  setState(() {
                    cameraError =
                        'تعذر تشغيل الكاميرا.\n'
                        'تأكد من منح التطبيق صلاحية الكاميرا، '
                        'ثم اضغط إعادة المحاولة.\n\n'
                        '$error';
                  });
                }
              } finally {
                startingCamera = false;
              }
            }

            Future<void> stopCamera() async {
              await subscription?.cancel();
              subscription = null;

              try {
                await controller.stop();
              } catch (_) {
                // تجاهل خطأ الإيقاف.
              }
            }

            @override
            void didChangeAppLifecycleState(
              AppLifecycleState state,
            ) {
              if (!controller.value.hasCameraPermission) {
                return;
              }

              if (state == AppLifecycleState.resumed) {
                listenToBarcodes();
                unawaited(startCamera());
                return;
              }

              if (state == AppLifecycleState.inactive ||
                  state == AppLifecycleState.paused ||
                  state == AppLifecycleState.detached ||
                  state == AppLifecycleState.hidden) {
                unawaited(stopCamera());
              }
            }

            Future<void> handleBarcode(
              BarcodeCapture capture,
            ) async {
              if (processing ||
                  capture.barcodes.isEmpty) {
                return;
              }

              final rawValue =
                  capture.barcodes.first.rawValue;

              if (rawValue == null ||
                  rawValue.trim().isEmpty) {
                return;
              }

              await processCode(rawValue);
            }

            Future<void> processCode(String rawValue) async {
              if (processing) {
                return;
              }

              processing = true;

              await stopCamera();

              final parsed =
                  parseGs1Barcode(rawValue);

              if (!mounted) {
                return;
              }

              await Navigator.of(context).push(
                MaterialPageRoute<void>(
                  builder: (_) => MaterialFormScreen(
                    parsedBarcode: parsed,
                  ),
                ),
              );

              if (!mounted) {
                return;
              }

              processing = false;
              listenToBarcodes();
              await startCamera();
            }

            Future<void> manualEntry() async {
              final controller =
                  TextEditingController(
                text:
                    '(01)00380740150005'
                    '(17)260731'
                    '(10)50532Y600'
                    '(240)09P9510',
              );

              final value =
                  await showDialog<String>(
                context: context,
                builder: (dialogContext) {
                  return AlertDialog(
                    title:
                        const Text('إدخال الكود يدويًا'),
                    content: TextField(
                      controller: controller,
                      maxLines: 4,
                      decoration:
                          const InputDecoration(
                        labelText: 'الكود',
                      ),
                    ),
                    actions: [
                      TextButton(
                        onPressed: () {
                          Navigator.of(dialogContext).pop();
                        },
                        child: const Text('إلغاء'),
                      ),
                      FilledButton(
                        onPressed: () {
                          Navigator.of(dialogContext).pop(
                            controller.text.trim(),
                          );
                        },
                        child: const Text('متابعة'),
                      ),
                    ],
                  );
                },
              );

              controller.dispose();

              if (value != null && value.isNotEmpty) {
                await processCode(value);
              }
            }

            Future<void> toggleTorch() async {
              try {
                await controller.toggleTorch();
              } catch (_) {
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(
                      content: Text(
                        'تعذر تشغيل إضاءة الكاميرا',
                      ),
                    ),
                  );
                }
              }
            }

            @override
            void dispose() {
