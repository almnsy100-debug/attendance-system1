name: Build SmartChem Track v4.0.0

on:
  workflow_dispatch:
  push:
    branches:
      - smartchem-apk-build

permissions:
  contents: read

jobs:
  build:
    name: Build SmartChem Track v4 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: |
          flutter --version
          dart --version

      - name: Create Flutter project
        run: |
          rm -rf smartchem_v4

          flutter create smartchem_v4 \
            --platforms=android \
            --org om.smartchem.track \
            --project-name production

          rm -f smartchem_v4/analysis_options.yaml
          rm -rf smartchem_v4/test

          mkdir -p smartchem_v4/lib/l10n
          mkdir -p smartchem_v4/test

      - name: Write pubspec
        run: |
          cat > smartchem_v4/pubspec.yaml <<'PUBSPEC'
          name: production
          description: SmartChem Track laboratory inventory system
          publish_to: none
          version: 4.0.0+1

          environment:
            sdk: ">=3.6.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            flutter_localizations:
              sdk: flutter
            intl: ^0.20.2
            mobile_scanner: ^7.3.0
            sqflite: ^2.4.2
            path: ^1.9.1
            crypto: ^3.0.6
            image_picker: ^1.1.2
            file_picker: ^11.0.2
            excel: ^4.0.6
            pdf: ^3.12.0
            printing: ^5.14.3
            path_provider: ^2.1.5
            share_plus: ^11.1.0
            cross_file: ^0.3.4+2

          dev_dependencies:
            flutter_test:
              sdk: flutter

          flutter:
            uses-material-design: true
            generate: true
          PUBSPEC

