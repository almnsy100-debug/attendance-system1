      - name: Configure Android
        working-directory: smartchem_v4
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest_path = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          manifest = manifest_path.read_text(
              encoding="utf-8"
          )

          permissions = [
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.VIBRATE" />',
          ]

          first_tag_end = manifest.find(">")

          additions = [
              item
              for item in permissions
              if item not in manifest
          ]

          if additions:
              manifest = (
                  manifest[:first_tag_end + 1]
                  + "\n    "
                  + "\n    ".join(additions)
                  + manifest[first_tag_end + 1:]
              )

          manifest = re.sub(
              r'android:label="[^"]*"',
              'android:label="SmartChem Track"',
              manifest,
              count=1,
          )

          manifest_path.write_text(
              manifest,
              encoding="utf-8",
          )

          gradle_path = Path(
              "android/app/build.gradle.kts"
          )

          if gradle_path.exists():
              gradle = gradle_path.read_text(
                  encoding="utf-8"
              )

              gradle = re.sub(
                  r'compileSdk\s*=\s*[^\n]+',
                  'compileSdk = 35',
                  gradle,
                  count=1,
              )

              gradle = re.sub(
                  r'minSdk\s*=\s*[^\n]+',
                  'minSdk = 23',
                  gradle,
                  count=1,
              )

              gradle_path.write_text(
                  gradle,
                  encoding="utf-8",
              )

          properties_path = Path(
              "android/gradle.properties"
          )

          properties = properties_path.read_text(
              encoding="utf-8"
          )

          if (
              "android.useAndroidX=true"
              not in properties
          ):
              properties += (
                  "\nandroid.useAndroidX=true\n"
              )

          properties_path.write_text(
              properties,
              encoding="utf-8",
          )
          PY

