                      },
                    ),
                    const SizedBox(height: 12),
                    TextField(
                      controller: serial,
                      decoration:
                          const InputDecoration(
                        labelText: 'الرقم التسلسلي',
                      ),
                    ),
                    const SizedBox(height: 12),
                    TextField(
                      controller: device,
                      decoration:
                          const InputDecoration(
                        labelText: 'اسم الجهاز',
                      ),
                    ),
                    const SizedBox(height: 12),
                    TextField(
                      controller: department,
                      decoration:
                          const InputDecoration(
                        labelText: 'القسم',
                      ),
                    ),
                    const SizedBox(height: 12),
                    TextField(
                      controller: quantity,
                      keyboardType:
                          const TextInputType.numberWithOptions(
                        decimal: true,
                      ),
                      decoration:
                          const InputDecoration(
