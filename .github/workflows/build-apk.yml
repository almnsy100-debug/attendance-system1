name: Build SmartChem Track v3.1.2 Fixed

on:
  push:
    branches:
      - smartchem-apk-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build SmartChem Track APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Display Flutter version
        run: |
          flutter --version
          dart --version

      - name: Create clean Flutter project
        run: |
          rm -rf smartchem_app

          flutter create smartchem_app \
            --platforms=android \
            --org om.smartchem \
            --project-name smartchem_track

      - name: Recover complete SmartChem source
        shell: bash
        run: |
          set -e

          SOURCE_COMMIT="fb898ea38ba71732b150efaf50542d192aa67efa"

          git show \
            "${SOURCE_COMMIT}:.github/workflows/build-apk.yml" \
            > /tmp/smartchem-v310-workflow.yml

          python3 - <<'PY'
          from pathlib import Path

          source_path = Path(
              "/tmp/smartchem-v310-workflow.yml"
          )

          source_lines = source_path.read_text(
              encoding="utf-8"
          ).splitlines()

          def extract_block(
              start_text: str,
              end_marker: str,
          ) -> list[str]:

              collecting = False
              output: list[str] = []

              for line in source_lines:

                  if not collecting and start_text in line:
                      collecting = True
                      continue

                  if collecting and line.strip() == end_marker:
                      break

                  if collecting:
                      if line.startswith("          "):
                          line = line[10:]

                      output.append(line)

              if not output:
                  raise SystemExit(
                      f"Could not extract block: {start_text}"
                  )

              return output

          pubspec_lines = extract_block(
              "cat > pubspec.yaml <<'PUBSPEC'",
              "PUBSPEC",
          )

          main_dart_lines = extract_block(
              "cat > lib/main.dart <<'DART'",
              "DART",
          )

          Path(
              "smartchem_app/pubspec.yaml"
          ).write_text(
              "\n".join(pubspec_lines) + "\n",
              encoding="utf-8",
          )

          Path(
              "smartchem_app/lib/main.dart"
          ).write_text(
              "\n".join(main_dart_lines) + "\n",
              encoding="utf-8",
          )
          PY

          test -s smartchem_app/pubspec.yaml
          test -s smartchem_app/lib/main.dart

          grep -q \
            "class SmartChemApp" \
            smartchem_app/lib/main.dart

          grep -q \
            "class ScannerScreen" \
            smartchem_app/lib/main.dart

          grep -q \
            "class RegisterMaterialScreen" \
            smartchem_app/lib/main.dart

          grep -q \
            "class MaterialDetailsScreen" \
            smartchem_app/lib/main.dart

          grep -q \
            "class InventoryScreen" \
            smartchem_app/lib/main.dart

          grep -q \
            "class UsersScreen" \
            smartchem_app/lib/main.dart

          echo "pubspec.yaml lines:"
          wc -l smartchem_app/pubspec.yaml

          echo "main.dart lines:"
          wc -l smartchem_app/lib/main.dart

          echo "Complete SmartChem source recovered successfully"

      - name: Apply source corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pubspec_path = Path(
              "smartchem_app/pubspec.yaml"
          )

          main_path = Path(
              "smartchem_app/lib/main.dart"
          )

          pubspec = pubspec_path.read_text(
              encoding="utf-8"
          )

          main = main_path.read_text(
              encoding="utf-8"
          )

          pubspec = pubspec.replace(
              "version: 3.1.0+11",
              "version: 3.1.2+13",
          )

          main = main.replace(
              "الإصدار 3.1.0",
              "الإصدار 3.1.2",
          )

          main = main.replace(
              "value: materialType,",
              "initialValue: materialType,",
          )

          main = main.replace(
              "value: unit,",
              "initialValue: unit,",
          )

          pubspec_path.write_text(
              pubspec,
              encoding="utf-8",
          )

          main_path.write_text(
              main,
              encoding="utf-8",
          )

          print(
              "Application version updated to 3.1.2+13"
          )

          print(
              "Deprecated dropdown properties corrected"
          )
          PY

      - name: Remove default Flutter test
        working-directory: smartchem_app
        shell: bash
        run: |
          rm -rf test
          rm -f analysis_options.yaml

          test ! -e test/widget_test.dart

          echo "Default MyApp widget test removed"

      - name: Verify corrected source
        shell: bash
        run: |
          grep -n \
            "version: 3.1.2+13" \
            smartchem_app/pubspec.yaml

          grep -n \
            "الإصدار 3.1.2" \
            smartchem_app/lib/main.dart

          grep -n \
            "initialValue: materialType" \
            smartchem_app/lib/main.dart

          grep -n \
            "initialValue: unit" \
            smartchem_app/lib/main.dart

          if grep -R \
            "MyApp" \
            smartchem_app/test \
            2>/dev/null; then

            echo "Old MyApp test still exists"
            exit 1
          fi

          echo "Source corrections verified"

      - name: Configure Android
        working-directory: smartchem_app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest_path = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          manifest = manifest_path.read_text(
              encoding="utf-8"
          )

          camera_permission = (
              '<uses-permission '
              'android:name="android.permission.CAMERA" />'
          )

          camera_feature = (
              '<uses-feature '
              'android:name="android.hardware.camera.any" '
              'android:required="false" />'
          )

          first_tag_end = manifest.find(">")

          if first_tag_end < 0:
              raise SystemExit(
                  "Invalid AndroidManifest.xml"
              )

          additions = []

          if camera_permission not in manifest:
              additions.append(
                  camera_permission
              )

          if camera_feature not in manifest:
              additions.append(
                  camera_feature
              )

          if additions:
              manifest = (
                  manifest[:first_tag_end + 1]
                  + "\n    "
                  + "\n    ".join(additions)
                  + manifest[first_tag_end + 1:]
              )

          manifest = re.sub(
              r'android:label="[^"]*"',
              'android:label="SmartChem Track"',
              manifest,
              count=1,
          )

          manifest_path.write_text(
              manifest,
              encoding="utf-8",
          )

          gradle_kts = Path(
              "android/app/build.gradle.kts"
          )

          gradle_groovy = Path(
              "android/app/build.gradle"
          )

          if gradle_kts.exists():

              gradle = gradle_kts.read_text(
                  encoding="utf-8"
              )

              gradle = re.sub(
                  r'applicationId\s*=\s*"[^"]+"',
                  'applicationId = '
                  '"om.smartchem.track.v310"',
                  gradle,
                  count=1,
              )

              gradle = re.sub(
                  r'minSdk\s*=\s*[^\n]+',
                  "minSdk = 23",
                  gradle,
                  count=1,
              )

              gradle_kts.write_text(
                  gradle,
                  encoding="utf-8",
              )

              print(
                  "Configured build.gradle.kts"
              )

          elif gradle_groovy.exists():

              gradle = gradle_groovy.read_text(
                  encoding="utf-8"
              )

              gradle = re.sub(
                  r'applicationId\s+["\'][^"\']+["\']',
                  'applicationId '
                  '"om.smartchem.track.v310"',
                  gradle,
                  count=1,
              )

              gradle = re.sub(
                  r'minSdkVersion\s+[^\n]+',
                  "minSdkVersion 23",
                  gradle,
                  count=1,
              )

              gradle_groovy.write_text(
                  gradle,
                  encoding="utf-8",
              )

              print(
                  "Configured build.gradle"
              )

          else:
              raise SystemExit(
                  "Android Gradle application file was not found"
              )

          print(
              "Final AndroidManifest.xml:"
          )

          print(manifest)
          PY

      - name: Install Flutter packages
        working-directory: smartchem_app
        shell: bash
        run: |
          flutter clean
          flutter pub get
          flutter pub deps

      - name: Analyze source
        working-directory: smartchem_app
        shell: bash
        run: |
          set +e
          set -o pipefail

          flutter analyze \
            --no-fatal-warnings \
            --no-fatal-infos \
            2>&1 | tee ../smartchem-analyze.log

          ANALYZE_STATUS=${PIPESTATUS[0]}

          echo "$ANALYZE_STATUS" \
            > ../smartchem-analyze-status.txt

          echo "Analyze status: $ANALYZE_STATUS"

          exit 0

      - name: Upload analysis log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartChemTrack-v3.1.2-Analyze-Log
          path: |
            smartchem-analyze.log
            smartchem-analyze-status.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Check analysis result
        shell: bash
        run: |
          ANALYZE_STATUS=$(
            cat smartchem-analyze-status.txt
          )

          if [ "$ANALYZE_STATUS" -ne 0 ]; then
            echo "Flutter analysis failed"

            cat smartchem-analyze.log

            exit "$ANALYZE_STATUS"
          fi

          echo "Flutter analysis completed successfully"

      - name: Build release APK
        working-directory: smartchem_app
        shell: bash
        run: |
          set +e
          set -o pipefail

          flutter build apk \
            --release \
            --build-name=3.1.2 \
            --build-number=13 \
            2>&1 | tee ../smartchem-build.log

          BUILD_STATUS=${PIPESTATUS[0]}

          echo "$BUILD_STATUS" \
            > ../smartchem-build-status.txt

          tail -n 500 \
            ../smartchem-build.log \
            > ../smartchem-build-tail.log

          echo "Build status: $BUILD_STATUS"

          exit 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartChemTrack-v3.1.2-Build-Log
          path: |
            smartchem-build.log
            smartchem-build-tail.log
            smartchem-build-status.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Check APK build result
        shell: bash
        run: |
          BUILD_STATUS=$(
            cat smartchem-build-status.txt
          )

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "SmartChem APK build failed"

            cat smartchem-build-tail.log

            exit "$BUILD_STATUS"
          fi

          APK_PATH="smartchem_app/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "Build finished without creating an APK"
            exit 1
          fi

          echo "APK created successfully"

          ls -lh "$APK_PATH"

      - name: Copy APK
        shell: bash
        run: |
          cp \
            smartchem_app/build/app/outputs/flutter-apk/app-release.apk \
            SmartChemTrack-v3.1.2.apk

          ls -lh SmartChemTrack-v3.1.2.apk

      - name: Upload SmartChem APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartChemTrack-v3.1.2-APK
          path: SmartChemTrack-v3.1.2.apk
          retention-days: 30
          if-no-files-found: error
