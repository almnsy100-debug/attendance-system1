          class MaterialDetailsScreen
              extends StatelessWidget {
            const MaterialDetailsScreen({
              super.key,
              required this.store,
              required this.materialId,
            });

            final AppStore store;
            final String materialId;

            Future<void> recordUsage(
              BuildContext context,
              MaterialRecord material,
            ) async {
              if (material.isExpired) {
                ScaffoldMessenger.of(context)
                    .showSnackBar(
                  const SnackBar(
                    backgroundColor:
                        Colors.red,
                    content: Text(
                      'لا يمكن استخدام مادة منتهية الصلاحية',
                    ),
                  ),
                );

                return;
              }

              if (material.remainingQuantity <=
                  0) {
                ScaffoldMessenger.of(context)
                    .showSnackBar(
                  const SnackBar(
                    content: Text(
                      'لا توجد كمية متبقية',
                    ),
                  ),
                );

                return;
              }

              final TextEditingController
                  quantityController =
                  TextEditingController();

              final TextEditingController
                  noteController =
                  TextEditingController();

              final Map<String, String>? result =
                  await showDialog<
                      Map<String, String>>(
                context: context,
                builder: (
                  BuildContext dialogContext,
                ) {
                  return AlertDialog(
                    title: const Text(
                      'تسجيل استخدام جديد',
                    ),
                    content:
                        SingleChildScrollView(
                      child: Column(
                        mainAxisSize:
                            MainAxisSize.min,
                        children: <Widget>[
                          Text(
                            'الموظف: '
                            '${store.currentUser?.name ?? ''}',
                          ),
                          const SizedBox(
                            height: 5,
                          ),
                          Text(
                            'المتبقي حاليًا: '
                            '${formatQuantity(material.remainingQuantity)} '
                            '${material.unit}',
                            style:
                                const TextStyle(
                              fontWeight:
                                  FontWeight.bold,
                            ),
                          ),
                          const SizedBox(
                            height: 12,
                          ),
                          TextField(
                            controller:
                                quantityController,
                            keyboardType:
                                const TextInputType
                                    .numberWithOptions(
                              decimal: true,
                            ),
                            decoration:
                                InputDecoration(
                              labelText:
                                  'الكمية المستخدمة الآن '
                                  '(${material.unit})',
                            ),
                          ),
                          const SizedBox(
                            height: 12,
                          ),
                          TextField(
                            controller:
                                noteController,
                            maxLines: 2,
                            decoration:
                                const InputDecoration(
                              labelText:
                                  'ملاحظة اختيارية',
                            ),
                          ),
                        ],
                      ),
                    ),
                    actions: <Widget>[
                      TextButton(
                        onPressed: () {
                          Navigator.of(
                            dialogContext,
                          ).pop();
                        },
                        child:
                            const Text('إلغاء'),
                      ),
                      FilledButton(
                        onPressed: () {
                          Navigator.of(
                            dialogContext,
                          ).pop(
                            <String, String>{
                              'quantity':
                                  quantityController
                                      .text,
                              'note':
                                  noteController.text,
                            },
                          );
                        },
                        child:
                            const Text('حفظ'),
                      ),
                    ],
                  );
                },
              );

              quantityController.dispose();
              noteController.dispose();

              if (result == null) {
                return;
              }

              final double quantity =
                  parseQuantity(
                result['quantity'] ?? '',
              );

              final String? error =
                  await store.recordUsage(
                materialId: material.id,
                quantity: quantity,
                note:
                    result['note']?.trim() ?? '',
              );

              if (!context.mounted) {
                return;
              }

              if (error != null) {
                ScaffoldMessenger.of(context)
                    .showSnackBar(
                  SnackBar(
                    backgroundColor:
                        Colors.red,
                    content: Text(error),
                  ),
                );

                return;
              }

              ScaffoldMessenger.of(context)
                  .showSnackBar(
                const SnackBar(
                  content: Text(
                    'تم تسجيل الاستخدام وتحديث الكمية المتبقية',
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return AnimatedBuilder(
                animation: store,
                builder: (
