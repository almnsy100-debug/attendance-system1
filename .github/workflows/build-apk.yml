                                            Icons
                                                .science,
                                            color:
                                                Colors.white,
                                          ),
                                        ),
                                        title:
                                            Text(
                                          material
                                              .name,
                                        ),
                                        subtitle:
                                            Text(
                                          '${material.deviceName} • '
                                          '${material.department}\n'
                                          'LOT: '
                                          '${material.lotNumber.isEmpty ? 'غير موجود' : material.lotNumber}\n'
                                          'المتبقي: '
                                          '${formatQuantity(material.remainingQuantity)} '
                                          '${material.unit}\n'
                                          'سجلها: '
                                          '${material.registeredBy}',
