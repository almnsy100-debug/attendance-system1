class ScannerScreen extends StatefulWidget {
  const ScannerScreen({super.key});

  @override
  State<ScannerScreen> createState() {
    return _ScannerScreenState();
  }
}

class _ScannerScreenState extends State<ScannerScreen> {
  bool processing = false;

  Future<void> processRawCode(String raw) async {
    if (processing || raw.trim().isEmpty) {
      return;
    }

    setState(() {
      processing = true;
    });

    final parsed = parseCode(raw);

    await Navigator.of(context).push(
      MaterialPageRoute<void>(
        builder: (_) => MaterialFormScreen(parsed: parsed),
      ),
    );

    if (mounted) {
      setState(() {
        processing = false;
      });
    }
  }

  void onDetect(BarcodeCapture capture) {
    if (processing || capture.barcodes.isEmpty) {
      return;
    }

    for (final barcode in capture.barcodes) {
      final raw = barcode.rawValue;

      if (raw != null && raw.trim().isNotEmpty) {
        processRawCode(raw);
        return;
      }
    }
  }

  Future<void> manualEntry() async {
    final controller = TextEditingController(
      text: '(01)00380740150005(17)260731(10)50532Y600(240)09P9510',
    );

    final result = await showDialog<String>(
      context: context,
      builder: (dialogContext) {
        return AlertDialog(
          title: const Text('إدخال كود يدوي'),
          content: TextField(
            controller: controller,
            maxLines: 4,
            decoration: const InputDecoration(
              labelText: 'الباركود أو GS1',
            ),
          ),
          actions: [
            TextButton(
              onPressed: () {
                Navigator.of(dialogContext).pop();
              },
              child: const Text('إلغاء'),
            ),
            FilledButton(
              onPressed: () {
                Navigator.of(dialogContext).pop(
                  controller.text.trim(),
                );
              },
              child: const Text('متابعة'),
            ),
          ],
        );
      },
    );

    controller.dispose();

    if (result != null && result.isNotEmpty) {
      await processRawCode(result);
    }
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      backgroundColor: Colors.black,
      appBar: AppBar(
        title: const Text('مسح العبوة'),
        actions: [
          IconButton(
            onPressed: manualEntry,
            icon: const Icon(Icons.keyboard),
          ),
        ],
      ),
      body: Stack(
        fit: StackFit.expand,
        children: [
          MobileScanner(
            onDetect: onDetect,
          ),
          IgnorePointer(
            child: Center(
              child: Container(
                width: 290,
                height: 190,
                decoration: BoxDecoration(
                  border: Border.all(
                    color: Colors.white,
                    width: 3,
                  ),
                  borderRadius: BorderRadius.circular(18),
                ),
              ),
            ),
          ),
          if (processing)
            const Center(
              child: CircularProgressIndicator(),
            ),
          const Positioned(
            left: 20,
            right: 20,
            bottom: 28,
            child: Card(
              child: Padding(
                padding: EdgeInsets.all(14),
                child: Text(
                  'ضع Data Matrix أو QR أو الباركود داخل الإطار',
                  textAlign: TextAlign.center,
                ),
              ),
            ),
          ),
        ],
      ),
    );
  }
}

class MaterialFormScreen extends StatefulWidget {
  const MaterialFormScreen({
    super.key,
    required this.parsed,
  });

  final ParsedCode parsed;

  @override
  State<MaterialFormScreen> createState() {
    return _MaterialFormScreenState();
  }
}

class _MaterialFormScreenState extends State<MaterialFormScreen> {
  final name = TextEditingController();
  final serial = TextEditingController();
  final device = TextEditingController();
  final department = TextEditingController(text: 'قسم الكيمياء');
  final quantity = TextEditingController(text: '1');

  String type = 'Reagent';
  bool approved = false;
  late DateTime expiry;

  @override
  void initState() {
    super.initState();

    expiry = widget.parsed.expiry ??
        DateTime.now().add(
          const Duration(days: 365),
        );

    if (widget.parsed.serial.isNotEmpty) {
      serial.text = widget.parsed.serial;
    } else if (widget.parsed.lot.isNotEmpty) {
      serial.text = widget.parsed.lot;
    } else {
      serial.text = DateTime.now().microsecondsSinceEpoch.toString();
    }
  }

  void saveMaterial() {
    final qty = double.tryParse(quantity.text) ?? 0.0;

    if (name.text.trim().isEmpty ||
        device.text.trim().isEmpty ||
        qty <= 0) {
      ScaffoldMessenger.of(context).showSnackBar(
        const SnackBar(
          content: Text('أدخل اسم المادة والجهاز والكمية'),
        ),
      );
      return;
    }

    AppStore.materials.insert(
      0,
      LabMaterial(
        name: name.text.trim(),
        type: type,
        rawCode: widget.parsed.raw,
        gtin: widget.parsed.gtin,
        lot: widget.parsed.lot,
        catalog: widget.parsed.catalog,
        serial: serial.text.trim(),
        expiry: expiry,
        device: device.text.trim(),
        department: department.text.trim(),
        employee: AppStore.currentUser?.name ?? '',
        quantity: qty,
        approved: approved,
      ),
    );

    Navigator.of(context).pop();
  }

  @override
  void dispose() {
    name.dispose();
    serial.dispose();
    device.dispose();
    department.dispose();
    quantity.dispose();
    super.dispose();
  }

  @override
  Widget build(BuildContext context) {
    final user = AppStore.currentUser!;

    return Scaffold(
      appBar: AppBar(
        title: const Text('تسجيل المادة'),
      ),
      body: ListView(
        padding: const EdgeInsets.all(16),
        children: [
          TextField(
            controller: name,
            decoration: const InputDecoration(
