name: Build SmartChem Track v3.1.0

on:
  push:
    branches:
      - smartchem-apk-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build SmartChem Track APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Display Flutter version
        run: |
          flutter --version
          dart --version

      - name: Create clean Flutter project
        run: |
          rm -rf smartchem_app

          flutter create smartchem_app \
            --platforms=android \
            --org om.smartchem \
            --project-name smartchem_track

      - name: Write pubspec
        working-directory: smartchem_app
        shell: bash
        run: |
          rm -f analysis_options.yaml

          cat > pubspec.yaml <<'PUBSPEC'
          name: smartchem_track
          description: SmartChem laboratory inventory and usage tracking
          publish_to: "none"
          version: 3.1.0+11

          environment:
            sdk: ">=3.5.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            flutter_zxing: 2.2.1
            shared_preferences: 2.5.3

          dev_dependencies:
            flutter_test:
              sdk: flutter

          flutter:
            uses-material-design: true
          PUBSPEC

          flutter pub get

      - name: Write SmartChem application
        working-directory: smartchem_app
        shell: bash
        run: |
          cat > lib/main.dart <<'DART'
          import 'dart:async';
          import 'dart:convert';

          import 'package:flutter/material.dart';
          import 'package:flutter_zxing/flutter_zxing.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();

            final AppStore store = AppStore();
            await store.load();

            runApp(
              SmartChemApp(
                store: store,
              ),
            );
          }

          String twoDigits(int value) {
            return value.toString().padLeft(2, '0');
          }

          String formatDate(DateTime date) {
            return '${twoDigits(date.day)}/'
                '${twoDigits(date.month)}/'
                '${date.year}';
          }

          String formatDateTime(DateTime date) {
            return '${formatDate(date)} '
                '${twoDigits(date.hour)}:'
                '${twoDigits(date.minute)}';
          }

          String formatQuantity(double value) {
            if (value == value.roundToDouble()) {
              return value.toInt().toString();
            }

            return value.toStringAsFixed(2);
          }

          double parseQuantity(String value) {
            return double.tryParse(
                  value.trim().replaceAll(',', '.'),
                ) ??
                0;
          }

          String normalizeBarcode(String value) {
            return value
                .trim()
                .replaceFirst(
                  RegExp(r'^\][dD]2'),
                  '',
                )
                .replaceAll(
                  '<GS>',
                  '|',
                )
                .replaceAll(
                  String.fromCharCode(29),
                  '|',
                );
          }

          class UserAccount {
            UserAccount({
              required this.id,
              required this.name,
              required this.username,
              required this.password,
              required this.isAdmin,
              this.isActive = true,
            });

            final String id;

            String name;
            String username;
            String password;

            bool isAdmin;
            bool isActive;

            Map<String, dynamic> toJson() {
              return <String, dynamic>{
                'id': id,
                'name': name,
                'username': username,
                'password': password,
                'isAdmin': isAdmin,
                'isActive': isActive,
              };
            }

            factory UserAccount.fromJson(
              Map<String, dynamic> json,
            ) {
              return UserAccount(
                id: json['id'] as String,
                name: json['name'] as String,
                username: json['username'] as String,
                password: json['password'] as String,
                isAdmin:
                    json['isAdmin'] as bool? ?? false,
                isActive:
                    json['isActive'] as bool? ?? true,
              );
            }
          }

          class UsageRecord {
            UsageRecord({
              required this.id,
              required this.employeeName,
              required this.quantityUsed,
              required this.quantityBefore,
              required this.quantityAfter,
              required this.createdAt,
              required this.note,
            });

            final String id;
            final String employeeName;

            final double quantityUsed;
            final double quantityBefore;
            final double quantityAfter;

            final DateTime createdAt;
            final String note;

            Map<String, dynamic> toJson() {
              return <String, dynamic>{
                'id': id,
                'employeeName': employeeName,
                'quantityUsed': quantityUsed,
                'quantityBefore': quantityBefore,
                'quantityAfter': quantityAfter,
                'createdAt':
                    createdAt.toIso8601String(),
                'note': note,
              };
            }

            factory UsageRecord.fromJson(
              Map<String, dynamic> json,
            ) {
              return UsageRecord(
                id: json['id'] as String,
                employeeName:
                    json['employeeName'] as String,
                quantityUsed:
                    (json['quantityUsed'] as num)
                        .toDouble(),
                quantityBefore:
                    (json['quantityBefore'] as num)
                        .toDouble(),
                quantityAfter:
                    (json['quantityAfter'] as num)
                        .toDouble(),
                createdAt: DateTime.parse(
                  json['createdAt'] as String,
                ),
                note: json['note'] as String? ?? '',
              );
            }
          }

          class MaterialRecord {
            MaterialRecord({
              required this.id,
              required this.barcode,
              required this.name,
              required this.materialType,
              required this.serialNumber,
              required this.gtin,
              required this.lotNumber,
              required this.catalogNumber,
              required this.deviceName,
              required this.department,
              required this.boxCount,
              required this.quantityPerBox,
              required this.unit,
              required this.expiryDate,
              required this.registeredBy,
              required this.registeredAt,
              required this.totalUsed,
              required this.usageHistory,
            });

            final String id;
            final String barcode;

            String name;
            String materialType;
            String serialNumber;
            String gtin;
            String lotNumber;
            String catalogNumber;
            String deviceName;
            String department;

            int boxCount;
            double quantityPerBox;
            String unit;

            DateTime expiryDate;

            String registeredBy;
            DateTime registeredAt;

            double totalUsed;

            final List<UsageRecord> usageHistory;

            double get originalQuantity {
              return boxCount * quantityPerBox;
            }

            double get remainingQuantity {
              final double result =
                  originalQuantity - totalUsed;

              if (result < 0) {
                return 0;
              }

              return result;
            }

            bool get isExpired {
              final DateTime now = DateTime.now();

              final DateTime today = DateTime(
                now.year,
                now.month,
                now.day,
              );

              final DateTime expiry = DateTime(
                expiryDate.year,
                expiryDate.month,
                expiryDate.day,
              );

              return expiry.isBefore(today);
            }

            bool get isUnused {
              return usageHistory.isEmpty;
            }

            String get lastUser {
              if (usageHistory.isEmpty) {
                return 'لا يوجد استخدام';
              }

              return usageHistory.first.employeeName;
            }

            String get statusText {
              if (isExpired) {
                return 'منتهية الصلاحية';
              }

              if (remainingQuantity <= 0) {
                return 'نفدت الكمية';
              }

              if (isUnused) {
                return 'موجودة — لم تُستخدم';
              }

              return 'مستخدمة — الرصيد متوفر';
            }

            Color get statusColor {
              if (isExpired) {
                return Colors.red;
              }

              if (remainingQuantity <= 0) {
                return Colors.black87;
              }

              if (isUnused) {
                return Colors.blueGrey;
              }

              return Colors.green;
            }

            Map<String, dynamic> toJson() {
              return <String, dynamic>{
                'id': id,
                'barcode': barcode,
                'name': name,
                'materialType': materialType,
                'serialNumber': serialNumber,
                'gtin': gtin,
                'lotNumber': lotNumber,
                'catalogNumber': catalogNumber,
                'deviceName': deviceName,
                'department': department,
                'boxCount': boxCount,
                'quantityPerBox': quantityPerBox,
                'unit': unit,
                'expiryDate':
                    expiryDate.toIso8601String(),
                'registeredBy': registeredBy,
                'registeredAt':
                    registeredAt.toIso8601String(),
                'totalUsed': totalUsed,
                'usageHistory': usageHistory
                    .map(
                      (UsageRecord record) =>
                          record.toJson(),
                    )
                    .toList(),
              };
            }

            factory MaterialRecord.fromJson(
              Map<String, dynamic> json,
            ) {
              final List<dynamic> historyJson =
                  json['usageHistory']
                          as List<dynamic>? ??
                      <dynamic>[];

              return MaterialRecord(
                id: json['id'] as String,
                barcode: json['barcode'] as String,
                name: json['name'] as String,
                materialType:
                    json['materialType'] as String,
                serialNumber:
                    json['serialNumber'] as String? ??
                        '',
                gtin: json['gtin'] as String? ?? '',
                lotNumber:
                    json['lotNumber'] as String? ?? '',
                catalogNumber:
                    json['catalogNumber'] as String? ??
                        '',
                deviceName:
                    json['deviceName'] as String,
                department:
                    json['department'] as String,
                boxCount:
                    (json['boxCount'] as num).toInt(),
                quantityPerBox:
                    (json['quantityPerBox'] as num)
                        .toDouble(),
                unit: json['unit'] as String,
                expiryDate: DateTime.parse(
                  json['expiryDate'] as String,
                ),
                registeredBy:
                    json['registeredBy'] as String,
                registeredAt: DateTime.parse(
                  json['registeredAt'] as String,
                ),
                totalUsed:
                    (json['totalUsed'] as num)
                        .toDouble(),
                usageHistory: historyJson
                    .map(
                      (dynamic item) =>
                          UsageRecord.fromJson(
                        Map<String, dynamic>.from(
                          item as Map<dynamic, dynamic>,
                        ),
                      ),
                    )
                    .toList(),
              );
            }
          }

          class ParsedGs1 {
            const ParsedGs1({
              required this.raw,
              required this.gtin,
              required this.lot,
              required this.serial,
              required this.catalog,
              required this.expiryDate,
            });

            final String raw;
            final String gtin;
            final String lot;
            final String serial;
            final String catalog;
            final DateTime? expiryDate;
          }

          class VariableField {
            const VariableField({
              required this.value,
              required this.nextIndex,
            });

            final String value;
            final int nextIndex;
          }

          DateTime? parseGs1Expiry(String value) {
            if (!RegExp(r'^\d{6}$')
                .hasMatch(value)) {
              return null;
            }

            final int year =
                2000 + int.parse(value.substring(0, 2));

            final int month =
                int.parse(value.substring(2, 4));

            int day =
                int.parse(value.substring(4, 6));

            if (month < 1 || month > 12) {
              return null;
            }

            final int finalDay =
                DateTime(year, month + 1, 0).day;

            if (day == 0) {
              day = finalDay;
            }

            if (day < 1 || day > finalDay) {
              return null;
            }

            return DateTime(
              year,
              month,
              day,
            );
          }

          VariableField readVariableField(
            String value,
            int startIndex,
          ) {
            int index = startIndex;

            while (index < value.length &&
                value.codeUnitAt(index) != 29) {
              index++;
            }

            return VariableField(
              value: value
                  .substring(
                    startIndex,
                    index,
                  )
                  .trim(),
              nextIndex: index < value.length
                  ? index + 1
                  : index,
            );
          }

          String parenthesizedField(
            String raw,
            String ai,
          ) {
            final RegExp expression = RegExp(
              '\\($ai\\)(.*?)'
              '(?=\\(\\d{2,4}\\)|\$)',
              dotAll: true,
            );

            return expression
                    .firstMatch(raw)
                    ?.group(1)
                    ?.trim() ??
                '';
          }

          ParsedGs1 parseGs1Barcode(String input) {
            String raw = input.trim();

            raw = raw.replaceAll(
              '<GS>',
              String.fromCharCode(29),
            );

            raw = raw.replaceFirst(
              RegExp(r'^\][dD]2'),
              '',
            );

            if (raw.contains('(01)') ||
                raw.contains('(10)') ||
                raw.contains('(17)') ||
                raw.contains('(21)') ||
                raw.contains('(240)')) {
              final RegExpMatch? gtinMatch =
                  RegExp(
                r'\(01\)(\d{14})',
              ).firstMatch(raw);

              final RegExpMatch? expiryMatch =
                  RegExp(
                r'\(17\)(\d{6})',
              ).firstMatch(raw);

              return ParsedGs1(
                raw: input,
                gtin:
                    gtinMatch?.group(1)?.trim() ?? '',
                lot: parenthesizedField(
                  raw,
                  '10',
                ),
                serial: parenthesizedField(
                  raw,
                  '21',
                ),
                catalog: parenthesizedField(
                  raw,
                  '240',
                ),
                expiryDate: parseGs1Expiry(
                  expiryMatch?.group(1) ?? '',
                ),
              );
            }

            String gtin = '';
            String lot = '';
            String serial = '';
            String catalog = '';

            DateTime? expiryDate;

            int index = 0;

            while (index < raw.length) {
              if (raw.codeUnitAt(index) == 29) {
                index++;
                continue;
              }

              if (raw.startsWith('01', index) &&
                  index + 16 <= raw.length) {
                gtin = raw.substring(
                  index + 2,
                  index + 16,
                );

                index += 16;
                continue;
              }

              if (raw.startsWith('17', index) &&
                  index + 8 <= raw.length) {
                expiryDate = parseGs1Expiry(
                  raw.substring(
                    index + 2,
                    index + 8,
                  ),
                );

                index += 8;
                continue;
              }

              if (raw.startsWith('240', index)) {
                final VariableField field =
                    readVariableField(
                  raw,
                  index + 3,
                );

                catalog = field.value;
                index = field.nextIndex;
                continue;
              }

              if (raw.startsWith('21', index)) {
                final VariableField field =
                    readVariableField(
                  raw,
                  index + 2,
                );

                serial = field.value;
                index = field.nextIndex;
                continue;
              }

              if (raw.startsWith('10', index)) {
                final VariableField field =
                    readVariableField(
                  raw,
                  index + 2,
                );

                lot = field.value;
                index = field.nextIndex;
                continue;
              }

              index++;
            }

            return ParsedGs1(
              raw: input,
              gtin: gtin,
              lot: lot,
              serial: serial,
              catalog: catalog,
              expiryDate: expiryDate,
            );
          }

          class AppStore extends ChangeNotifier {
            static const String usersKey =
                'smartchem_users_v310';

            static const String materialsKey =
                'smartchem_materials_v310';

            late SharedPreferences preferences;

            final List<UserAccount> users =
                <UserAccount>[];

            final List<MaterialRecord> materials =
                <MaterialRecord>[];

            UserAccount? currentUser;

            Future<void> load() async {
              preferences =
                  await SharedPreferences.getInstance();

              final String? usersValue =
                  preferences.getString(usersKey);

              final String? materialsValue =
                  preferences.getString(materialsKey);

              if (usersValue != null &&
                  usersValue.isNotEmpty) {
                final List<dynamic> decoded =
                    jsonDecode(usersValue)
                        as List<dynamic>;

                users.addAll(
                  decoded.map(
                    (dynamic item) =>
                        UserAccount.fromJson(
                      Map<String, dynamic>.from(
                        item as Map<dynamic, dynamic>,
                      ),
                    ),
                  ),
                );
              }

              if (users.isEmpty) {
                users.addAll(
                  <UserAccount>[
                    UserAccount(
                      id: 'admin',
                      name: 'المستخدم الرئيسي',
                      username: 'admin',
                      password: '1234',
                      isAdmin: true,
                    ),
                    UserAccount(
                      id: 'user1',
                      name: 'المستخدم الأول',
                      username: 'user1',
                      password: '1234',
                      isAdmin: false,
                    ),
                    UserAccount(
                      id: 'user2',
                      name: 'المستخدم الثاني',
                      username: 'user2',
                      password: '1234',
                      isAdmin: false,
                    ),
                  ],
                );

                await saveUsers();
              }

              if (materialsValue != null &&
                  materialsValue.isNotEmpty) {
                final List<dynamic> decoded =
                    jsonDecode(materialsValue)
                        as List<dynamic>;

                materials.addAll(
                  decoded.map(
                    (dynamic item) =>
                        MaterialRecord.fromJson(
                      Map<String, dynamic>.from(
                        item as Map<dynamic, dynamic>,
                      ),
                    ),
                  ),
                );
              }

              notifyListeners();
            }

            UserAccount? login(
              String username,
              String password,
            ) {
              for (final UserAccount user in users) {
                if (user.username.trim() ==
                        username.trim() &&
                    user.password == password &&
                    user.isActive) {
                  currentUser = user;
                  return user;
                }
              }

              return null;
            }

            Future<void> saveUsers() async {
              await preferences.setString(
                usersKey,
                jsonEncode(
                  users
                      .map(
                        (UserAccount user) =>
                            user.toJson(),
                      )
                      .toList(),
                ),
              );

              notifyListeners();
            }

            Future<void> saveMaterials() async {
              await preferences.setString(
                materialsKey,
                jsonEncode(
                  materials
                      .map(
                        (MaterialRecord material) =>
                            material.toJson(),
                      )
                      .toList(),
                ),
              );

              notifyListeners();
            }

            MaterialRecord? materialById(
              String id,
            ) {
              for (final MaterialRecord material
                  in materials) {
                if (material.id == id) {
                  return material;
                }
              }

              return null;
            }

            MaterialRecord? findMaterial(
              String barcode,
              ParsedGs1 parsed,
            ) {
              final String normalized =
                  normalizeBarcode(barcode);

              for (final MaterialRecord material
                  in materials) {
                if (normalizeBarcode(
                      material.barcode,
                    ) ==
                    normalized) {
                  return material;
                }
              }

              if (parsed.serial.isNotEmpty) {
                for (final MaterialRecord material
                    in materials) {
                  if (material.serialNumber ==
                      parsed.serial) {
                    return material;
                  }
                }
              }

              if (parsed.gtin.isNotEmpty &&
                  parsed.lot.isNotEmpty) {
                for (final MaterialRecord material
                    in materials) {
                  if (material.gtin == parsed.gtin &&
                      material.lotNumber ==
                          parsed.lot &&
                      material.catalogNumber ==
                          parsed.catalog) {
                    return material;
                  }
                }
              }

              return null;
            }

            Future<void> registerMaterial(
              MaterialRecord material,
            ) async {
              materials.insert(
                0,
                material,
              );

              await saveMaterials();
            }

            Future<String?> recordUsage({
              required String materialId,
              required double quantity,
              required String note,
            }) async {
              final MaterialRecord? material =
                  materialById(materialId);

              if (material == null) {
                return 'لم يتم العثور على المادة';
              }

              if (material.isExpired) {
                return 'لا يمكن استخدام مادة منتهية الصلاحية';
              }

              if (quantity <= 0) {
                return 'الكمية المستخدمة يجب أن تكون أكبر من صفر';
              }

              final double before =
                  material.remainingQuantity;

              if (quantity > before) {
                return 'الكمية المستخدمة أكبر من الكمية المتبقية';
              }

              final double after = before - quantity;

              material.totalUsed += quantity;

              material.usageHistory.insert(
                0,
                UsageRecord(
                  id: DateTime.now()
                      .microsecondsSinceEpoch
                      .toString(),
                  employeeName:
                      currentUser?.name ?? 'غير معروف',
                  quantityUsed: quantity,
                  quantityBefore: before,
                  quantityAfter: after,
                  createdAt: DateTime.now(),
                  note: note,
                ),
              );

              await saveMaterials();

              return null;
            }

            Future<String?> addUser({
              required String name,
              required String username,
              required String password,
              required bool isAdmin,
            }) async {
              for (final UserAccount user in users) {
                if (user.username.toLowerCase() ==
                    username.toLowerCase()) {
                  return 'اسم المستخدم موجود مسبقًا';
                }
              }

              users.add(
                UserAccount(
                  id: DateTime.now()
                      .microsecondsSinceEpoch
                      .toString(),
                  name: name,
                  username: username,
                  password: password,
                  isAdmin: isAdmin,
                ),
              );

              await saveUsers();

              return null;
            }
          }

          class SmartChemApp extends StatelessWidget {
            const SmartChemApp({
              super.key,
              required this.store,
            });

            final AppStore store;

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'SmartChem Track',
                debugShowCheckedModeBanner: false,
                builder: (
                  BuildContext context,
                  Widget? child,
                ) {
                  return Directionality(
                    textDirection: TextDirection.rtl,
                    child:
                        child ?? const SizedBox.shrink(),
                  );
                },
                theme: ThemeData(
                  useMaterial3: true,
                  colorScheme: ColorScheme.fromSeed(
                    seedColor:
                        const Color(0xFF006C70),
                  ),
                  scaffoldBackgroundColor:
                      const Color(0xFFF4F8F8),
                  inputDecorationTheme:
                      const InputDecorationTheme(
                    filled: true,
                    border: OutlineInputBorder(),
                  ),
                ),
                home: LoginScreen(
                  store: store,
                ),
              );
            }
          }

          class LoginScreen extends StatefulWidget {
            const LoginScreen({
              super.key,
              required this.store,
            });

            final AppStore store;

            @override
            State<LoginScreen> createState() {
              return _LoginScreenState();
            }
          }

          class _LoginScreenState
              extends State<LoginScreen> {
            final TextEditingController
                usernameController =
                TextEditingController(
              text: 'admin',
            );

            final TextEditingController
                passwordController =
                TextEditingController(
              text: '1234',
            );

            String errorMessage = '';

            void login() {
              final UserAccount? user =
                  widget.store.login(
                usernameController.text,
                passwordController.text,
              );

              if (user == null) {
                setState(() {
                  errorMessage =
                      'بيانات الدخول غير صحيحة أو الحساب موقوف';
                });

                return;
              }

              Navigator.of(context).pushReplacement(
                MaterialPageRoute<void>(
                  builder: (
                    BuildContext context,
                  ) {
                    return HomeScreen(
                      store: widget.store,
                    );
                  },
                ),
              );
            }

            @override
            void dispose() {
              usernameController.dispose();
              passwordController.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: Center(
                    child: SingleChildScrollView(
                      padding:
                          const EdgeInsets.all(24),
                      child: ConstrainedBox(
                        constraints:
                            const BoxConstraints(
                          maxWidth: 520,
                        ),
                        child: Card(
                          child: Padding(
                            padding:
                                const EdgeInsets.all(
                              24,
                            ),
                            child: Column(
                              crossAxisAlignment:
                                  CrossAxisAlignment
                                      .stretch,
                              children: <Widget>[
                                const CircleAvatar(
                                  radius: 45,
                                  child: Icon(
                                    Icons.science,
                                    size: 52,
                                  ),
                                ),
                                const SizedBox(
                                  height: 14,
                                ),
                                const Text(
                                  'SmartChem Track',
                                  textAlign:
                                      TextAlign.center,
                                  style: TextStyle(
                                    fontSize: 28,
                                    fontWeight:
                                        FontWeight.bold,
                                  ),
                                ),
                                const Text(
                                  'الإصدار 3.1.0',
                                  textAlign:
                                      TextAlign.center,
                                ),
                                const SizedBox(
                                  height: 24,
                                ),
                                TextField(
                                  controller:
                                      usernameController,
                                  decoration:
                                      const InputDecoration(
                                    labelText:
                                        'اسم المستخدم',
                                    prefixIcon: Icon(
                                      Icons.person,
                                    ),
                                  ),
                                ),
                                const SizedBox(
                                  height: 12,
                                ),
