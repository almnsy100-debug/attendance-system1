              final UserRecord actor =
                  controller.currentUser!;

              final ScannedCode? scan =
                  await Navigator.of(context)
                      .push<ScannedCode>(
                MaterialPageRoute<ScannedCode>(
                  builder:
                      (BuildContext context) {
                    return const ScannerScreen();
                  },
                ),
              );

              if (scan == null ||
                  !context.mounted) {
                return;
              }

              final ParsedGs1 parsed =
                  parseGs1(scan.rawValue);

              final MaterialRecord? existing =
                  await controller.db.findMaterial(
                rawBarcode: scan.rawValue,
                parsed: parsed,
              );

              if (!context.mounted) {
                return;
              }

              if (existing != null) {
                await Navigator.of(context).push(
                  MaterialPageRoute<void>(
                    builder:
                        (BuildContext context) {
                      return MaterialDetailsScreen(
                        controller: controller,
                        materialId: existing.id,
                      );
                    },
                  ),
                );

                controller.refresh();
                return;
              }

              if (!actor.isSuperAdmin) {
                ScaffoldMessenger.of(context)
                    .showSnackBar(
                  SnackBar(
                    content: Text(
                      AppLocalizations.of(context)
                          .adminOnly,
                    ),
                  ),
