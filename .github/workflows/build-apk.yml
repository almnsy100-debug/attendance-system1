            Future<void> downloadTemplate() async {
              final AppLocalizations text =
                  AppLocalizations.of(context);

              final xls.Excel excel =
                  xls.Excel.createExcel();

              final xls.Sheet sheet =
                  excel['Users'];

              sheet.isRTL = true;

              sheet.appendRow(
                <xls.CellValue>[
                  const xls.TextCellValue(
                    'اسم الشخص',
                  ),
                  const xls.TextCellValue(
                    'اسم المستخدم',
                  ),
                  const xls.TextCellValue(
                    'الرقم السري',
                  ),
                  const xls.TextCellValue(
                    'الرقم الوظيفي',
                  ),
                  const xls.TextCellValue(
                    'القسم',
                  ),
                  const xls.TextCellValue(
                    'الدور',
                  ),
                  const xls.TextCellValue(
                    'حالة الحساب',
                  ),
                ],
              );

              sheet.appendRow(
                <xls.CellValue>[
                  const xls.TextCellValue(
                    'مثال مستخدم',
                  ),
                  const xls.TextCellValue(
                    'example.user',
                  ),
                  const xls.TextCellValue(
                    'Example@1234',
                  ),
                  const xls.TextCellValue(
                    '1001',
                  ),
                  const xls.TextCellValue(
                    'المختبر',
                  ),
                  const xls.TextCellValue(
                    'user',
                  ),
                  const xls.TextCellValue(
                    'active',
                  ),
                ],
              );

              excel.delete('Sheet1');

              final List<int>? bytes =
                  excel.save();

              if (bytes == null) {
                return;
              }

              final Directory directory =
                  await getTemporaryDirectory();

              final File file = File(
                path_util.join(
                  directory.path,
                  'SmartChem_Users_Template.xlsx',
                ),
              );

              await file.writeAsBytes(bytes);

              await Share.shareXFiles(
                <XFile>[
                  XFile(file.path),
                ],
                text: text.excelTemplate,
              );
            }

            Future<void> importUsers() async {
              final AppLocalizations text =
                  AppLocalizations.of(context);

              final FilePickerResult? result =
                  await FilePicker.platform.pickFiles(
                type: FileType.custom,
                allowedExtensions: <String>[
                  'xlsx',
                ],
              );

              final String? filePath =
                  result?.files.single.path;

              if (filePath == null) {
                return;
              }

              final Uint8List bytes =
                  await File(filePath)
                      .readAsBytes();

              final xls.Excel workbook =
                  xls.Excel.decodeBytes(bytes);

              if (workbook.tables.isEmpty) {
                return;
              }

              final xls.Sheet sheet =
                  workbook.tables.values.first;

              if (sheet.rows.isEmpty) {
                return;
              }

              final List<String> headers =
                  sheet.rows.first
                      .map(
                        (xls.Data? cell) =>
                            cell?.value
                                .toString()
                                .trim() ??
                            '',
                      )
                      .toList();

              int indexOf(
                List<String> names,
              ) {
                for (final String name in names) {
                  final int index =
                      headers.indexWhere(
                    (String header) =>
                        header.toLowerCase() ==
                        name.toLowerCase(),
                  );

                  if (index >= 0) {
                    return index;
                  }
                }

                return -1;
              }

              final int nameIndex = indexOf(
                <String>[
                  'اسم الشخص',
                  'full name',
                ],
              );

              final int usernameIndex = indexOf(
                <String>[
                  'اسم المستخدم',
                  'username',
                ],
              );

              final int passwordIndex = indexOf(
                <String>[
                  'الرقم السري',
                  'password',
                ],
              );

              final int employeeIndex = indexOf(
                <String>[
                  'الرقم الوظيفي',
                  'employee number',
                ],
              );

              final int departmentIndex = indexOf(
                <String>[
                  'القسم',
                  'department',
                ],
              );

              final int roleIndex = indexOf(
                <String>[
                  'الدور',
                  'role',
                ],
              );

              final int activeIndex = indexOf(
                <String>[
                  'حالة الحساب',
                  'account status',
                ],
              );

              if (nameIndex < 0 ||
                  usernameIndex < 0 ||
                  passwordIndex < 0) {
                if (mounted) {
                  ScaffoldMessenger.of(context)
                      .showSnackBar(
                    SnackBar(
                      content:
                          Text(text.enterRequired),
                    ),
                  );
                }

                return;
              }

              final List<Map<String, String>>
                  validRows =
                  <Map<String, String>>[];

              final List<String> errors =
                  <String>[];

              final Set<String> usernames =
                  <String>{};

              for (int rowIndex = 1;
                  rowIndex < sheet.rows.length;
                  rowIndex++) {
                final List<xls.Data?> row =
                    sheet.rows[rowIndex];

                String valueAt(int index) {
                  if (index < 0 ||
                      index >= row.length) {
                    return '';
                  }

                  return row[index]
                          ?.value
                          .toString()
                          .trim() ??
                      '';
                }

                final String fullName =
                    valueAt(nameIndex);

                final String username =
                    valueAt(usernameIndex);

                final String password =
                    valueAt(passwordIndex);

                if (fullName.isEmpty ||
                    username.isEmpty ||
                    password.isEmpty) {
                  errors.add(
                    'Row ${rowIndex + 1}: required data missing',
                  );

                  continue;
                }

                if (!usernames.add(
                  username.toLowerCase(),
                )) {
                  errors.add(
                    'Row ${rowIndex + 1}: duplicate username',
                  );

                  continue;
                }

                validRows.add(
                  <String, String>{
                    'full_name': fullName,
                    'username': username,
                    'password': password,
                    'employee_no':
                        valueAt(employeeIndex),
                    'department':
                        valueAt(departmentIndex),
                    'role':
                        valueAt(roleIndex),
                    'active':
                        valueAt(activeIndex),
                  },
                );
              }

              if (!mounted) {
                return;
              }

              final bool? confirmed =
                  await showDialog<bool>(
                context: context,
                builder:
                    (BuildContext dialogContext) {
                  return AlertDialog(
                    title:
                        Text(text.importExcel),
                    content: Text(
                      'Valid: ${validRows.length}\n'
                      'Errors: ${errors.length}\n\n'
                      '${errors.take(10).join('\n')}',
                    ),
                    actions: <Widget>[
                      TextButton(
                        onPressed: () {
                          Navigator.of(
                            dialogContext,
                          ).pop(false);
                        },
                        child:
                            Text(text.cancel),
                      ),
                      FilledButton(
                        onPressed:
                            validRows.isEmpty
                                ? null
                                : () {
                                    Navigator.of(
                                      dialogContext,
                                    ).pop(true);
                                  },
                        child:
                            Text(text.confirm),
                      ),
                    ],
                  );
                },
              );

              if (confirmed != true) {
                return;
              }

              int imported = 0;
              int failed = 0;

              for (final Map<String, String> row
                  in validRows) {
                try {
                  final String role =
                      row['role']
                                  ?.toLowerCase() ==
                              'super_admin'
                          ? 'super_admin'
                          : 'user';

                  final String activeText =
                      row['active']
                              ?.toLowerCase() ??
                          '';

                  await widget.controller.db
                      .saveUser(
                    actor: widget
                        .controller.currentUser!,
                    fullName:
                        row['full_name']!,
                    username:
                        row['username']!,
                    password:
                        row['password']!,
                    employeeNo:
                        row['employee_no'] ?? '',
                    department:
                        row['department'] ?? '',
                    role: role,
                    isActive:
                        activeText != 'inactive' &&
                            activeText != 'موقوف',
                    isArchived: false,
                    reason:
                        'Excel import: '
                        '${result!.files.single.name}',
                  );

                  imported++;
                } catch (error) {
                  failed++;
                }
              }

              await widget.controller.db.audit(
                actor:
                    widget.controller.currentUser!,
                entityType: 'user_import',
                entityId: null,
                action: 'IMPORT_USERS_EXCEL',
                newValue:
                    'imported=$imported, failed=$failed',
                reason:
                    result.files.single.name,
              );

              await load();

              if (mounted) {
                ScaffoldMessenger.of(context)
                    .showSnackBar(
                  SnackBar(
                    content: Text(
                      'Imported: $imported, '
                      'Failed: $failed',
                    ),
                  ),
                );
              }
            }

            @override
            Widget build(BuildContext context) {
              final AppLocalizations text =
