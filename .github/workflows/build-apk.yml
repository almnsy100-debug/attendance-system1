          class InventoryScreen extends StatefulWidget {
            const InventoryScreen({super.key});

            @override
            State<InventoryScreen> createState() {
              return _InventoryScreenState();
            }
          }

          class _InventoryScreenState
              extends State<InventoryScreen> {
            Color statusColor(ItemStatus status) {
              switch (status) {
                case ItemStatus.valid:
                  return Colors.green;
                case ItemStatus.nearExpiry:
                  return Colors.amber;
                case ItemStatus.expired:
                  return Colors.red;
                case ItemStatus.unapproved:
                  return Colors.orange;
                case ItemStatus.empty:
                  return Colors.grey;
              }
            }

            String statusName(ItemStatus status) {
              switch (status) {
                case ItemStatus.valid:
                  return 'صالح';
                case ItemStatus.nearExpiry:
                  return 'قريب الانتهاء';
                case ItemStatus.expired:
                  return 'منتهي';
                case ItemStatus.unapproved:
                  return 'غير معتمد';
                case ItemStatus.empty:
                  return 'نفدت الكمية';
              }
            }

            Future<void> useItem(LabItem item) async {
              final user = AppData.currentUser!;
              final status = item.status();

              if (!user.canUseMaterials) {
                ScaffoldMessenger.of(context)
                    .showSnackBar(
                  const SnackBar(
                    content: Text(
                      'ليس لديك صلاحية تسجيل الاستخدام',
                    ),
                  ),
                );
                return;
              }

              if (status == ItemStatus.expired ||
                  status == ItemStatus.unapproved ||
                  status == ItemStatus.empty) {
                ScaffoldMessenger.of(context)
                    .showSnackBar(
                  SnackBar(
                    backgroundColor:
                        statusColor(status),
                    content: Text(
                      status == ItemStatus.expired
                          ? 'لا يمكن الاستخدام: المادة منتهية'
                          : status == ItemStatus.unapproved
                              ? 'لا يمكن الاستخدام: المادة غير معتمدة'
                              : 'لا يمكن الاستخدام: نفدت الكمية',
                    ),
                  ),
                );

                return;
              }

              if (status == ItemStatus.nearExpiry) {
                final continueUse =
                    await showDialog<bool>(
                  context: context,
                  builder: (_) => AlertDialog(
                    title: const Text(
                      'تنبيه قرب انتهاء الصلاحية',
                    ),
                    content: Text(
                      'المادة ${item.name} قريبة الانتهاء.\n'
                      'تاريخ الانتهاء: '
                      '${DateFormat('dd/MM/yyyy').format(item.expiry)}',
                    ),
                    actions: [
                      TextButton(
                        onPressed: () {
                          Navigator.pop(context, false);
                        },
                        child: const Text('إلغاء'),
                      ),
                      FilledButton(
                        onPressed: () {
                          Navigator.pop(context, true);
                        },
                        child: const Text('متابعة'),
                      ),
                    ],
                  ),
                );

                if (continueUse != true) {
                  return;
                }
              }

              final controller =
                  TextEditingController(text: '1');

              final used =
                  await showDialog<double>(
                context: context,
                builder: (_) => AlertDialog(
                  title: Text(
                    'تسجيل استخدام ${item.name}',
                  ),
                  content: TextField(
                    controller: controller,
                    keyboardType:
                        const TextInputType.numberWithOptions(
                      decimal: true,
                    ),
                    decoration: InputDecoration(
                      labelText:
                          'الكمية المستخدمة - المتبقي ${item.remaining}',
                    ),
                  ),
                  actions: [
                    TextButton(
                      onPressed: () {
                        Navigator.pop(context);
                      },
                      child: const Text('إلغاء'),
                    ),
                    FilledButton(
                      onPressed: () {
                        Navigator.pop(
                          context,
                          double.tryParse(
                            controller.text,
                          ),
                        );
                      },
                      child: const Text('حفظ'),
                    ),
                  ],
                ),
              );

              controller.dispose();

              if (used == null ||
                  used <= 0 ||
                  used > item.remaining) {
                return;
              }

              setState(() {
                item.usedQuantity += used;
                item.openedAt ??= DateTime.now();

                AppData.usage.insert(
                  0,
                  UsageRecord(
                    material: item.name,
                    employee: user.name,
                    device: item.device,
                    quantity: used,
                    dateTime: DateTime.now(),
                  ),
                );
              });

              ScaffoldMessenger.of(context).showSnackBar(
                const SnackBar(
                  content: Text(
                    'تم تسجيل الاستخدام بنجاح',
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('المخزون'),
                ),
                body: AppData.materials.isEmpty
                    ? const Center(
                        child: Text(
                          'لا توجد مواد مسجلة',
                        ),
                      )
                    : ListView.separated(
                        padding:
                            const EdgeInsets.all(12),
                        itemCount:
                            AppData.materials.length,
                        separatorBuilder: (_, __) {
                          return const SizedBox(
                            height: 8,
                          );
                        },
                        itemBuilder: (_, index) {
                          final item =
                              AppData.materials[index];

                          final status =
                              item.status();

                          return Card(
                            child: ListTile(
                              leading: CircleAvatar(
                                backgroundColor:
                                    statusColor(status),
                                child: const Icon(
                                  Icons.science,
                                  color: Colors.white,
                                ),
                              ),
                              title: Text(item.name),
                              subtitle: Text(
                                '${item.type} • ${item.device}\n'
                                'LOT: ${item.lot}\n'
                                'الانتهاء: '
                                '${DateFormat('dd/MM/yyyy').format(item.expiry)}\n'
                                'المتبقي: ${item.remaining}',
                              ),
                              isThreeLine: false,
                              trailing: Text(
                                statusName(status),
                                style: TextStyle(
                                  color:
                                      statusColor(status),
                                  fontWeight:
                                      FontWeight.bold,
                                ),
                              ),
                              onTap: () {
                                useItem(item);
                              },
                            ),
                          );
                        },
                      ),
              );
            }
          }

          class ReportsScreen extends StatelessWidget {
            const ReportsScreen({super.key});

            double total(Duration period) {
              final start =
                  DateTime.now().subtract(period);

              return AppData.usage
                  .where(
                    (record) =>
                        record.dateTime.isAfter(start),
                  )
                  .fold<double>(
                    0.0,
                    (sum, record) =>
                        sum + record.quantity,
                  );
            }

            int operations(Duration period) {
              final start =
                  DateTime.now().subtract(period);

              return AppData.usage
                  .where(
                    (record) =>
                        record.dateTime.isAfter(start),
                  )
                  .length;
            }

            Widget report(
              BuildContext context,
              String title,
              Duration period,
            ) {
              return Card(
                child: Padding(
                  padding: const EdgeInsets.all(16),
                  child: Column(
                    crossAxisAlignment:
                        CrossAxisAlignment.start,
                    children: [
                      Text(
                        title,
                        style: Theme.of(context)
                            .textTheme
                            .titleLarge,
                      ),
                      const SizedBox(height: 8),
                      Text(
                        'عدد عمليات الاستخدام: '
                        '${operations(period)}',
                      ),
                      Text(
                        'إجمالي الكمية المستخدمة: '
                        '${total(period)}',
                      ),
                    ],
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('التقارير'),
                ),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    report(
                      context,
                      'التقرير اليومي',
                      const Duration(days: 1),
                    ),
                    const SizedBox(height: 10),
                    report(
                      context,
                      'التقرير الأسبوعي',
                      const Duration(days: 7),
                    ),
                    const SizedBox(height: 10),
                    report(
                      context,
                      'التقرير الشهري',
                      const Duration(days: 30),
                    ),
                    const SizedBox(height: 18),
                    Text(
                      'آخر عمليات الاستخدام',
                      style:
                          Theme.of(context).textTheme.titleLarge,
                    ),
                    const SizedBox(height: 8),
                    if (AppData.usage.isEmpty)
                      const Card(
                        child: Padding(
                          padding: EdgeInsets.all(16),
                          child: Text(
                            'لا توجد عمليات استخدام مسجلة',
                          ),
                        ),
                      ),
                    ...AppData.usage.take(20).map(
                      (record) {
                        return Padding(
                          padding:
                              const EdgeInsets.only(bottom: 8),
                          child: Card(
                            child: ListTile(
                              title: Text(record.material),
                              subtitle: Text(
                                '${record.employee} • '
                                '${record.device}\n'
                                '${DateFormat('dd/MM/yyyy HH:mm').format(record.dateTime)}',
                              ),
                              trailing: Text(
                                record.quantity.toString(),
                              ),
                            ),
                          ),
                        );
                      },
                    ),
                  ],
                ),
              );
            }
          }

          class AdminScreen extends StatefulWidget {
            const AdminScreen({super.key});

            @override
            State<AdminScreen> createState() {
              return _AdminScreenState();
            }
          }

          class _AdminScreenState
              extends State<AdminScreen> {
            Future<void> addUser() async {
              final name = TextEditingController();
              final username =
                  TextEditingController();
              final password =
                  TextEditingController(text: '1234');

              bool admin = false;

              final save =
                  await showDialog<bool>(
                context: context,
                builder: (_) => StatefulBuilder(
                  builder:
                      (context, updateDialog) {
                    return AlertDialog(
                      title:
                          const Text('إضافة مستخدم'),
                      content: SingleChildScrollView(
                        child: Column(
                          mainAxisSize:
                              MainAxisSize.min,
                          children: [
                            TextField(
                              controller: name,
                              decoration:
                                  const InputDecoration(
                                labelText: 'الاسم',
                              ),
                            ),
                            const SizedBox(height: 8),
                            TextField(
                              controller: username,
                              decoration:
                                  const InputDecoration(
                                labelText:
                                    'اسم المستخدم',
                              ),
                            ),
                            const SizedBox(height: 8),
                            TextField(
                              controller: password,
                              decoration:
                                  const InputDecoration(
                                labelText:
                                    'كلمة المرور',
                              ),
                            ),
                            SwitchListTile(
                              title: const Text(
                                'مستخدم رئيسي',
                              ),
                              value: admin,
                              onChanged: (value) {
                                updateDialog(() {
                                  admin = value;
                                });
                              },
                            ),
                          ],
                        ),
                      ),
                      actions: [
                        TextButton(
                          onPressed: () {
                            Navigator.pop(
                              context,
                              false,
                            );
                          },
                          child:
                              const Text('إلغاء'),
                        ),
                        FilledButton(
                          onPressed: () {
                            Navigator.pop(
                              context,
                              true,
                            );
                          },
                          child:
                              const Text('إضافة'),
                        ),
                      ],
                    );
                  },
                ),
              );

              if (save == true &&
                  name.text.trim().isNotEmpty &&
                  username.text.trim().isNotEmpty &&
                  password.text.isNotEmpty) {
                final duplicate = AppData.users.any(
                  (user) =>
                      user.username ==
                      username.text.trim(),
                );

                if (duplicate) {
                  if (mounted) {
                    ScaffoldMessenger.of(context)
                        .showSnackBar(
                      const SnackBar(
                        content: Text(
                          'اسم المستخدم موجود مسبقًا',
                        ),
                      ),
                    );
                  }
                } else {
                  setState(() {
                    AppData.users.add(
                      AppUser(
                        name: name.text.trim(),
                        username:
                            username.text.trim(),
                        password: password.text,
                        admin: admin,
                      ),
                    );
                  });
                }
              }

              name.dispose();
              username.dispose();
              password.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text(
                    'لوحة المستخدم الرئيسي',
                  ),
                ),
                floatingActionButton:
                    FloatingActionButton.extended(
                  onPressed: addUser,
                  icon: const Icon(
                    Icons.person_add_alt_1,
                  ),
                  label: const Text(
                    'إضافة مستخدم',
                  ),
                ),
                body: ListView.separated(
                  padding: const EdgeInsets.all(12),
                  itemCount: AppData.users.length,
                  separatorBuilder: (_, __) {
                    return const SizedBox(height: 8);
                  },
                  itemBuilder: (_, index) {
                    final user =
                        AppData.users[index];

                    final current =
                        user == AppData.currentUser;

                    return Card(
                      child: ExpansionTile(
                        leading: Icon(
                          user.admin
                              ? Icons.admin_panel_settings
                              : Icons.person_outline,
                        ),
                        title: Text(user.name),
                        subtitle: Text(
                          '${user.username} • '
                          '${user.admin ? 'رئيسي' : 'عادي'}'
                          '${current ? ' • الحساب الحالي' : ''}',
                        ),
                        trailing: Switch(
                          value: user.active,
                          onChanged: current
                              ? null
                              : (value) {
                                  setState(() {
                                    user.active = value;
                                  });
                                },
                        ),
                        children: [
                          SwitchListTile(
                            title: const Text(
                              'السماح بمسح الباركود',
                            ),
                            value: user.canScan,
                            onChanged: (value) {
                              setState(() {
                                user.canScan = value;
                              });
                            },
                          ),
                          SwitchListTile(
                            title: const Text(
                              'السماح بتسجيل الاستخدام',
                            ),
                            value:
                                user.canUseMaterials,
                            onChanged: (value) {
                              setState(() {
                                user.canUseMaterials =
                                    value;
                              });
                            },
                          ),
                          SwitchListTile(
                            title: const Text(
                              'عرض التقارير',
                            ),
                            value: user.canReports,
                            onChanged: (value) {
                              setState(() {
                                user.canReports =
                                    value;
                              });
                            },
                          ),
                        ],
                      ),
                    );
                  },
                ),
              );
            }
          }
          DART

      - name: Configure Android application
        working-directory: smartchem_v2
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text(encoding="utf-8")

          permission = (
              '<uses-permission '
              'android:name="android.permission.CAMERA" />'
          )

          if permission not in text:
              position = text.find(">")

              text = (
                  text[:position + 1]
                  + "\n    "
                  + permission
                  + text[position + 1:]
              )

          text = text.replace(
              'android:label="smartchem_track_v2"',
              'android:label="SmartChem Track v2"'
          )

          manifest.write_text(
              text,
              encoding="utf-8"
          )

          gradle = Path(
              "android/app/build.gradle.kts"
          )

          if gradle.exists():
              content = gradle.read_text(
                  encoding="utf-8"
              )

              content = content.replace(
                  'applicationId = '
                  '"om.smartchem.smartchem_track_v2"',
                  'applicationId = '
                  '"om.smartchem.track.v2"'
              )

              content = content.replace(
                  "minSdk = flutter.minSdkVersion",
                  "minSdk = 23"
              )

              gradle.write_text(
                  content,
                  encoding="utf-8"
              )
          PY

      - name: Analyze application
        working-directory: smartchem_v2
        run: flutter analyze

      - name: Build SmartChem Track v2 APK
        working-directory: smartchem_v2
        run: |
          flutter build apk \
            --release \
            --build-name=2.0.1 \
            --build-number=3

      - name: Rename APK
        run: |
          cp smartchem_v2/build/app/outputs/flutter-apk/app-release.apk SmartChemTrack-v2.0.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartChemTrack-v2.0.1-APK
          path: SmartChemTrack-v2.0.1.apk
          retention-days: 30
          if-no-files-found: error
