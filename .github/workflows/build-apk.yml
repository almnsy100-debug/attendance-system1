name: Build SmartChem Track v4.0.7

on:
  workflow_dispatch:
  push:
    branches:
      - smartchem-apk-build

permissions:
  contents: read

concurrency:
  group: smartchem-v4-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build SmartChem Track v4.0.7 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show build environment
        shell: bash
        run: |
          set -e

          echo "========== FLUTTER =========="
          flutter --version

          echo "========== DART =========="
          dart --version

          echo "========== JAVA =========="
          java -version

          echo "========== ANDROID =========="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          flutter doctor -v

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -e

          SDKMANAGER=""

          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -x "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973"

          echo "Android SDK 36 and NDK installed"

      - name: Create clean Flutter project
        shell: bash
        run: |
          set -e

          rm -rf smartchem_v4

          flutter create smartchem_v4 \
            --platforms=android \
            --org om.smartchem.track \
            --project-name production

          rm -rf smartchem_v4/test
          rm -f smartchem_v4/analysis_options.yaml

          mkdir -p smartchem_v4/lib/l10n
          mkdir -p smartchem_v4/test

          echo "Clean Flutter project created"

      - name: Recover complete SmartChem application
        shell: bash
        run: |
          set -e

          SOURCE_COMMIT="9f81a3414472d86e3cb0aa820e8863967994d03c"
          SOURCE_WORKFLOW="/tmp/smartchem-v4-original.yml"

          if ! git cat-file -e "${SOURCE_COMMIT}^{commit}" 2>/dev/null; then
            git fetch origin "${SOURCE_COMMIT}"
          fi

          git show \
            "${SOURCE_COMMIT}:.github/workflows/build-apk.yml" \
            > "${SOURCE_WORKFLOW}"

          python3 - <<'PY'
          from pathlib import Path

          source_path = Path(
              "/tmp/smartchem-v4-original.yml"
          )

          source_lines = source_path.read_text(
              encoding="utf-8"
          ).splitlines()

          def extract_block(
              start_marker: str,
              end_marker: str,
              destination_path: str,
          ) -> None:
              collecting = False
              end_found = False
              output_lines: list[str] = []

              for line in source_lines:
                  if not collecting:
                      if start_marker in line:
                          collecting = True
                      continue

                  if line.strip() == end_marker:
                      end_found = True
                      break

                  if line.startswith("          "):
                      line = line[10:]

                  output_lines.append(line)

              if not collecting:
                  raise SystemExit(
                      f"Start marker not found: {start_marker}"
                  )

              if not end_found:
                  raise SystemExit(
                      f"End marker not found: {end_marker}"
                  )

              if not output_lines:
                  raise SystemExit(
                      f"No source extracted for: {destination_path}"
                  )

              destination = Path(destination_path)

              destination.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              destination.write_text(
                  "\n".join(output_lines) + "\n",
                  encoding="utf-8",
              )

              print(
                  f"Recovered {destination_path}: "
                  f"{len(output_lines)} lines"
              )

          blocks = [
              (
                  "cat > smartchem_v4/pubspec.yaml "
                  "<<'PUBSPEC'",
                  "PUBSPEC",
                  "smartchem_v4/pubspec.yaml",
              ),
              (
                  "cat > smartchem_v4/l10n.yaml "
                  "<<'L10N'",
                  "L10N",
                  "smartchem_v4/l10n.yaml",
              ),
              (
                  "cat > "
                  "smartchem_v4/lib/l10n/app_ar.arb "
                  "<<'AR'",
                  "AR",
                  "smartchem_v4/lib/l10n/app_ar.arb",
              ),
              (
                  "cat > "
                  "smartchem_v4/lib/l10n/app_en.arb "
                  "<<'EN'",
                  "EN",
                  "smartchem_v4/lib/l10n/app_en.arb",
              ),
              (
                  "cat > smartchem_v4/lib/main.dart "
                  "<<'DART'",
                  "DART",
                  "smartchem_v4/lib/main.dart",
              ),
              (
                  "cat > "
                  "smartchem_v4/test/gs1_test.dart "
                  "<<'TEST'",
                  "TEST",
                  "smartchem_v4/test/gs1_test.dart",
              ),
          ]

          for start_marker, end_marker, destination in blocks:
              extract_block(
                  start_marker,
                  end_marker,
                  destination,
              )
          PY

          test -s smartchem_v4/pubspec.yaml
          test -s smartchem_v4/l10n.yaml
          test -s smartchem_v4/lib/main.dart
          test -s smartchem_v4/lib/l10n/app_ar.arb
          test -s smartchem_v4/lib/l10n/app_en.arb
          test -s smartchem_v4/test/gs1_test.dart

          grep -q \
            "class SmartChemApp" \
            smartchem_v4/lib/main.dart

          grep -q \
            "class AppDatabase" \
            smartchem_v4/lib/main.dart

          grep -q \
            "class ScannerScreen" \
            smartchem_v4/lib/main.dart

          grep -q \
            "class InventoryScreen" \
            smartchem_v4/lib/main.dart

          grep -q \
            "class MaterialDetailsScreen" \
            smartchem_v4/lib/main.dart

          grep -q \
            "class UsersScreen" \
            smartchem_v4/lib/main.dart

          echo "Complete SmartChem application recovered"

      - name: Apply SmartChem v4.0.7 corrections
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          pubspec_path = Path(
              "smartchem_v4/pubspec.yaml"
          )

          main_path = Path(
              "smartchem_v4/lib/main.dart"
          )

          arabic_path = Path(
              "smartchem_v4/lib/l10n/app_ar.arb"
          )

          english_path = Path(
              "smartchem_v4/lib/l10n/app_en.arb"
          )

          pubspec = pubspec_path.read_text(
              encoding="utf-8"
          )

          main = main_path.read_text(
              encoding="utf-8"
          )

          arabic = arabic_path.read_text(
              encoding="utf-8"
          )

          english = english_path.read_text(
              encoding="utf-8"
          )

          # -------------------------------------------
          # Version and Dart SDK
          # -------------------------------------------

          pubspec, version_count = re.subn(
              r"(?m)^version:\s*[^\n]+$",
              "version: 4.0.7+8",
              pubspec,
              count=1,
          )

          if version_count != 1:
              raise SystemExit(
                  "Application version could not be updated"
              )

          pubspec, sdk_count = re.subn(
              r'(?m)^(\s*)sdk:\s*"[^"]+"\s*$',
              r'\1sdk: ">=3.7.0 <4.0.0"',
              pubspec,
              count=1,
          )

          if sdk_count != 1:
              raise SystemExit(
                  "Dart SDK constraint could not be updated"
              )

          arabic = re.sub(
              r"الإصدار\s+\d+\.\d+\.\d+",
              "الإصدار 4.0.7",
              arabic,
              count=1,
          )

          english = re.sub(
              r"Version\s+\d+\.\d+\.\d+",
              "Version 4.0.7",
              english,
              count=1,
          )

          # -------------------------------------------
          # Fixed package versions
          # -------------------------------------------

          dependencies = {
              "intl": "0.20.2",
              "mobile_scanner": "7.1.4",
              "sqflite": "2.4.2",
              "path": "1.9.1",
              "crypto": "3.0.6",
              "image_picker": "1.1.2",
              "file_picker": "11.0.2",
              "excel": "4.0.6",
              "pdf": "3.12.0",
              "printing": "5.14.3",
              "path_provider": "2.1.5",
              "share_plus": "11.1.0",
              "cross_file": "0.3.4+2",
          }

          for package, version in dependencies.items():
              pattern = re.compile(
                  rf"(?m)^(\s*)"
                  rf"{re.escape(package)}:"
                  rf"\s*[^\n]+$"
              )

              def dependency_replacement(
                  match: re.Match,
                  package_name: str = package,
                  package_version: str = version,
              ) -> str:
                  return (
                      f"{match.group(1)}"
                      f"{package_name}: "
                      f"{package_version}"
                  )

              pubspec, count = pattern.subn(
                  dependency_replacement,
                  pubspec,
                  count=1,
              )

              if count != 1:
                  raise SystemExit(
                      f"Dependency not found: {package}"
                  )

          # -------------------------------------------
          # PDF table API
          # -------------------------------------------

          main = main.replace(
              "pw.Table.fromTextArray(",
              "pw.TableHelper.fromTextArray(",
          )

          # -------------------------------------------
          # Share Plus API
          # -------------------------------------------

          share_pattern = re.compile(
              r"(?P<indent>^[ \t]*)"
              r"await\s+Share\.shareXFiles\("
              r"\s*<XFile>\["
              r"\s*XFile\(file\.path\),"
              r"\s*\],"
              r"\s*text:\s*"
              r"(?P<label>text\.[A-Za-z0-9_]+),"
              r"\s*\);",
              re.MULTILINE | re.DOTALL,
          )

          def replace_share(
              match: re.Match,
          ) -> str:
              indent = match.group("indent")
              label = match.group("label")

              return (
                  f"{indent}await SharePlus.instance.share(\n"
                  f"{indent}  ShareParams(\n"
                  f"{indent}    files: <XFile>[\n"
                  f"{indent}      XFile(file.path),\n"
                  f"{indent}    ],\n"
                  f"{indent}    text: {label},\n"
                  f"{indent}  ),\n"
                  f"{indent});"
              )

          main, share_count = share_pattern.subn(
              replace_share,
              main,
          )

          print(
              f"Share API replacements: {share_count}"
          )

          if "Share.shareXFiles" in main:
              raise SystemExit(
                  "Deprecated Share API still exists"
              )

          if "SharePlus.instance.share" not in main:
              raise SystemExit(
                  "New Share Plus API was not added"
              )

          # -------------------------------------------
          # Avoid const compatibility issues in Excel
          # -------------------------------------------

          main = main.replace(
              "const xls.TextCellValue(",
              "xls.TextCellValue(",
          )

          main = main.replace(
              "const xls.DoubleCellValue(",
              "xls.DoubleCellValue(",
          )

          main = main.replace(
              "const xls.IntCellValue(",
              "xls.IntCellValue(",
          )

          # -------------------------------------------
          # Scanner widget
          # -------------------------------------------

          scanner_widget_pattern = re.compile(
              r"MobileScanner\(\s*"
              r"controller:\s*scanner,\s*"
              r"onDetect:\s*processCapture,\s*"
              r"\)",
              re.MULTILINE,
          )

          scanner_widget_replacement = (
              "MobileScanner(\n"
              "  controller: scanner,\n"
              "  onDetect: processCapture,\n"
              "  tapToFocus: true,\n"
              "  useAppLifecycleState: false,\n"
              ")"
          )

          main, scanner_widget_count = (
              scanner_widget_pattern.subn(
                  scanner_widget_replacement,
                  main,
                  count=1,
              )
          )

          print(
              f"Scanner widget replacements: "
              f"{scanner_widget_count}"
          )

          if scanner_widget_count == 0:
              if (
                  "tapToFocus: true" not in main
                  or
                  "useAppLifecycleState: false" not in main
              ):
                  raise SystemExit(
                      "Scanner widget could not be corrected"
                  )

          # -------------------------------------------
          # Start camera after first frame
          # -------------------------------------------

          scanner_state_index = main.find(
              "class _ScannerScreenState"
          )

          if scanner_state_index < 0:
              raise SystemExit(
                  "Scanner state class was not found"
              )

          first_start_index = main.find(
              "unawaited(scanner.start());",
              scanner_state_index,
          )

          if first_start_index < 0:
              raise SystemExit(
                  "Initial scanner start was not found"
              )

          previous_frame_index = main.find(
              "addPostFrameCallback",
              scanner_state_index,
              first_start_index,
          )

          if previous_frame_index < 0:
              line_start = main.rfind(
                  "\n",
                  0,
                  first_start_index,
              ) + 1

              line_end = main.find(
                  "\n",
                  first_start_index,
              )

              if line_end < 0:
                  line_end = len(main)

              indentation = main[
                  line_start:first_start_index
              ]

              delayed_start = (
                  f"{indentation}WidgetsBinding.instance\n"
                  f"{indentation}    .addPostFrameCallback((_) {{\n"
                  f"{indentation}  if (mounted) {{\n"
                  f"{indentation}    unawaited(scanner.start());\n"
                  f"{indentation}  }}\n"
                  f"{indentation}}});"
              )

              main = (
                  main[:line_start]
                  + delayed_start
                  + main[line_end:]
              )

          # -------------------------------------------
          # Make torch callback asynchronous
          # -------------------------------------------

          main = main.replace(
              """onPressed: () {
                                      scanner
                                          .toggleTorch();
                                    },""",
              """onPressed: () async {
                                      await scanner
                                          .toggleTorch();
                                    },""",
          )

          # -------------------------------------------
          # Replace the full filtered() function
          # -------------------------------------------

          filtered_token = (
              "List<MaterialRecord> filtered() {"
          )

          title_token = "String title("

          filtered_index = main.find(
              filtered_token
          )

          if filtered_index < 0:
              raise SystemExit(
                  "Inventory filtered function was not found"
              )

          filtered_line_start = main.rfind(
              "\n",
              0,
              filtered_index,
          ) + 1

          title_index = main.find(
              title_token,
              filtered_index,
          )

          if title_index < 0:
              raise SystemExit(
                  "Inventory title function was not found"
              )

          title_line_start = main.rfind(
              "\n",
              0,
              title_index,
          ) + 1

          indentation = main[
              filtered_line_start:filtered_index
          ]

          inner = indentation + "  "
          inner2 = indentation + "    "
          inner3 = indentation + "      "

          filtered_function = (
              f"{indentation}List<MaterialRecord> filtered() {{\n"
              f"{inner}final String query =\n"
              f"{inner2}search.text.trim().toLowerCase();\n"
              f"\n"
              f"{inner}Iterable<MaterialRecord> result =\n"
              f"{inner2}materials;\n"
              f"\n"
              f"{inner}if (filter == MaterialFilter.all) {{\n"
              f"{inner2}result = result.where(\n"
              f"{inner3}(MaterialRecord item) =>\n"
              f"{inner3}    !item.isArchived,\n"
              f"{inner2});\n"
              f"{inner}}} else if (\n"
              f"{inner2}filter == MaterialFilter.available\n"
              f"{inner}) {{\n"
              f"{inner2}result = result.where(\n"
              f"{inner3}(MaterialRecord item) =>\n"
              f"{inner3}    item.isAvailable,\n"
              f"{inner2});\n"
              f"{inner}}} else if (\n"
              f"{inner2}filter == MaterialFilter.expiredOrEmpty\n"
              f"{inner}) {{\n"
              f"{inner2}result = result.where(\n"
              f"{inner3}(MaterialRecord item) =>\n"
              f"{inner3}    item.isExpiredOrEmpty,\n"
              f"{inner2});\n"
              f"{inner}}} else if (\n"
              f"{inner2}filter == MaterialFilter.unused\n"
              f"{inner}) {{\n"
              f"{inner2}result = result.where(\n"
              f"{inner3}(MaterialRecord item) =>\n"
              f"{inner3}    item.isUnused,\n"
              f"{inner2});\n"
              f"{inner}}} else if (\n"
              f"{inner2}filter == MaterialFilter.archived\n"
              f"{inner}) {{\n"
              f"{inner2}result = result.where(\n"
              f"{inner3}(MaterialRecord item) =>\n"
              f"{inner3}    item.isArchived,\n"
              f"{inner2});\n"
              f"{inner}}}\n"
              f"\n"
              f"{inner}if (query.isNotEmpty) {{\n"
              f"{inner2}result = result.where(\n"
              f"{inner3}(MaterialRecord item) {{\n"
              f"{inner3}  return item.name\n"
              f"{inner3}          .toLowerCase()\n"
              f"{inner3}          .contains(query) ||\n"
              f"{inner3}      item.rawBarcode\n"
              f"{inner3}          .toLowerCase()\n"
              f"{inner3}          .contains(query) ||\n"
              f"{inner3}      item.serialNumber\n"
              f"{inner3}          .toLowerCase()\n"
              f"{inner3}          .contains(query) ||\n"
              f"{inner3}      item.lotNumber\n"
              f"{inner3}          .toLowerCase()\n"
              f"{inner3}          .contains(query) ||\n"
              f"{inner3}      item.gtin\n"
              f"{inner3}          .toLowerCase()\n"
              f"{inner3}          .contains(query);\n"
              f"{inner3}}},\n"
              f"{inner2});\n"
              f"{inner}}}\n"
              f"\n"
              f"{inner}return result.toList();\n"
              f"{indentation}}}"
          )

          main = (
              main[:filtered_line_start]
              + filtered_function
              + "\n\n"
              + main[title_line_start:]
          )

          # -------------------------------------------
          # Safety checks
          # -------------------------------------------

          required_source_values = [
              "SharePlus.instance.share",
              "pw.TableHelper.fromTextArray",
              "tapToFocus: true",
              "useAppLifecycleState: false",
              "addPostFrameCallback",
              "List<MaterialRecord> filtered()",
          ]

          for value in required_source_values:
              if value not in main:
                  raise SystemExit(
                      f"Required source value missing: {value}"
                  )

          if "Share.shareXFiles" in main:
              raise SystemExit(
                  "Old Share API remains"
              )

          if "pw.Table.fromTextArray" in main:
              raise SystemExit(
                  "Old PDF table API remains"
              )

          pubspec_path.write_text(
              pubspec,
              encoding="utf-8",
          )

          main_path.write_text(
              main,
              encoding="utf-8",
          )

          arabic_path.write_text(
              arabic,
              encoding="utf-8",
          )

          english_path.write_text(
              english,
              encoding="utf-8",
          )

          print(
              "SmartChem v4.0.7 source corrections completed"
          )
          PY

      - name: Configure Android application
        working-directory: smartchem_v4
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          application_id = (
              "om.smartchem.track.production"
          )

          ndk_version = (
              "27.0.12077973"
          )

          # -------------------------------------------
          # AndroidManifest.xml
          # -------------------------------------------

          manifest_path = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          manifest = manifest_path.read_text(
              encoding="utf-8"
          )

          manifest_match = re.search(
              r"<manifest\b[^>]*>",
              manifest,
          )

          if manifest_match is None:
              raise SystemExit(
                  "Android manifest root was not found"
              )

          required_entries = [
              (
                  '<uses-permission '
                  'android:name="android.permission.CAMERA" />'
              ),
              (
                  '<uses-permission '
                  'android:name="android.permission.VIBRATE" />'
              ),
              (
                  '<uses-feature '
                  'android:name="android.hardware.camera.any" '
                  'android:required="false" />'
              ),
              (
                  '<uses-feature '
                  'android:name="android.hardware.camera.autofocus" '
                  'android:required="false" />'
              ),
              (
                  '<uses-feature '
                  'android:name="android.hardware.camera.flash" '
                  'android:required="false" />'
              ),
          ]

          missing_entries = [
              entry
              for entry in required_entries
              if entry not in manifest
          ]

          if missing_entries:
              insert_position = manifest_match.end()

              manifest = (
                  manifest[:insert_position]
                  + "\n    "
                  + "\n    ".join(missing_entries)
                  + manifest[insert_position:]
              )

          manifest = re.sub(
              r'android:label="[^"]*"',
              'android:label="SmartChem Track"',
              manifest,
              count=1,
          )

          manifest_path.write_text(
              manifest,
              encoding="utf-8",
          )

          # -------------------------------------------
          # Android Gradle Kotlin DSL
          # -------------------------------------------

          gradle_kts = Path(
              "android/app/build.gradle.kts"
          )

          gradle_groovy = Path(
              "android/app/build.gradle"
          )

          if gradle_kts.exists():
              gradle = gradle_kts.read_text(
                  encoding="utf-8"
              )

              gradle = re.sub(
                  r'namespace\s*=\s*"[^"]+"',
                  f'namespace = "{application_id}"',
                  gradle,
                  count=1,
              )

              gradle = re.sub(
                  r'applicationId\s*=\s*"[^"]+"',
                  f'applicationId = "{application_id}"',
                  gradle,
                  count=1,
              )

              gradle = re.sub(
                  r'compileSdk\s*=\s*[^\n]+',
                  "compileSdk = 36",
                  gradle,
                  count=1,
              )

              gradle = re.sub(
                  r'minSdk\s*=\s*[^\n]+',
                  "minSdk = 23",
                  gradle,
                  count=1,
              )

              gradle = re.sub(
                  r'targetSdk\s*=\s*[^\n]+',
                  "targetSdk = 35",
                  gradle,
                  count=1,
              )

              if re.search(
                  r"(?m)^\s*ndkVersion\s*=",
                  gradle,
              ):
                  gradle = re.sub(
                      r'(?m)^(\s*)ndkVersion\s*=\s*[^\n]+',
                      rf'\1ndkVersion = "{ndk_version}"',
                      gradle,
                      count=1,
                  )
              else:
                  gradle = re.sub(
                      r"(?m)^(\s*)compileSdk\s*=\s*36\s*$",
                      (
                          r'\1compileSdk = 36'
                          "\n"
                          rf'\1ndkVersion = "{ndk_version}"'
                      ),
                      gradle,
                      count=1,
                  )

              gradle = gradle.replace(
                  "JavaVersion.VERSION_11",
                  "JavaVersion.VERSION_17",
              )

              gradle = gradle.replace(
                  "JvmTarget.JVM_11",
                  "JvmTarget.JVM_17",
              )

              gradle = gradle.replace(
                  'jvmTarget = "11"',
                  'jvmTarget = "17"',
              )

              gradle = gradle.replace(
                  (
                      "jvmTarget = "
                      "JavaVersion.VERSION_11.toString()"
                  ),
                  (
                      "jvmTarget = "
                      "JavaVersion.VERSION_17.toString()"
                  ),
              )

              gradle_kts.write_text(
                  gradle,
                  encoding="utf-8",
              )

              print(
                  "Configured build.gradle.kts"
              )

          elif gradle_groovy.exists():
              gradle = gradle_groovy.read_text(
                  encoding="utf-8"
              )

              gradle = re.sub(
                  r'namespace\s+["\'][^"\']+["\']',
                  f'namespace "{application_id}"',
                  gradle,
                  count=1,
              )

              gradle = re.sub(
                  r'applicationId\s+["\'][^"\']+["\']',
                  f'applicationId "{application_id}"',
                  gradle,
                  count=1,
              )

              gradle = re.sub(
                  r'compileSdkVersion\s+[^\n]+',
                  "compileSdkVersion 36",
                  gradle,
                  count=1,
              )

              gradle = re.sub(
                  r'minSdkVersion\s+[^\n]+',
                  "minSdkVersion 23",
                  gradle,
                  count=1,
              )

              gradle = re.sub(
                  r'targetSdkVersion\s+[^\n]+',
                  "targetSdkVersion 35",
                  gradle,
                  count=1,
              )

              if re.search(
                  r"(?m)^\s*ndkVersion\s+",
                  gradle,
              ):
                  gradle = re.sub(
                      r'(?m)^(\s*)ndkVersion\s+[^\n]+',
                      rf'\1ndkVersion "{ndk_version}"',
                      gradle,
                      count=1,
                  )
              else:
                  gradle = re.sub(
                      r"(?m)^(\s*)compileSdkVersion\s+36\s*$",
                      (
                          r'\1compileSdkVersion 36'
                          "\n"
                          rf'\1ndkVersion "{ndk_version}"'
                      ),
                      gradle,
                      count=1,
                  )

              gradle = gradle.replace(
                  "JavaVersion.VERSION_11",
                  "JavaVersion.VERSION_17",
              )

              gradle = gradle.replace(
                  "jvmTarget = '11'",
                  "jvmTarget = '17'",
              )

              gradle_groovy.write_text(
                  gradle,
                  encoding="utf-8",
              )

              print(
                  "Configured build.gradle"
              )

          else:
              raise SystemExit(
                  "Android app Gradle file was not found"
              )

          # -------------------------------------------
          # Gradle properties
          # -------------------------------------------

          properties_path = Path(
              "android/gradle.properties"
          )

          properties = properties_path.read_text(
              encoding="utf-8"
          )

          properties_to_set = {
              "android.useAndroidX": "true",
              "android.enableJetifier": "true",
              "android.suppressUnsupportedCompileSdk": "36",
              "org.gradle.jvmargs":
                  "-Xmx4096m "
                  "-XX:MaxMetaspaceSize=1024m "
                  "-XX:ReservedCodeCacheSize=512m "
                  "-Dfile.encoding=UTF-8",
              "org.gradle.daemon": "false",
              "org.gradle.parallel": "true",
              "kotlin.code.style": "official",
          }

          for key, value in properties_to_set.items():
              expression = re.compile(
                  rf"(?m)^{re.escape(key)}=.*$"
              )

              new_line = f"{key}={value}"

              if expression.search(properties):
                  properties = expression.sub(
                      new_line,
                      properties,
                  )
              else:
                  properties += "\n" + new_line

          properties_path.write_text(
              properties.strip() + "\n",
              encoding="utf-8",
          )

          print(
              f"Application ID: {application_id}"
          )

          print("compileSdk: 36")
          print("targetSdk: 35")
          print("minSdk: 23")
          print(f"NDK: {ndk_version}")
          print("Java: 17")
          PY

      - name: Clean project
        working-directory: smartchem_v4
        shell: bash
        run: |
          set -e

          flutter clean

          rm -rf android/.gradle
          rm -rf build

          echo "Project caches removed"

      - name: Install Flutter packages
        working-directory: smartchem_v4
        shell: bash
        run: |
          set -e

          flutter pub get
          flutter gen-l10n

          cp \
            pubspec.lock \
            ../smartchem-pubspec-lock.txt

          flutter pub deps \
            > ../smartchem-dependencies.txt

          echo "Flutter packages installed"

      - name: Apply automatic Dart fixes
        working-directory: smartchem_v4
        shell: bash
        run: |
          set +e

          dart fix --apply \
            2>&1 | tee ../smartchem-dart-fix.log

          exit 0

      - name: Format source
        working-directory: smartchem_v4
        shell: bash
        run: |
          set -e

          dart format lib test

      - name: Verify corrected project
        shell: bash
        run: |
          set -e

          grep -n \
            "version: 4.0.7+8" \
            smartchem_v4/pubspec.yaml

          grep -n \
            "mobile_scanner: 7.1.4" \
            smartchem_v4/pubspec.yaml

          grep -n \
            "share_plus: 11.1.0" \
            smartchem_v4/pubspec.yaml

          grep -n \
            "TableHelper.fromTextArray" \
            smartchem_v4/lib/main.dart

          grep -n \
            "SharePlus.instance.share" \
            smartchem_v4/lib/main.dart

          grep -n \
            "tapToFocus: true" \
            smartchem_v4/lib/main.dart

          grep -n \
            "useAppLifecycleState: false" \
            smartchem_v4/lib/main.dart

          grep -n \
            "addPostFrameCallback" \
            smartchem_v4/lib/main.dart

          grep -n \
            "ndkVersion" \
            smartchem_v4/android/app/build.gradle.kts \
            2>/dev/null || true

          if grep -n \
            "Share.shareXFiles" \
            smartchem_v4/lib/main.dart; then

            echo "Deprecated Share API still exists"
            exit 1
          fi

          if grep -n \
            "pw.Table.fromTextArray" \
            smartchem_v4/lib/main.dart; then

            echo "Deprecated PDF API still exists"
            exit 1
          fi

          echo "Corrected project verification passed"

      - name: Analyze Flutter source
        id: analyze
        continue-on-error: true
        working-directory: smartchem_v4
        shell: bash
        run: |
          set -o pipefail

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings \
            2>&1 | tee ../smartchem-analyze.log

      - name: Run Flutter tests
        id: tests
        continue-on-error: true
        working-directory: smartchem_v4
        shell: bash
        run: |
          set -o pipefail

          flutter test \
            --reporter expanded \
            2>&1 | tee ../smartchem-test.log

      - name: Show final Android configuration
        working-directory: smartchem_v4
        shell: bash
        run: |
          set -e

          echo "========== APP GRADLE =========="

          if [ -f android/app/build.gradle.kts ]; then
            cat android/app/build.gradle.kts
          else
            cat android/app/build.gradle
          fi

          echo "========== SETTINGS GRADLE =========="

          if [ -f android/settings.gradle.kts ]; then
            cat android/settings.gradle.kts
          else
            cat android/settings.gradle
          fi

          echo "========== GRADLE WRAPPER =========="

          cat \
            android/gradle/wrapper/gradle-wrapper.properties

          echo "========== GRADLE PROPERTIES =========="

          cat android/gradle.properties

          echo "========== ANDROID MANIFEST =========="

          cat \
            android/app/src/main/AndroidManifest.xml

      - name: Build SmartChem APK
        id: apk_build
        continue-on-error: true
        working-directory: smartchem_v4
        shell: bash
        run: |
          set -o pipefail

          flutter build apk \
            --debug \
            --no-pub \
            --build-name=4.0.7 \
            --build-number=8 \
            2>&1 | tee ../smartchem-build.log

      - name: Locate and copy APK
        id: locate_apk
        if: always()
        shell: bash
        run: |
          set +e

          echo "Searching for generated APK files..."

          find smartchem_v4/build \
            -type f \
            -name "*.apk" \
            -print \
            2>/dev/null | tee smartchem-apk-files.txt

          APK_PATH="$(
            find smartchem_v4/build \
              -type f \
              -name "app-debug.apk" \
              -print \
              -quit \
              2>/dev/null
          )"

          if [ -z "$APK_PATH" ]; then
            APK_PATH="$(
              find smartchem_v4/build \
                -type f \
                -name "*.apk" \
                -print \
                -quit \
                2>/dev/null
            )"
          fi

          if [ -z "$APK_PATH" ]; then
            echo "apk_found=false" \
              >> "$GITHUB_OUTPUT"

            echo "No APK file was generated"
            exit 0
          fi

          cp \
            "$APK_PATH" \
            SmartChemTrack-v4.0.7-TEST.apk

          sha256sum \
            SmartChemTrack-v4.0.7-TEST.apk \
            > SmartChemTrack-v4.0.7-SHA256.txt

          echo "apk_found=true" \
            >> "$GITHUB_OUTPUT"

          echo "apk_path=$APK_PATH" \
            >> "$GITHUB_OUTPUT"

          echo "APK copied successfully"

          ls -lh \
            SmartChemTrack-v4.0.7-TEST.apk

          cat \
            SmartChemTrack-v4.0.7-SHA256.txt

      - name: Create build information
        if: always()
        shell: bash
        run: |
          cat > SmartChemTrack-v4.0.7-BUILD-INFO.txt <<INFO
          SmartChem Track
          Version: 4.0.7
          Build number: 8
          Application ID: om.smartchem.track.production
          Build type: Debug test APK
          Android minimum SDK: 23
          Android target SDK: 35
          Android compile SDK: 36
          Android NDK: 27.0.12077973
          Java: 17
          Scanner: mobile_scanner 7.1.4
          Scanner engine: CameraX and Google ML Kit
          Analyze outcome: ${{ steps.analyze.outcome }}
          Test outcome: ${{ steps.tests.outcome }}
          APK build outcome: ${{ steps.apk_build.outcome }}
          APK found: ${{ steps.locate_apk.outputs.apk_found }}
          INFO

          cat \
            SmartChemTrack-v4.0.7-BUILD-INFO.txt

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo "# SmartChem Track v4.0.7"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Flutter analyze | ${{ steps.analyze.outcome }} |"
            echo "| Flutter tests | ${{ steps.tests.outcome }} |"
            echo "| APK build | ${{ steps.apk_build.outcome }} |"
            echo "| APK found | ${{ steps.locate_apk.outputs.apk_found }} |"
            echo ""

            echo "## Analyze log"
            echo '```text'
            tail -n 200 \
              smartchem-analyze.log \
              2>/dev/null || true
            echo '```'
            echo ""

            echo "## Test log"
            echo '```text'
            tail -n 200 \
              smartchem-test.log \
              2>/dev/null || true
            echo '```'
            echo ""

            echo "## Build log"
            echo '```text'
            tail -n 300 \
              smartchem-build.log \
              2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete diagnostic package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartChemTrack-v4.0.7-Diagnostic-Logs
          path: |
            smartchem-dart-fix.log
            smartchem-analyze.log
            smartchem-test.log
            smartchem-build.log
            smartchem-dependencies.txt
            smartchem-pubspec-lock.txt
            smartchem-apk-files.txt
            SmartChemTrack-v4.0.7-BUILD-INFO.txt
            smartchem_v4/pubspec.yaml
            smartchem_v4/pubspec.lock
            smartchem_v4/l10n.yaml
            smartchem_v4/lib/main.dart
            smartchem_v4/lib/l10n/app_ar.arb
            smartchem_v4/lib/l10n/app_en.arb
            smartchem_v4/test/gs1_test.dart
            smartchem_v4/android/app/build.gradle.kts
            smartchem_v4/android/app/build.gradle
            smartchem_v4/android/gradle.properties
            smartchem_v4/android/settings.gradle.kts
            smartchem_v4/android/settings.gradle
            smartchem_v4/android/gradle/wrapper/gradle-wrapper.properties
            smartchem_v4/android/app/src/main/AndroidManifest.xml
          retention-days: 30
          if-no-files-found: warn

      - name: Upload SmartChem APK
        if: steps.locate_apk.outputs.apk_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SmartChemTrack-v4.0.7-TEST-APK
          path: |
            SmartChemTrack-v4.0.7-TEST.apk
            SmartChemTrack-v4.0.7-SHA256.txt
            SmartChemTrack-v4.0.7-BUILD-INFO.txt
          retention-days: 30
          if-no-files-found: error

      - name: Final quality check
        if: always()
        shell: bash
        run: |
          set -e

          echo "Analyze outcome: ${{ steps.analyze.outcome }}"
          echo "Test outcome: ${{ steps.tests.outcome }}"
          echo "Build outcome: ${{ steps.apk_build.outcome }}"
          echo "APK found: ${{ steps.locate_apk.outputs.apk_found }}"

          if [ "${{ steps.analyze.outcome }}" != "success" ]; then
            echo "Flutter analyze failed"
            cat smartchem-analyze.log || true
            exit 1
          fi

          if [ "${{ steps.tests.outcome }}" != "success" ]; then
            echo "Flutter tests failed"
            cat smartchem-test.log || true
            exit 1
          fi

          if [ "${{ steps.apk_build.outcome }}" != "success" ]; then
            echo "Flutter APK build failed"
            cat smartchem-build.log || true
            exit 1
          fi

          if [ "${{ steps.locate_apk.outputs.apk_found }}" != "true" ]; then
            echo "APK file was not found"
            find smartchem_v4/build \
              -maxdepth 8 \
              -type f \
              2>/dev/null || true
            exit 1
          fi

          test -s \
            SmartChemTrack-v4.0.7-TEST.apk

          echo "================================"
          echo "ALL SMARTCHEM CHECKS PASSED"
          echo "================================"

          ls -lh \
            SmartChemTrack-v4.0.7-TEST.apk
