            Future<List<UsageRecord>> usageRecords(
              int materialId,
            ) async {
              final List<Map<String, Object?>> rows =
                  await database.rawQuery(
                '''
                SELECT
                  u.*,
                  original_user.full_name AS user_name,
                  editor.full_name AS edited_by_name
                FROM usage_records u
                JOIN users original_user
                  ON original_user.id = u.user_id
                LEFT JOIN users editor
                  ON editor.id = u.edited_by
                WHERE u.material_id = ?
                ORDER BY u.created_at DESC
                ''',
                <Object?>[materialId],
              );

              return rows
                  .map(UsageRecord.fromMap)
                  .toList();
            }

            Future<void> editUsage({
              required UserRecord actor,
              required int usageId,
              required double newQuantity,
              required String reason,
            }) async {
              if (newQuantity < 0 ||
                  reason.trim().isEmpty) {
                throw ArgumentError('INVALID_QUANTITY');
              }

              await database.transaction(
                (Transaction transaction) async {
                  final List<Map<String, Object?>> rows =
                      await transaction.query(
                    'usage_records',
                    where: 'id = ?',
                    whereArgs: <Object?>[usageId],
                    limit: 1,
                  );

                  if (rows.isEmpty) {
                    throw StateError('USAGE_NOT_FOUND');
                  }

                  final Map<String, Object?> row =
                      rows.first;

                  final int ownerId =
                      row['user_id'] as int;

                  if (!actor.isSuperAdmin &&
                      ownerId != actor.id) {
                    throw StateError('ADMIN_ONLY');
                  }

                  final int materialId =
                      row['material_id'] as int;

                  final double oldQuantity =
                      numberValue(
                    row['used_quantity'],
                  );

                  await transaction.update(
                    'usage_records',
                    <String, Object?>{
                      'previous_used_quantity':
                          oldQuantity,
                      'used_quantity': newQuantity,
                      'edited_by': actor.id,
                      'edited_at': isoNow(),
                      'edit_reason': reason.trim(),
                      'sync_status': 'local',
                    },
                    where: 'id = ?',
                    whereArgs: <Object?>[usageId],
                  );

                  final List<Map<String, Object?>>
                      materialRows =
                      await transaction.query(
                    'materials',
                    where: 'id = ?',
                    whereArgs: <Object?>[materialId],
                    limit: 1,
                  );

                  final double original =
                      numberValue(
                    materialRows.first[
                        'original_quantity'],
                  );

                  final List<Map<String, Object?>> sumRows =
                      await transaction.rawQuery(
                    '''
                    SELECT
                      COALESCE(SUM(used_quantity), 0)
                        AS total_used,
                      COUNT(*) AS usage_count
                    FROM usage_records
                    WHERE material_id = ?
                      AND is_approved = 1
                    ''',
                    <Object?>[materialId],
                  );

                  final double totalUsed =
                      numberValue(
                    sumRows.first['total_used'],
                  );

                  if (totalUsed > original &&
                      !actor.isSuperAdmin) {
                    throw ArgumentError(
                      'INVALID_QUANTITY',
                    );
                  }

                  await transaction.update(
                    'materials',
                    <String, Object?>{
                      'used_quantity': totalUsed,
                      'usage_count':
                          sumRows.first['usage_count'],
                      'status': totalUsed >= original
                          ? 'empty'
                          : 'active',
                      'updated_by': actor.id,
                      'updated_at': isoNow(),
                      'sync_status': 'local',
                    },
                    where: 'id = ?',
                    whereArgs: <Object?>[materialId],
                  );

                  await transaction.insert(
                    'audit_logs',
                    <String, Object?>{
                      'entity_type': 'usage',
                      'entity_id': usageId,
                      'action': 'EDIT_USAGE',
                      'old_value':
                          oldQuantity.toString(),
                      'new_value':
                          newQuantity.toString(),
                      'reason': reason.trim(),
                      'performed_by': actor.id,
                      'affected_user_id': ownerId,
                      'performed_at': isoNow(),
                      'device_name':
                          Platform.operatingSystem,
                      'sync_status': 'local',
                    },
                  );
                },
              );
            }

            Future<void> _recalculateMaterial(
              int materialId,
            ) async {
              final List<Map<String, Object?>> rows =
                  await database.rawQuery(
                '''
                SELECT
                  COALESCE(SUM(used_quantity), 0)
                    AS total_used,
                  COUNT(*) AS usage_count
                FROM usage_records
                WHERE material_id = ?
                  AND is_approved = 1
                ''',
                <Object?>[materialId],
              );

              final double totalUsed =
                  numberValue(
                rows.first['total_used'],
              );

              final List<Map<String, Object?>>
                  materialRows =
                  await database.query(
                'materials',
                where: 'id = ?',
                whereArgs: <Object?>[materialId],
                limit: 1,
              );

              if (materialRows.isEmpty) {
                return;
              }

              final double original =
                  numberValue(
                materialRows.first[
                    'original_quantity'],
              );

              await database.update(
                'materials',
                <String, Object?>{
                  'used_quantity': totalUsed,
                  'usage_count':
                      rows.first['usage_count'],
                  'status': totalUsed >= original
                      ? 'empty'
                      : 'active',
                  'sync_status': 'local',
                },
                where: 'id = ?',
                whereArgs: <Object?>[materialId],
              );
            }

