name: Build SmartChem Track v2.0.3 Stable

on:
  push:
    branches:
      - smartchem-apk-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter Android project
        run: |
          rm -rf smartchem_v203

          flutter create smartchem_v203 \
            --platforms=android \
            --org om.smartchem \
            --project-name smartchem_track_v203

      - name: Write pubspec
        working-directory: smartchem_v203
        shell: bash
        run: |
          rm -f analysis_options.yaml

          cat > pubspec.yaml <<'PUBSPEC'
          name: smartchem_track_v203
          description: SmartChem laboratory tracking application
          publish_to: "none"
          version: 2.0.3+5

          environment:
            sdk: ">=3.5.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            mobile_scanner: 7.2.1

          dev_dependencies:
            flutter_test:
              sdk: flutter

          flutter:
            uses-material-design: true
          PUBSPEC

          flutter pub get

      - name: Write SmartChem application
        working-directory: smartchem_v203
        shell: bash
        run: |
          cat > lib/main.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:mobile_scanner/mobile_scanner.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const SmartChemApp());
          }

          class SmartChemApp extends StatelessWidget {
            const SmartChemApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'SmartChem Track',
                debugShowCheckedModeBanner: false,
                builder: (context, child) {
                  return Directionality(
                    textDirection: TextDirection.rtl,
                    child: child ?? const SizedBox.shrink(),
                  );
                },
                theme: ThemeData(
                  useMaterial3: true,
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: const Color(0xFF006C70),
                  ),
                  scaffoldBackgroundColor: const Color(0xFFF4F8F8),
                  inputDecorationTheme: const InputDecorationTheme(
                    filled: true,
                    border: OutlineInputBorder(),
                  ),
                ),
                home: const LoginScreen(),
              );
            }
          }

          class AppUser {
            AppUser({
              required this.name,
              required this.username,
              required this.password,
              required this.isAdmin,
              this.isActive = true,
              this.canScan = true,
              this.canUseMaterials = true,
              this.canViewReports = true,
            });

            String name;
            String username;
            String password;

            bool isAdmin;
            bool isActive;
            bool canScan;
            bool canUseMaterials;
            bool canViewReports;
          }

          enum MaterialStatus {
            valid,
            nearExpiry,
            expired,
            unapproved,
            empty,
          }

          class LabMaterial {
            LabMaterial({
              required this.id,
              required this.name,
              required this.type,
              required this.rawBarcode,
              required this.gtin,
              required this.lot,
              required this.catalogNumber,
              required this.serialNumber,
              required this.expiryDate,
              required this.device,
              required this.department,
              required this.registeredBy,
              required this.totalQuantity,
              required this.isApproved,
            });

            final String id;

            String name;
            String type;
            String rawBarcode;
            String gtin;
            String lot;
            String catalogNumber;
            String serialNumber;
            String device;
            String department;
            String registeredBy;

            DateTime expiryDate;
            DateTime? openedAt;

            double totalQuantity;
            double usedQuantity = 0.0;

            bool isApproved;

            double get remainingQuantity {
              final value = totalQuantity - usedQuantity;

              if (value < 0) {
                return 0.0;
              }

              return value;
            }

            MaterialStatus get status {
              if (remainingQuantity <= 0) {
                return MaterialStatus.empty;
              }

              final now = DateTime.now();

              final today = DateTime(
                now.year,
                now.month,
                now.day,
              );

              final expiry = DateTime(
                expiryDate.year,
                expiryDate.month,
                expiryDate.day,
              );

              if (expiry.isBefore(today)) {
                return MaterialStatus.expired;
              }

              if (!isApproved) {
                return MaterialStatus.unapproved;
              }

              if (expiry.difference(today).inDays <=
                  AppStore.nearExpiryDays) {
                return MaterialStatus.nearExpiry;
              }

              return MaterialStatus.valid;
            }
          }

          class UsageRecord {
            UsageRecord({
              required this.materialName,
              required this.materialType,
              required this.device,
              required this.employee,
              required this.quantity,
              required this.dateTime,
            });

            final String materialName;
            final String materialType;
            final String device;
            final String employee;
            final double quantity;
            final DateTime dateTime;
          }

          class ParsedBarcode {
            const ParsedBarcode({
              required this.rawValue,
              required this.gtin,
              required this.lot,
              required this.serialNumber,
              required this.catalogNumber,
              required this.expiryDate,
            });

            final String rawValue;
            final String gtin;
            final String lot;
            final String serialNumber;
            final String catalogNumber;
            final DateTime? expiryDate;
          }

          class VariableField {
            const VariableField({
              required this.value,
              required this.nextIndex,
            });

            final String value;
            final int nextIndex;
          }

          class AppStore {
            static AppUser? currentUser;

            static int nearExpiryDays = 30;

            static String scanButtonName =
                'مسح Data Matrix أو QR أو الباركود';

            static String inventoryButtonName = 'المخزون';

            static String reportsButtonName = 'التقارير';

            static final List<AppUser> users = [
              AppUser(
                name: 'المستخدم الرئيسي',
                username: 'admin',
                password: '1234',
                isAdmin: true,
              ),
              AppUser(
                name: 'موظف قسم الكيمياء',
                username: 'staff',
                password: '1234',
                isAdmin: false,
              ),
            ];

            static final List<LabMaterial> materials = [];

            static final List<UsageRecord> usageRecords = [];

            static AppUser? login(
              String username,
              String password,
            ) {
              for (final user in users) {
                if (user.username == username &&
                    user.password == password &&
                    user.isActive) {
                  return user;
                }
              }

              return null;
            }

            static int countStatus(
              MaterialStatus status,
            ) {
              return materials
                  .where(
                    (material) => material.status == status,
                  )
                  .length;
            }
          }

          String formatDate(DateTime date) {
            final day =
                date.day.toString().padLeft(2, '0');

            final month =
                date.month.toString().padLeft(2, '0');

            return '$day/$month/${date.year}';
          }

          String formatDateTime(DateTime date) {
            final hour =
                date.hour.toString().padLeft(2, '0');

            final minute =
                date.minute.toString().padLeft(2, '0');

            return '${formatDate(date)} $hour:$minute';
          }

          DateTime? parseGs1Expiry(String value) {
            if (!RegExp(r'^\d{6}$').hasMatch(value)) {
              return null;
            }

            final year =
                2000 + int.parse(value.substring(0, 2));

            final month =
                int.parse(value.substring(2, 4));

            int day =
                int.parse(value.substring(4, 6));

            if (month < 1 || month > 12) {
              return null;
            }

            final lastDay =
                DateTime(year, month + 1, 0).day;

            if (day == 0 || day > lastDay) {
              day = lastDay;
            }

            return DateTime(year, month, day);
          }

          VariableField readVariableField(
            String value,
            int start,
          ) {
            int end = start;

            while (end < value.length &&
                value.codeUnitAt(end) != 29) {
              end++;
            }

            return VariableField(
              value: value.substring(start, end).trim(),
              nextIndex:
                  end < value.length ? end + 1 : end,
            );
          }

          ParsedBarcode parseBarcode(String input) {
            String raw = input.trim();

            raw = raw.replaceAll(
              '<GS>',
              String.fromCharCode(29),
            );

            if (raw.startsWith(']d2') ||
                raw.startsWith(']D2')) {
              raw = raw.substring(3);
            }

            String findField(String pattern) {
              return RegExp(pattern)
                      .firstMatch(raw)
                      ?.group(1)
                      ?.trim() ??
                  '';
            }

            if (raw.contains('(01)') ||
                raw.contains('(10)') ||
                raw.contains('(17)') ||
                raw.contains('(21)') ||
                raw.contains('(240)')) {
              final expiryCode =
                  findField(r'\(17\)(\d{6})');

              return ParsedBarcode(
                rawValue: input,
                gtin: findField(
                  r'\(01\)(\d{14})',
                ),
                lot: findField(
                  r'\(10\)(.*?)(?=\(\d{2,3}\)|$)',
                ),
                serialNumber: findField(
                  r'\(21\)(.*?)(?=\(\d{2,3}\)|$)',
                ),
                catalogNumber: findField(
                  r'\(240\)(.*?)(?=\(\d{2,3}\)|$)',
                ),
                expiryDate:
                    parseGs1Expiry(expiryCode),
              );
            }

            String gtin = '';
            String lot = '';
            String serialNumber = '';
            String catalogNumber = '';
            DateTime? expiryDate;

            int index = 0;

            while (index < raw.length) {
              if (raw.codeUnitAt(index) == 29) {
                index++;
                continue;
              }

              if (raw.startsWith('01', index) &&
                  index + 16 <= raw.length) {
                gtin = raw.substring(
                  index + 2,
                  index + 16,
                );

                index += 16;
                continue;
              }

              if (raw.startsWith('17', index) &&
                  index + 8 <= raw.length) {
                expiryDate = parseGs1Expiry(
                  raw.substring(
                    index + 2,
                    index + 8,
                  ),
                );

                index += 8;
                continue;
              }

              if (raw.startsWith('240', index)) {
                final field = readVariableField(
                  raw,
                  index + 3,
                );

                catalogNumber = field.value;
                index = field.nextIndex;
                continue;
              }

              if (raw.startsWith('21', index)) {
                final field = readVariableField(
                  raw,
                  index + 2,
                );

                serialNumber = field.value;
                index = field.nextIndex;
                continue;
              }

              if (raw.startsWith('10', index)) {
                final field = readVariableField(
                  raw,
                  index + 2,
                );

                lot = field.value;
                index = field.nextIndex;
                continue;
              }

              index++;
            }

            return ParsedBarcode(
              rawValue: input,
              gtin: gtin,
              lot: lot,
              serialNumber: serialNumber,
              catalogNumber: catalogNumber,
              expiryDate: expiryDate,
            );
          }

          Color materialStatusColor(
            MaterialStatus status,
          ) {
            switch (status) {
              case MaterialStatus.valid:
                return Colors.green;

              case MaterialStatus.nearExpiry:
                return Colors.amber;

              case MaterialStatus.expired:
                return Colors.red;

              case MaterialStatus.unapproved:
                return Colors.orange;

              case MaterialStatus.empty:
                return Colors.grey;
            }
          }

          String materialStatusName(
            MaterialStatus status,
          ) {
            switch (status) {
              case MaterialStatus.valid:
                return 'صالح';

              case MaterialStatus.nearExpiry:
                return 'قريب الانتهاء';

              case MaterialStatus.expired:
                return 'منتهي';

              case MaterialStatus.unapproved:
                return 'غير معتمد';

              case MaterialStatus.empty:
                return 'نفدت الكمية';
            }
          }

          class LoginScreen extends StatefulWidget {
