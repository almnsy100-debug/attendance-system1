name: Build SmartChem Track v2.0.5 Fixed

on:
  push:
    branches:
      - smartchem-apk-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Display Flutter version
        run: |
          flutter --version
          dart --version

      - name: Create clean Flutter project
        run: |
          rm -rf smartchem_safe

          flutter create smartchem_safe \
            --platforms=android \
            --org om.smartchem \
            --project-name smartchem_safe

      - name: Recover SmartChem source code
        run: |
          git show 6d42435be12542515caf96302668edf79b250e80:.github/workflows/build-apk.yml > /tmp/old-smartchem-workflow.yml

          awk '
            /cat > pubspec.yaml/ {
              capture = 1
              next
            }

            /^PUBSPEC$/ {
              capture = 0
            }

            capture {
              print
            }
          ' /tmp/old-smartchem-workflow.yml > smartchem_safe/pubspec.yaml

          awk '
            /cat > lib\/main.dart/ {
              capture = 1
              next
            }

            /^DART$/ {
              capture = 0
            }

            capture {
              print
            }
          ' /tmp/old-smartchem-workflow.yml > smartchem_safe/lib/main.dart

          test -s smartchem_safe/pubspec.yaml
          test -s smartchem_safe/lib/main.dart

          echo "pubspec lines:"
          wc -l smartchem_safe/pubspec.yaml

          echo "main.dart lines:"
          wc -l smartchem_safe/lib/main.dart

      - name: Update application version and scanner
        run: |
          sed -i \
            's/version: 2.0.4+6/version: 2.0.5+7/' \
            smartchem_safe/pubspec.yaml

          sed -i \
            's/mobile_scanner: 5.2.3/mobile_scanner: 7.2.1/' \
            smartchem_safe/pubspec.yaml

          rm -f smartchem_safe/analysis_options.yaml

          cat smartchem_safe/pubspec.yaml

      - name: Install Flutter packages
        working-directory: smartchem_safe
        run: |
          flutter clean
          flutter pub get
          flutter pub deps

      - name: Configure Android camera permission
        working-directory: smartchem_safe
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          sed -i \
            '/<manifest/a\    <uses-feature android:name="android.hardware.camera.any" android:required="false" />' \
            "$MANIFEST"

          sed -i \
            '/<manifest/a\    <uses-permission android:name="android.permission.CAMERA" />' \
            "$MANIFEST"

          sed -i \
            's/android:label="smartchem_safe"/android:label="SmartChem Track v2.0.5"/' \
            "$MANIFEST"

          cat "$MANIFEST"

      - name: Configure Android package
        working-directory: smartchem_safe
        run: |
          GRADLE_FILE="android/app/build.gradle.kts"

          if [ -f "$GRADLE_FILE" ]; then
            sed -i \
              's/applicationId = "om.smartchem.smartchem_safe"/applicationId = "om.smartchem.track.v205"/' \
              "$GRADLE_FILE"

            sed -i \
              's/minSdk = flutter.minSdkVersion/minSdk = 23/' \
              "$GRADLE_FILE"

            cat "$GRADLE_FILE"
          else
            echo "build.gradle.kts was not found"
            exit 1
          fi

      - name: Verify recovered source
        working-directory: smartchem_safe
        run: |
          test -f lib/main.dart
          test -f pubspec.yaml

          grep -q "void main()" lib/main.dart
          grep -q "MobileScanner" lib/main.dart
          grep -q "mobile_scanner" pubspec.yaml

          echo "SmartChem source verification passed"

      - name: Build release APK
        working-directory: smartchem_safe
        run: |
          flutter build apk \
            --release \
            --build-name=2.0.5 \
            --build-number=7

      - name: Verify APK
        run: |
          APK_PATH="smartchem_safe/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "APK file was not created"
            exit 1
          fi

          ls -lh "$APK_PATH"

      - name: Rename APK
        run: |
          cp \
            smartchem_safe/build/app/outputs/flutter-apk/app-release.apk \
            SmartChemTrack-v2.0.5.apk

          ls -lh SmartChemTrack-v2.0.5.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartChemTrack-v2.0.5-APK
          path: SmartChemTrack-v2.0.5.apk
          retention-days: 30
          if-no-files-found: error
