      isAdmin: true,
    ),
    AppUser(
      name: 'موظف قسم الكيمياء',
      username: 'staff',
      password: '1234',
      isAdmin: false,
    ),
  ];

  static final List<LabMaterial> materials = [];
  static final List<UsageRecord> usage = [];

  static AppUser? login(String username, String password) {
    for (final user in users) {
      if (user.username == username &&
          user.password == password &&
          user.isActive) {
        return user;
      }
    }
    return null;
  }

  static int count(MaterialStatus status) {
    return materials.where((item) => item.status == status).length;
  }
}

String formatDate(DateTime date) {
  final day = date.day.toString().padLeft(2, '0');
  final month = date.month.toString().padLeft(2, '0');
  return '$day/$month/${date.year}';
}

String formatDateTime(DateTime date) {
  final hour = date.hour.toString().padLeft(2, '0');
  final minute = date.minute.toString().padLeft(2, '0');
  return '${formatDate(date)} $hour:$minute';
}

DateTime? parseGs1Date(String value) {
  if (!RegExp(r'^\d{6}$').hasMatch(value)) {
    return null;
  }

  final year = 2000 + int.parse(value.substring(0, 2));
  final month = int.parse(value.substring(2, 4));
  int day = int.parse(value.substring(4, 6));

  if (month < 1 || month > 12) {
    return null;
  }

  final lastDay = DateTime(year, month + 1, 0).day;

  if (day == 0 || day > lastDay) {
    day = lastDay;
  }

  return DateTime(year, month, day);
}

String findParentheses(String raw, String pattern) {
  return RegExp(pattern).firstMatch(raw)?.group(1)?.trim() ?? '';
}

ParsedCode parseCode(String input) {
  String raw = input.trim();

  raw = raw.replaceAll('<GS>', String.fromCharCode(29));

  if (raw.startsWith(']d2') || raw.startsWith(']D2')) {
    raw = raw.substring(3);
  }

  if (raw.contains('(01)') ||
      raw.contains('(10)') ||
      raw.contains('(17)') ||
      raw.contains('(21)') ||
      raw.contains('(240)')) {
    final expiryCode = findParentheses(raw, r'\(17\)(\d{6})');

    return ParsedCode(
      raw: input,
      gtin: findParentheses(raw, r'\(01\)(\d{14})'),
      lot: findParentheses(raw, r'\(10\)(.*?)(?=\(\d{2,3}\)|$)'),
      serial: findParentheses(raw, r'\(21\)(.*?)(?=\(\d{2,3}\)|$)'),
      catalog: findParentheses(raw, r'\(240\)(.*?)(?=\(\d{2,3}\)|$)'),
      expiry: parseGs1Date(expiryCode),
    );
  }

  String gtin = '';
  String lot = '';
  String serial = '';
  String catalog = '';
  DateTime? expiry;

  int index = 0;

  while (index < raw.length) {
    if (raw.codeUnitAt(index) == 29) {
      index++;
      continue;
    }

    if (raw.startsWith('01', index) && index + 16 <= raw.length) {
      gtin = raw.substring(index + 2, index + 16);
      index += 16;
      continue;
    }

    if (raw.startsWith('17', index) && index + 8 <= raw.length) {
      expiry = parseGs1Date(raw.substring(index + 2, index + 8));
      index += 8;
      continue;
    }

    if (raw.startsWith('240', index)) {
      int end = index + 3;
      while (end < raw.length && raw.codeUnitAt(end) != 29) {
        end++;
      }
      catalog = raw.substring(index + 3, end).trim();
      index = end;
      continue;
    }

    if (raw.startsWith('21', index)) {
      int end = index + 2;
      while (end < raw.length && raw.codeUnitAt(end) != 29) {
        end++;
      }
      serial = raw.substring(index + 2, end).trim();
      index = end;
      continue;
    }

    if (raw.startsWith('10', index)) {
      int end = index + 2;
      while (end < raw.length && raw.codeUnitAt(end) != 29) {
        end++;
      }
      lot = raw.substring(index + 2, end).trim();
      index = end;
      continue;
    }

    index++;
  }

  return ParsedCode(
    raw: input,
    gtin: gtin,
    lot: lot,
    catalog: catalog,
    serial: serial,
    expiry: expiry,
  );
}

Color statusColor(MaterialStatus status) {
  switch (status) {
    case MaterialStatus.valid:
      return Colors.green;
    case MaterialStatus.nearExpiry:
      return Colors.amber;
    case MaterialStatus.expired:
      return Colors.red;
    case MaterialStatus.unapproved:
      return Colors.orange;
    case MaterialStatus.empty:
      return Colors.grey;
  }
}

String statusText(MaterialStatus status) {
  switch (status) {
    case MaterialStatus.valid:
      return 'صالح';
    case MaterialStatus.nearExpiry:
      return 'قريب الانتهاء';
    case MaterialStatus.expired:
      return 'منتهي';
    case MaterialStatus.unapproved:
      return 'غير معتمد';
    case MaterialStatus.empty:
      return 'نفدت الكمية';
  }
}

