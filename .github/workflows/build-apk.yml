          class _AdminScreenState
              extends State<AdminScreen> {
            Future<void> addUser() async {
              final nameController =
                  TextEditingController();

              final usernameController =
                  TextEditingController();

              final passwordController =
                  TextEditingController(text: '1234');

              bool isAdmin = false;

              final shouldSave =
                  await showDialog<bool>(
                context: context,
                builder: (dialogContext) {
                  return StatefulBuilder(
                    builder: (
                      context,
                      updateDialog,
                    ) {
                      return AlertDialog(
                        title:
                            const Text('إضافة مستخدم'),
                        content: SingleChildScrollView(
                          child: Column(
                            mainAxisSize:
                                MainAxisSize.min,
                            children: [
                              TextField(
                                controller:
                                    nameController,
                                decoration:
                                    const InputDecoration(
                                  labelText: 'الاسم',
                                ),
                              ),
                              const SizedBox(height: 8),
                              TextField(
                                controller:
                                    usernameController,
                                decoration:
                                    const InputDecoration(
                                  labelText:
                                      'اسم المستخدم',
                                ),
                              ),
                              const SizedBox(height: 8),
                              TextField(
                                controller:
                                    passwordController,
                                decoration:
                                    const InputDecoration(
                                  labelText:
                                      'كلمة المرور',
                                ),
                              ),
                              SwitchListTile(
                                title: const Text(
                                  'مستخدم رئيسي',
                                ),
                                value: isAdmin,
                                onChanged: (value) {
                                  updateDialog(() {
                                    isAdmin = value;
                                  });
                                },
                              ),
                            ],
                          ),
                        ),
                        actions: [
                          TextButton(
                            onPressed: () {
                              Navigator.of(dialogContext)
                                  .pop(false);
                            },
                            child:
                                const Text('إلغاء'),
                          ),
                          FilledButton(
                            onPressed: () {
                              Navigator.of(dialogContext)
                                  .pop(true);
                            },
                            child:
                                const Text('إضافة'),
                          ),
                        ],
                      );
                    },
                  );
                },
              );

              if (shouldSave == true) {
                final username =
                    usernameController.text.trim();

                final duplicate = AppStore.users.any(
                  (user) =>
                      user.username == username,
                );

                if (nameController.text.trim().isEmpty ||
                    username.isEmpty ||
                    passwordController.text.isEmpty) {
                  if (mounted) {
                    ScaffoldMessenger.of(context)
                        .showSnackBar(
                      const SnackBar(
                        content: Text(
                          'أكمل جميع بيانات المستخدم',
                        ),
                      ),
                    );
                  }
                } else if (duplicate) {
                  if (mounted) {
                    ScaffoldMessenger.of(context)
                        .showSnackBar(
                      const SnackBar(
                        content: Text(
                          'اسم المستخدم موجود مسبقًا',
                        ),
                      ),
                    );
                  }
                } else {
                  setState(() {
                    AppStore.users.add(
                      AppUser(
                        name:
                            nameController.text.trim(),
                        username: username,
                        password:
                            passwordController.text,
                        isAdmin: isAdmin,
                      ),
                    );
                  });
                }
              }

              nameController.dispose();
              usernameController.dispose();
              passwordController.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text(
                    'لوحة المستخدم الرئيسي',
                  ),
                ),
                floatingActionButton:
                    FloatingActionButton.extended(
                  onPressed: addUser,
                  icon:
                      const Icon(Icons.person_add_alt_1),
                  label:
                      const Text('إضافة مستخدم'),
                ),
                body: ListView.separated(
                  padding: const EdgeInsets.all(12),
                  itemCount: AppStore.users.length,
                  separatorBuilder: (_, __) {
                    return const SizedBox(height: 8);
                  },
                  itemBuilder: (_, index) {
                    final user =
                        AppStore.users[index];

                    final currentUser =
