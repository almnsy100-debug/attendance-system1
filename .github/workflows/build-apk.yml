                    ),
                    const SizedBox(height: 12),
                    TextField(
                      controller:
                          deviceController,
                      decoration:
                          const InputDecoration(
                        labelText: 'اسم الجهاز',
                      ),
                    ),
                    const SizedBox(height: 12),
                    TextField(
                      controller:
                          departmentController,
                      decoration:
                          const InputDecoration(
