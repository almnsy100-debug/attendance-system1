              final int? newId =
                  await Navigator.of(context)
                      .push<int>(
                MaterialPageRoute<int>(
                  builder:
                      (BuildContext context) {
                    return MaterialFormScreen(
                      controller: controller,
                      rawBarcode:
                          scan.rawValue,
                      barcodeFormat:
                          scan.format,
                      parsed: parsed,
                    );
                  },
                ),
              );

              if (newId != null &&
                  context.mounted) {
                await Navigator.of(context).push(
                  MaterialPageRoute<void>(
                    builder:
                        (BuildContext context) {
                      return MaterialDetailsScreen(
                        controller: controller,
                        materialId: newId,
                      );
                    },
                  ),
                );
              }

              controller.refresh();
            }

