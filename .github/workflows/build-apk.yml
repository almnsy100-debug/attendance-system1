name: Build SmartChem Track v4.0.1 Fixed

on:
  workflow_dispatch:
  push:
    branches:
      - smartchem-apk-build

permissions:
  contents: read

jobs:
  build:
    name: Build SmartChem Track v4.0.1 APK
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: |
          flutter --version
          dart --version
          java -version

      - name: Create clean Flutter project
        shell: bash
        run: |
          set -e

          rm -rf smartchem_v4

          flutter create smartchem_v4 \
            --platforms=android \
            --org om.smartchem.track \
            --project-name production

          rm -rf smartchem_v4/test
          rm -f smartchem_v4/analysis_options.yaml

          mkdir -p smartchem_v4/lib/l10n
          mkdir -p smartchem_v4/test

      - name: Recover complete SmartChem v4 source
        shell: bash
        run: |
          set -e

          SOURCE_COMMIT="9f81a3414472d86e3cb0aa820e8863967994d03c"
          SOURCE_WORKFLOW="/tmp/smartchem-v4-original.yml"

          if ! git cat-file -e "${SOURCE_COMMIT}^{commit}" 2>/dev/null; then
            git fetch origin "${SOURCE_COMMIT}"
          fi

          git show \
            "${SOURCE_COMMIT}:.github/workflows/build-apk.yml" \
            > "${SOURCE_WORKFLOW}"

          python3 - <<'PY'
          from pathlib import Path

          source_path = Path(
              "/tmp/smartchem-v4-original.yml"
          )

          source_lines = source_path.read_text(
              encoding="utf-8"
          ).splitlines()

          def extract_block(
              start_marker: str,
              end_marker: str,
              output_path: str,
          ) -> None:

              collecting = False
              output_lines: list[str] = []

              for line in source_lines:

                  if not collecting:
                      if start_marker in line:
                          collecting = True
                      continue

                  if line.strip() == end_marker:
                      break

                  if line.startswith("          "):
                      line = line[10:]

                  output_lines.append(line)

              if not collecting:
                  raise SystemExit(
                      f"Start marker not found: {start_marker}"
                  )

              if not output_lines:
                  raise SystemExit(
                      f"No content extracted for: {output_path}"
                  )

              destination = Path(output_path)

              destination.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              destination.write_text(
                  "\n".join(output_lines) + "\n",
                  encoding="utf-8",
              )

              print(
                  f"Recovered {output_path}: "
                  f"{len(output_lines)} lines"
              )

          blocks = [
              (
                  "cat > smartchem_v4/pubspec.yaml "
                  "<<'PUBSPEC'",
                  "PUBSPEC",
                  "smartchem_v4/pubspec.yaml",
              ),
              (
                  "cat > smartchem_v4/l10n.yaml "
                  "<<'L10N'",
                  "L10N",
                  "smartchem_v4/l10n.yaml",
              ),
              (
                  "cat > "
                  "smartchem_v4/lib/l10n/app_ar.arb "
                  "<<'AR'",
                  "AR",
                  "smartchem_v4/lib/l10n/app_ar.arb",
              ),
              (
                  "cat > "
                  "smartchem_v4/lib/l10n/app_en.arb "
                  "<<'EN'",
                  "EN",
                  "smartchem_v4/lib/l10n/app_en.arb",
              ),
              (
                  "cat > smartchem_v4/lib/main.dart "
                  "<<'DART'",
                  "DART",
                  "smartchem_v4/lib/main.dart",
              ),
              (
                  "cat > "
                  "smartchem_v4/test/gs1_test.dart "
                  "<<'TEST'",
                  "TEST",
                  "smartchem_v4/test/gs1_test.dart",
              ),
          ]

          for start_marker, end_marker, output_path in blocks:
              extract_block(
                  start_marker,
                  end_marker,
                  output_path,
              )
          PY

          test -s smartchem_v4/pubspec.yaml
          test -s smartchem_v4/lib/main.dart
          test -s smartchem_v4/lib/l10n/app_ar.arb
          test -s smartchem_v4/lib/l10n/app_en.arb
          test -s smartchem_v4/test/gs1_test.dart

          grep -q \
            "class SmartChemApp" \
            smartchem_v4/lib/main.dart

          grep -q \
            "class ScannerScreen" \
            smartchem_v4/lib/main.dart

          grep -q \
            "class InventoryScreen" \
            smartchem_v4/lib/main.dart

          grep -q \
            "class MaterialDetailsScreen" \
            smartchem_v4/lib/main.dart

          grep -q \
            "class UsersScreen" \
            smartchem_v4/lib/main.dart

          echo "Complete SmartChem v4 source recovered"

      - name: Apply SmartChem v4.0.1 corrections
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          pubspec_path = Path(
              "smartchem_v4/pubspec.yaml"
          )

          main_path = Path(
              "smartchem_v4/lib/main.dart"
          )

          arabic_path = Path(
              "smartchem_v4/lib/l10n/app_ar.arb"
          )

          english_path = Path(
              "smartchem_v4/lib/l10n/app_en.arb"
          )

          pubspec = pubspec_path.read_text(
              encoding="utf-8"
          )

          main = main_path.read_text(
              encoding="utf-8"
          )

          arabic = arabic_path.read_text(
              encoding="utf-8"
          )

          english = english_path.read_text(
              encoding="utf-8"
          )

          pubspec = re.sub(
              r"version:\s*4\.0\.0\+1",
              "version: 4.0.1+2",
              pubspec,
              count=1,
          )

          arabic = arabic.replace(
              "الإصدار 4.0.0",
              "الإصدار 4.0.1",
          )

          english = english.replace(
              "Version 4.0.0",
              "Version 4.0.1",
          )

          # PDF 3.12 moved fromTextArray to TableHelper.
          main = main.replace(
              "pw.Table.fromTextArray(",
              "pw.TableHelper.fromTextArray(",
          )

          # Replace deprecated Share.shareXFiles calls.
          share_pattern = re.compile(
              r"(?P<indent>^[ \t]*)"
              r"await Share\.shareXFiles\("
              r"\s*<XFile>\["
              r"\s*XFile\(file\.path\),"
              r"\s*\],"
              r"\s*text:\s*"
              r"(?P<label>text\.[A-Za-z0-9_]+),"
              r"\s*\);",
              re.MULTILINE | re.DOTALL,
          )

          def replace_share(
              match: re.Match[str],
          ) -> str:

              indent = match.group("indent")
              label = match.group("label")

              return (
                  f"{indent}await SharePlus.instance.share(\n"
                  f"{indent}  ShareParams(\n"
                  f"{indent}    files: <XFile>[\n"
                  f"{indent}      XFile(file.path),\n"
                  f"{indent}    ],\n"
                  f"{indent}    text: {label},\n"
                  f"{indent}  ),\n"
                  f"{indent});"
              )

          main, share_count = share_pattern.subn(
              replace_share,
              main,
          )

          print(
              f"Share API corrections: {share_count}"
          )

          if share_count < 2:
              print(
                  "Warning: fewer than two Share calls "
                  "were replaced"
              )

          # Enable tap-to-focus and prevent lifecycle conflicts.
          scanner_pattern = re.compile(
              r"MobileScanner\(\s*"
              r"controller:\s*scanner,\s*"
              r"onDetect:\s*processCapture,\s*"
              r"\)",
              re.MULTILINE,
          )

          scanner_replacement = """MobileScanner(
                      controller: scanner,
                      onDetect: processCapture,
                      tapToFocus: true,
                      useAppLifecycleState: false,
                    )"""

          main, scanner_count = scanner_pattern.subn(
              scanner_replacement,
              main,
              count=1,
          )

          print(
              f"Scanner widget corrections: "
              f"{scanner_count}"
          )

          if scanner_count != 1:
              raise SystemExit(
                  "MobileScanner widget could not be updated"
              )

          pubspec_path.write_text(
              pubspec,
              encoding="utf-8",
          )

          main_path.write_text(
              main,
              encoding="utf-8",
          )

          arabic_path.write_text(
              arabic,
              encoding="utf-8",
          )

          english_path.write_text(
              english,
              encoding="utf-8",
          )
          PY

      - name: Configure Android
        working-directory: smartchem_v4
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          application_id = (
              "om.smartchem.track.production"
          )

          manifest_path = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          manifest = manifest_path.read_text(
              encoding="utf-8"
          )

          required_entries = [
              (
                  '<uses-permission '
                  'android:name="android.permission.CAMERA" />'
              ),
              (
                  '<uses-permission '
                  'android:name="android.permission.VIBRATE" />'
              ),
              (
                  '<uses-feature '
                  'android:name="android.hardware.camera.any" '
                  'android:required="false" />'
              ),
              (
                  '<uses-feature '
                  'android:name="android.hardware.camera.autofocus" '
                  'android:required="false" />'
              ),
          ]

          first_tag_end = manifest.find(">")

          if first_tag_end < 0:
              raise SystemExit(
                  "Invalid AndroidManifest.xml"
              )

          missing_entries = [
              entry
              for entry in required_entries
              if entry not in manifest
          ]

          if missing_entries:
              manifest = (
                  manifest[:first_tag_end + 1]
                  + "\n    "
                  + "\n    ".join(missing_entries)
                  + manifest[first_tag_end + 1:]
              )

          manifest = re.sub(
              r'android:label="[^"]*"',
              'android:label="SmartChem Track"',
              manifest,
              count=1,
          )

          manifest_path.write_text(
              manifest,
              encoding="utf-8",
          )

          gradle_kts = Path(
              "android/app/build.gradle.kts"
          )

          gradle_groovy = Path(
              "android/app/build.gradle"
          )

          if gradle_kts.exists():

              gradle = gradle_kts.read_text(
                  encoding="utf-8"
              )

              gradle = re.sub(
                  r'applicationId\s*=\s*"[^"]+"',
                  f'applicationId = "{application_id}"',
                  gradle,
                  count=1,
              )

              gradle = re.sub(
                  r'minSdk\s*=\s*[^\n]+',
                  "minSdk = 23",
                  gradle,
                  count=1,
              )

              gradle_kts.write_text(
                  gradle,
                  encoding="utf-8",
              )

              print(
                  "Configured build.gradle.kts"
              )

          elif gradle_groovy.exists():

              gradle = gradle_groovy.read_text(
                  encoding="utf-8"
              )

              gradle = re.sub(
                  r'applicationId\s+["\'][^"\']+["\']',
                  f'applicationId "{application_id}"',
                  gradle,
                  count=1,
              )

              gradle = re.sub(
                  r'minSdkVersion\s+[^\n]+',
                  "minSdkVersion 23",
                  gradle,
                  count=1,
              )

              gradle_groovy.write_text(
                  gradle,
                  encoding="utf-8",
              )

              print(
                  "Configured build.gradle"
              )

          else:
              raise SystemExit(
                  "Android Gradle app file not found"
              )

          properties_path = Path(
              "android/gradle.properties"
          )

          properties = properties_path.read_text(
              encoding="utf-8"
          )

          additions = []

          if "android.useAndroidX=true" not in properties:
              additions.append(
                  "android.useAndroidX=true"
              )

          if "android.enableJetifier=true" not in properties:
              additions.append(
                  "android.enableJetifier=true"
              )

          if additions:
              properties += (
                  "\n"
                  + "\n".join(additions)
                  + "\n"
              )

          properties_path.write_text(
              properties,
              encoding="utf-8",
          )

          print(
              f"Application ID: {application_id}"
          )
          PY

      - name: Install Flutter packages
        working-directory: smartchem_v4
        shell: bash
        run: |
          set -e

          flutter clean
          flutter pub get
          flutter gen-l10n

          flutter pub deps \
            > ../smartchem-dependencies.txt

      - name: Format source
        working-directory: smartchem_v4
        shell: bash
        run: |
          dart format lib test

      - name: Verify corrected source
        shell: bash
        run: |
          set -e

          grep -n \
            "version: 4.0.1+2" \
            smartchem_v4/pubspec.yaml

          grep -n \
            "SharePlus.instance.share" \
            smartchem_v4/lib/main.dart

          grep -n \
            "TableHelper.fromTextArray" \
            smartchem_v4/lib/main.dart

          grep -n \
            "tapToFocus: true" \
            smartchem_v4/lib/main.dart

          grep -n \
            "useAppLifecycleState: false" \
            smartchem_v4/lib/main.dart

          if grep -n \
            "Share.shareXFiles" \
            smartchem_v4/lib/main.dart; then

            echo "Old Share.shareXFiles call still exists"
            exit 1
          fi

          echo "Source verification completed"

      - name: Analyze source
        working-directory: smartchem_v4
        shell: bash
        run: |
          set +e
          set -o pipefail

          flutter analyze \
            --no-fatal-warnings \
            --no-fatal-infos \
            2>&1 | tee ../smartchem-analyze.log

          ANALYZE_STATUS=${PIPESTATUS[0]}

          echo "$ANALYZE_STATUS" \
            > ../smartchem-analyze-status.txt

          echo "Analyze status: $ANALYZE_STATUS"

          exit 0

      - name: Run tests
        working-directory: smartchem_v4
        shell: bash
        run: |
          set +e
          set -o pipefail

          flutter test \
            2>&1 | tee ../smartchem-test.log

          TEST_STATUS=${PIPESTATUS[0]}

          echo "$TEST_STATUS" \
            > ../smartchem-test-status.txt

          echo "Test status: $TEST_STATUS"

          exit 0

      - name: Build test APK
        working-directory: smartchem_v4
        shell: bash
        run: |
          set +e
          set -o pipefail

          flutter build apk \
            --debug \
            --build-name=4.0.1 \
            --build-number=2 \
            2>&1 | tee ../smartchem-build.log

          BUILD_STATUS=${PIPESTATUS[0]}

          echo "$BUILD_STATUS" \
            > ../smartchem-build-status.txt

          tail -n 600 \
            ../smartchem-build.log \
            > ../smartchem-build-tail.log

          echo "Build status: $BUILD_STATUS"

          exit 0

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartChemTrack-v4.0.1-Diagnostic-Logs
          path: |
            smartchem-analyze.log
            smartchem-analyze-status.txt
            smartchem-test.log
            smartchem-test-status.txt
            smartchem-build.log
            smartchem-build-tail.log
            smartchem-build-status.txt
            smartchem-dependencies.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Check build result
        shell: bash
        run: |
          set -e

          BUILD_STATUS=$(
            cat smartchem-build-status.txt
          )

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "SmartChem APK build failed"
            echo "Last build messages:"
            cat smartchem-build-tail.log
            exit "$BUILD_STATUS"
          fi

          APK_PATH="smartchem_v4/build/app/outputs/flutter-apk/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "APK file was not created"
            exit 1
          fi

          echo "SmartChem APK created successfully"
          ls -lh "$APK_PATH"

      - name: Copy APK
        shell: bash
        run: |
          cp \
            smartchem_v4/build/app/outputs/flutter-apk/app-debug.apk \
            SmartChemTrack-v4.0.1-TEST.apk

          sha256sum \
            SmartChemTrack-v4.0.1-TEST.apk \
            > SmartChemTrack-v4.0.1-SHA256.txt

          ls -lh \
            SmartChemTrack-v4.0.1-TEST.apk

          cat \
            SmartChemTrack-v4.0.1-SHA256.txt

      - name: Upload SmartChem APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartChemTrack-v4.0.1-TEST-APK
          path: |
            SmartChemTrack-v4.0.1-TEST.apk
            SmartChemTrack-v4.0.1-SHA256.txt
          retention-days: 30
          if-no-files-found: error
