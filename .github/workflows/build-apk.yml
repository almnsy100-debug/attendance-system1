            Future<List<MaterialRecord>> materials({
              bool includeArchived = true,
            }) async {
              final List<Map<String, Object?>> rows =
                  await database.rawQuery(
                '''
                SELECT
                  m.*,
                  creator.full_name AS created_by_name,
                  last_user.full_name AS last_used_by_name
                FROM materials m
                LEFT JOIN users creator
                  ON creator.id = m.created_by
                LEFT JOIN users last_user
                  ON last_user.id = m.last_used_by
                ${includeArchived ? '' : 'WHERE m.deleted_at IS NULL'}
                ORDER BY m.created_at DESC
                ''',
              );

              return rows
                  .map(MaterialRecord.fromMap)
                  .toList();
            }

            Future<MaterialRecord?> materialById(
              int materialId,
            ) async {
              final List<Map<String, Object?>> rows =
                  await database.rawQuery(
                '''
                SELECT
                  m.*,
                  creator.full_name AS created_by_name,
                  last_user.full_name AS last_used_by_name
                FROM materials m
                LEFT JOIN users creator
                  ON creator.id = m.created_by
                LEFT JOIN users last_user
                  ON last_user.id = m.last_used_by
                WHERE m.id = ?
                LIMIT 1
                ''',
                <Object?>[materialId],
              );

              if (rows.isEmpty) {
                return null;
              }

              return MaterialRecord.fromMap(rows.first);
            }

            Future<MaterialRecord?> findMaterial({
              required String rawBarcode,
              required ParsedGs1 parsed,
            }) async {
              final String normalized =
                  rawBarcode.trim();

              List<Map<String, Object?>> rows =
                  await database.query(
                'materials',
                where:
                    'raw_barcode_value = ? '
                    'AND deleted_at IS NULL',
                whereArgs: <Object?>[normalized],
                limit: 1,
              );

              if (rows.isEmpty &&
                  parsed.serial.isNotEmpty) {
                rows = await database.query(
                  'materials',
                  where:
                      'serial_number = ? '
                      'AND deleted_at IS NULL',
                  whereArgs: <Object?>[
                    parsed.serial,
                  ],
                  limit: 1,
                );
              }

              if (rows.isEmpty &&
                  parsed.gtin.isNotEmpty &&
                  parsed.lot.isNotEmpty) {
                rows = await database.query(
                  'materials',
                  where:
                      'gtin = ? AND lot_number = ? '
                      'AND deleted_at IS NULL',
                  whereArgs: <Object?>[
                    parsed.gtin,
                    parsed.lot,
                  ],
                  limit: 1,
                );
              }

              if (rows.isEmpty) {
                return null;
              }

              return materialById(
                rows.first['id'] as int,
              );
            }

            Future<int> saveMaterial({
              required UserRecord actor,
              required Map<String, Object?> values,
              int? materialId,
              required String reason,
            }) async {
              requireAdmin(actor);

              if (materialId == null) {
                final int id = await database.insert(
                  'materials',
                  <String, Object?>{
                    ...values,
                    'used_quantity': 0,
                    'usage_count': 0,
                    'created_by': actor.id,
                    'created_at': isoNow(),
                    'status': 'active',
                    'sync_status': 'local',
                  },
                );

                await audit(
                  actor: actor,
                  entityType: 'material',
                  entityId: id,
                  action: 'ADD_MATERIAL',
                  newValue: jsonEncode(values),
                  reason: reason,
                );

                return id;
              }

              final MaterialRecord? old =
                  await materialById(materialId);

              await database.update(
                'materials',
                <String, Object?>{
                  ...values,
                  'updated_by': actor.id,
                  'updated_at': isoNow(),
                  'sync_status': 'local',
                },
                where: 'id = ?',
                whereArgs: <Object?>[materialId],
              );

              await _recalculateMaterial(materialId);

              await audit(
                actor: actor,
                entityType: 'material',
                entityId: materialId,
                action: 'EDIT_MATERIAL',
                oldValue: old == null
                    ? null
                    : jsonEncode(
                        <String, Object?>{
                          'name': old.name,
                          'original_quantity':
                              old.originalQuantity,
                          'used_quantity':
                              old.usedQuantity,
                          'department':
                              old.department,
                          'device':
                              old.deviceName,
                        },
                      ),
                newValue: jsonEncode(values),
                reason: reason,
              );

              return materialId;
            }

