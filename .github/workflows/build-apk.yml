name: Build SmartChem Track v4.0.9

on:
  workflow_dispatch:
  push:
    branches:
      - smartchem-apk-build

permissions:
  contents: read
  actions: read

concurrency:
  group: smartchem-v4-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build SmartChem Track v4.0.9 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: Show build environment
        shell: bash
        run: |
          set -e

          echo "========== FLUTTER =========="
          flutter --version

          echo "========== DART =========="
          dart --version

          echo "========== JAVA =========="
          java -version

          echo "========== ANDROID =========="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          flutter doctor -v

      - name: Install Android SDK 36 and NDK 28
        shell: bash
        run: |
          set -e

          SDKMANAGER=""

          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -x "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

          echo "Android SDK 36 installed"
          echo "Android NDK 28.2.13676358 installed"
          echo "CMake 3.22.1 installed"

      - name: Create clean Flutter Android project
        shell: bash
        run: |
          set -e

          rm -rf smartchem_v4
          rm -rf recovered_source

          flutter create smartchem_v4 \
            --platforms=android \
            --org om.smartchem.track \
            --project-name production

          rm -rf smartchem_v4/test
          rm -f smartchem_v4/analysis_options.yaml

          mkdir -p smartchem_v4/test
          mkdir -p smartchem_v4/lib/l10n

          echo "Clean Flutter project created"

      - name: Download complete SmartChem v4.0.7 source
        uses: actions/download-artifact@v5
        with:
          name: SmartChemTrack-v4.0.7-Diagnostic-Logs
          path: recovered_source
          repository: ${{ github.repository }}
          run-id: 29660217211
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore complete SmartChem source
        shell: bash
        run: |
          set -e

          echo "========== DOWNLOADED FILES =========="

          find recovered_source \
            -maxdepth 10 \
            -type f \
            -print

          python3 - <<'PY'
          from pathlib import Path
          import shutil

          recovered_directory = Path(
              "recovered_source"
          )

          project_directory = Path(
              "smartchem_v4"
          )

          main_candidates = list(
              recovered_directory.rglob(
                  "smartchem_v4/lib/main.dart"
              )
          )

          if not main_candidates:
              main_candidates = list(
                  recovered_directory.rglob(
                      "lib/main.dart"
                  )
              )

          if not main_candidates:
              raise SystemExit(
                  "SmartChem main.dart was not found "
                  "inside the downloaded artifact"
              )

          main_file = main_candidates[0]

          if main_file.parent.name != "lib":
              raise SystemExit(
                  f"Unexpected main.dart path: "
                  f"{main_file}"
              )

          source_root = main_file.parent.parent

          print(
              f"Recovered source root: "
              f"{source_root}"
          )

          required_files = [
              "pubspec.yaml",
              "l10n.yaml",
              "lib/main.dart",
              "lib/l10n/app_ar.arb",
              "lib/l10n/app_en.arb",
              "test/gs1_test.dart",
          ]

          for relative_path in required_files:
              source_file = (
                  source_root / relative_path
              )

              destination_file = (
                  project_directory / relative_path
              )

              if not source_file.exists():
                  raise SystemExit(
                      f"Missing recovered file: "
                      f"{source_file}"
                  )

              destination_file.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              shutil.copy2(
                  source_file,
                  destination_file,
              )

              print(
                  f"Restored: {relative_path}"
              )
          PY

          test -s smartchem_v4/pubspec.yaml
          test -s smartchem_v4/l10n.yaml
          test -s smartchem_v4/lib/main.dart
          test -s smartchem_v4/lib/l10n/app_ar.arb
          test -s smartchem_v4/lib/l10n/app_en.arb
          test -s smartchem_v4/test/gs1_test.dart

          grep -q \
            "class SmartChemApp" \
            smartchem_v4/lib/main.dart

          grep -q \
            "class AppDatabase" \
            smartchem_v4/lib/main.dart

          grep -q \
            "class ScannerScreen" \
            smartchem_v4/lib/main.dart

          grep -q \
            "class InventoryScreen" \
            smartchem_v4/lib/main.dart

          grep -q \
            "class MaterialDetailsScreen" \
            smartchem_v4/lib/main.dart

          grep -q \
            "class UsersScreen" \
            smartchem_v4/lib/main.dart

          echo "Complete SmartChem source restored"

      - name: Replace broken file picker and update v4.0.9
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          pubspec_path = Path(
              "smartchem_v4/pubspec.yaml"
          )

          main_path = Path(
              "smartchem_v4/lib/main.dart"
          )

          l10n_path = Path(
              "smartchem_v4/l10n.yaml"
          )

          arabic_path = Path(
              "smartchem_v4/lib/l10n/app_ar.arb"
          )

          english_path = Path(
              "smartchem_v4/lib/l10n/app_en.arb"
          )

          analysis_path = Path(
              "smartchem_v4/analysis_options.yaml"
          )

          lock_path = Path(
              "smartchem_v4/pubspec.lock"
          )

          pubspec = pubspec_path.read_text(
              encoding="utf-8"
          )

          main = main_path.read_text(
              encoding="utf-8"
          )

          l10n = l10n_path.read_text(
              encoding="utf-8"
          )

          arabic = arabic_path.read_text(
              encoding="utf-8"
          )

          english = english_path.read_text(
              encoding="utf-8"
          )

          # ==========================================
          # Application version
          # ==========================================

          pubspec, version_count = re.subn(
              r"(?m)^version:\s*[^\n]+$",
              "version: 4.0.9+10",
              pubspec,
              count=1,
          )

          if version_count != 1:
              raise SystemExit(
                  "Application version was not updated"
              )

          arabic = re.sub(
              r"الإصدار\s+\d+\.\d+\.\d+",
              "الإصدار 4.0.9",
              arabic,
              count=1,
          )

          english = re.sub(
              r"Version\s+\d+\.\d+\.\d+",
              "Version 4.0.9",
              english,
              count=1,
          )

          # ==========================================
          # Replace file_picker dependency
          # ==========================================

          pubspec, dependency_count = re.subn(
              r"(?m)^(\s*)file_picker:"
              r"\s*[^\n]+$",
              r"\1file_selector: 1.1.0",
              pubspec,
              count=1,
          )

          if dependency_count != 1:
              raise SystemExit(
                  "file_picker dependency was not found"
              )

          # ==========================================
          # Replace file_picker import
          # ==========================================

          import_pattern = re.compile(
              r"""(?m)^import\s+"""
              r"""['"]package:file_picker/"""
              r"""file_picker\.dart['"];\s*$"""
          )

          main, import_count = import_pattern.subn(
              (
                  "import "
                  "'package:file_selector/"
                  "file_selector.dart' "
                  "show XTypeGroup, openFile;"
              ),
              main,
              count=1,
          )

          if import_count != 1:
              raise SystemExit(
                  "file_picker import was not found"
              )

          # ==========================================
          # Replace Excel file selection block
          # ==========================================

          start_marker = (
              "final FilePickerResult? result ="
          )

          end_marker = (
              "final xls.Excel workbook ="
          )

          start_index = main.find(
              start_marker
          )

          if start_index < 0:
              raise SystemExit(
                  "Excel FilePicker start block "
                  "was not found"
              )

          start_line = main.rfind(
              "\n",
              0,
              start_index,
          ) + 1

          end_index = main.find(
              end_marker,
              start_index,
          )

          if end_index < 0:
              raise SystemExit(
                  "Excel workbook block was not found"
              )

          end_line = main.rfind(
              "\n",
              0,
              end_index,
          ) + 1

          indentation = main[
              start_line:start_index
          ]

          selected_file_block = (
              f"{indentation}const XTypeGroup "
              f"excelTypeGroup = XTypeGroup(\n"
              f"{indentation}  label: "
              f"'Excel workbook',\n"
              f"{indentation}  extensions: "
              f"<String>[\n"
              f"{indentation}    'xlsx',\n"
              f"{indentation}  ],\n"
              f"{indentation}  mimeTypes: "
              f"<String>[\n"
              f"{indentation}    "
              f"'application/vnd.openxmlformats-"
              f"officedocument.spreadsheetml.sheet',\n"
              f"{indentation}  ],\n"
              f"{indentation});\n"
              f"\n"
              f"{indentation}final XFile? "
              f"selectedFile =\n"
              f"{indentation}    await openFile(\n"
              f"{indentation}  acceptedTypeGroups: "
              f"<XTypeGroup>[\n"
              f"{indentation}    excelTypeGroup,\n"
              f"{indentation}  ],\n"
              f"{indentation});\n"
              f"\n"
              f"{indentation}if "
              f"(selectedFile == null) {{\n"
              f"{indentation}  return;\n"
              f"{indentation}}}\n"
              f"\n"
              f"{indentation}final Uint8List bytes =\n"
              f"{indentation}    await selectedFile"
              f".readAsBytes();\n"
              f"\n"
          )

          main = (
              main[:start_line]
              + selected_file_block
              + main[end_line:]
          )

          # ==========================================
          # Replace FilePicker result filename usage
          # ==========================================

          main = main.replace(
              "result!.files.single.name",
              "selectedFile.name",
          )

          main = main.replace(
              "result.files.single.name",
              "selectedFile.name",
          )

          # ==========================================
          # Remove obsolete localization setting
          # ==========================================

          l10n = re.sub(
              r"(?m)^\s*synthetic-package\s*:"
              r"\s*[^\n]+\n?",
              "",
              l10n,
          )

          # ==========================================
          # Remove obsolete const Excel constructors
          # ==========================================

          main = main.replace(
              "const xls.TextCellValue(",
              "xls.TextCellValue(",
          )

          main = main.replace(
              "const xls.DoubleCellValue(",
              "xls.DoubleCellValue(",
          )

          main = main.replace(
              "const xls.IntCellValue(",
              "xls.IntCellValue(",
          )

          # ==========================================
          # Remove an unnecessary null assertion
          # ==========================================

          main = main.replace(
              "selectedFile!.name",
              "selectedFile.name",
          )

          # ==========================================
          # Safety verification
          # ==========================================

          forbidden_main_values = [
              "package:file_picker/file_picker.dart",
              "FilePicker.",
              "FilePickerResult",
              "PlatformFile",
              "FilePickerPlugin",
              "result.files.single.name",
              "result!.files.single.name",
          ]

          for value in forbidden_main_values:
              if value in main:
                  raise SystemExit(
                      f"Old FilePicker value remains: "
                      f"{value}"
                  )

          forbidden_pubspec_values = [
              "file_picker:",
          ]

          for value in forbidden_pubspec_values:
              if value in pubspec:
                  raise SystemExit(
                      f"Old dependency remains: "
                      f"{value}"
                  )

          required_values = [
              "file_selector: 1.1.0",
              "package:file_selector/file_selector.dart",
              "const XTypeGroup excelTypeGroup",
              "final XFile? selectedFile",
              "await openFile(",
              "await selectedFile.readAsBytes()",
              "selectedFile.name",
              "SharePlus.instance.share",
              "pw.TableHelper.fromTextArray",
              "tapToFocus: true",
              "useAppLifecycleState: false",
              "addPostFrameCallback",
          ]

          combined_source = (
              pubspec + "\n" + main
          )

          for value in required_values:
              if value not in combined_source:
                  raise SystemExit(
                      f"Required value missing: "
                      f"{value}"
                  )

          pubspec_path.write_text(
              pubspec,
              encoding="utf-8",
          )

          main_path.write_text(
              main,
              encoding="utf-8",
          )

          l10n_path.write_text(
              l10n,
              encoding="utf-8",
          )

          arabic_path.write_text(
              arabic,
              encoding="utf-8",
          )

          english_path.write_text(
              english,
              encoding="utf-8",
          )

          if analysis_path.exists():
              analysis_path.unlink()

          if lock_path.exists():
              lock_path.unlink()

          print(
              "file_picker removed"
          )

          print(
              "file_selector 1.1.0 configured"
          )

          print(
              "SmartChem v4.0.9 source updated"
          )
          PY

      - name: Configure Android application
        working-directory: smartchem_v4
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          application_id = (
              "om.smartchem.track.production"
          )

          ndk_version = (
              "28.2.13676358"
          )

          # ==========================================
          # Android Manifest
          # ==========================================

          manifest_path = Path(
              "android/app/src/main/"
              "AndroidManifest.xml"
          )

          manifest = manifest_path.read_text(
              encoding="utf-8"
          )

          manifest_root = re.search(
              r"<manifest\b[^>]*>",
              manifest,
          )

          if manifest_root is None:
              raise SystemExit(
                  "Android manifest root "
                  "was not found"
              )

          required_entries = [
              (
                  '<uses-permission '
                  'android:name="android.permission.'
                  'CAMERA" />'
              ),
              (
                  '<uses-permission '
                  'android:name="android.permission.'
                  'VIBRATE" />'
              ),
              (
                  '<uses-feature '
                  'android:name="android.hardware.'
                  'camera.any" '
                  'android:required="false" />'
              ),
              (
                  '<uses-feature '
                  'android:name="android.hardware.'
                  'camera.autofocus" '
                  'android:required="false" />'
              ),
              (
                  '<uses-feature '
                  'android:name="android.hardware.'
                  'camera.flash" '
                  'android:required="false" />'
              ),
          ]

          missing_entries = [
              entry
              for entry in required_entries
              if entry not in manifest
          ]

          if missing_entries:
              insert_position = (
                  manifest_root.end()
              )

              manifest = (
                  manifest[:insert_position]
                  + "\n    "
                  + "\n    ".join(
                      missing_entries
                  )
                  + manifest[insert_position:]
              )

          manifest = re.sub(
              r'android:label="[^"]*"',
              'android:label="SmartChem Track"',
              manifest,
              count=1,
          )

          manifest_path.write_text(
              manifest,
              encoding="utf-8",
          )

          # ==========================================
          # Gradle Kotlin DSL
          # ==========================================

          gradle_kts_path = Path(
              "android/app/build.gradle.kts"
          )

          gradle_groovy_path = Path(
              "android/app/build.gradle"
          )

          if gradle_kts_path.exists():
              gradle = (
                  gradle_kts_path.read_text(
                      encoding="utf-8"
                  )
              )

              gradle = re.sub(
                  r'namespace\s*=\s*"[^"]+"',
                  (
                      f'namespace = '
                      f'"{application_id}"'
                  ),
                  gradle,
                  count=1,
              )

              gradle = re.sub(
                  r'applicationId\s*=\s*"[^"]+"',
                  (
                      f'applicationId = '
                      f'"{application_id}"'
                  ),
                  gradle,
                  count=1,
              )

              gradle = re.sub(
                  r'compileSdk\s*=\s*[^\n]+',
                  "compileSdk = 36",
                  gradle,
                  count=1,
              )

              gradle = re.sub(
                  r'minSdk\s*=\s*[^\n]+',
                  "minSdk = 23",
                  gradle,
                  count=1,
              )

              gradle = re.sub(
                  r'targetSdk\s*=\s*[^\n]+',
                  "targetSdk = 35",
                  gradle,
                  count=1,
              )

              if re.search(
                  r"(?m)^\s*ndkVersion\s*=",
                  gradle,
              ):
                  gradle = re.sub(
                      r'(?m)^(\s*)ndkVersion'
                      r'\s*=\s*[^\n]+',
                      (
                          rf'\1ndkVersion = '
                          rf'"{ndk_version}"'
                      ),
                      gradle,
                      count=1,
                  )
              else:
                  gradle = re.sub(
                      r"(?m)^(\s*)compileSdk"
                      r"\s*=\s*36\s*$",
                      (
                          r'\1compileSdk = 36'
                          "\n"
                          rf'\1ndkVersion = '
                          rf'"{ndk_version}"'
                      ),
                      gradle,
                      count=1,
                  )

              gradle = gradle.replace(
                  "JavaVersion.VERSION_11",
                  "JavaVersion.VERSION_17",
              )

              gradle = gradle.replace(
                  "JvmTarget.JVM_11",
                  "JvmTarget.JVM_17",
              )

              gradle = gradle.replace(
                  'jvmTarget = "11"',
                  'jvmTarget = "17"',
              )

              gradle = gradle.replace(
                  (
                      "jvmTarget = "
                      "JavaVersion.VERSION_11"
                      ".toString()"
                  ),
                  (
                      "jvmTarget = "
                      "JavaVersion.VERSION_17"
                      ".toString()"
                  ),
              )

              gradle_kts_path.write_text(
                  gradle,
                  encoding="utf-8",
              )

              print(
                  "Configured build.gradle.kts"
              )

          elif gradle_groovy_path.exists():
              gradle = (
                  gradle_groovy_path.read_text(
                      encoding="utf-8"
                  )
              )

              gradle = re.sub(
                  r'namespace\s+["\'][^"\']+'
                  r'["\']',
                  (
                      f'namespace '
                      f'"{application_id}"'
                  ),
                  gradle,
                  count=1,
              )

              gradle = re.sub(
                  r'applicationId\s+["\']'
                  r'[^"\']+["\']',
                  (
                      f'applicationId '
                      f'"{application_id}"'
                  ),
                  gradle,
                  count=1,
              )

              gradle = re.sub(
                  r'compileSdkVersion\s+[^\n]+',
                  "compileSdkVersion 36",
                  gradle,
                  count=1,
              )

              gradle = re.sub(
                  r'minSdkVersion\s+[^\n]+',
                  "minSdkVersion 23",
                  gradle,
                  count=1,
              )

              gradle = re.sub(
                  r'targetSdkVersion\s+[^\n]+',
                  "targetSdkVersion 35",
                  gradle,
                  count=1,
              )

              if re.search(
                  r"(?m)^\s*ndkVersion\s+",
                  gradle,
              ):
                  gradle = re.sub(
                      r'(?m)^(\s*)ndkVersion'
                      r'\s+[^\n]+',
                      (
                          rf'\1ndkVersion '
                          rf'"{ndk_version}"'
                      ),
                      gradle,
                      count=1,
                  )
              else:
                  gradle = re.sub(
                      r"(?m)^(\s*)"
                      r"compileSdkVersion\s+36\s*$",
                      (
                          r'\1compileSdkVersion 36'
                          "\n"
                          rf'\1ndkVersion '
                          rf'"{ndk_version}"'
                      ),
                      gradle,
                      count=1,
                  )

              gradle = gradle.replace(
                  "JavaVersion.VERSION_11",
                  "JavaVersion.VERSION_17",
              )

              gradle = gradle.replace(
                  "jvmTarget = '11'",
                  "jvmTarget = '17'",
              )

              gradle_groovy_path.write_text(
                  gradle,
                  encoding="utf-8",
              )

              print(
                  "Configured build.gradle"
              )

          else:
              raise SystemExit(
                  "Android Gradle application "
                  "file was not found"
              )

          # ==========================================
          # Gradle properties
          # ==========================================

          properties_path = Path(
              "android/gradle.properties"
          )

          properties = properties_path.read_text(
              encoding="utf-8"
          )

          properties_to_set = {
              "android.useAndroidX": "true",
              "android.enableJetifier": "true",
              "android.suppressUnsupportedCompileSdk":
                  "36",
              "org.gradle.jvmargs":
                  "-Xmx4096m "
                  "-XX:MaxMetaspaceSize=1024m "
                  "-XX:ReservedCodeCacheSize=512m "
                  "-Dfile.encoding=UTF-8",
              "org.gradle.daemon": "false",
              "org.gradle.parallel": "true",
              "kotlin.code.style": "official",
          }

          for key, value in (
              properties_to_set.items()
          ):
              expression = re.compile(
                  rf"(?m)^{re.escape(key)}=.*$"
              )

              new_line = (
                  f"{key}={value}"
              )

              if expression.search(properties):
                  properties = expression.sub(
                      new_line,
                      properties,
                  )
              else:
                  properties += (
                      "\n" + new_line
                  )

          properties_path.write_text(
              properties.strip() + "\n",
              encoding="utf-8",
          )

          print(
              f"Application ID: "
              f"{application_id}"
          )

          print("compileSdk: 36")
          print("targetSdk: 35")
          print("minSdk: 23")
          print(f"NDK: {ndk_version}")
          print("Java: 17")
          PY

      - name: Remove old plugin registration and caches
        working-directory: smartchem_v4
        shell: bash
        run: |
          set -e

          flutter clean

          rm -rf .dart_tool
          rm -rf build
          rm -rf android/.gradle
          rm -rf android/app/build
          rm -rf android/build

          rm -rf \
            android/app/src/main/java/io/flutter/plugins

          rm -rf \
            android/app/src/debug/java/io/flutter/plugins

          rm -rf \
            android/app/src/profile/java/io/flutter/plugins

          rm -f pubspec.lock
          rm -f .flutter-plugins
          rm -f .flutter-plugins-dependencies

          echo "Old plugin registration removed"
          echo "Old FilePicker caches removed"

      - name: Install exact Flutter packages
        working-directory: smartchem_v4
        shell: bash
        run: |
          set -e
          set -o pipefail

          flutter pub get \
            2>&1 | tee \
            ../smartchem-v4.0.9-pub-get.log

          flutter gen-l10n \
            2>&1 | tee \
            ../smartchem-v4.0.9-l10n.log

          cp \
            pubspec.lock \
            ../smartchem-v4.0.9-pubspec.lock

          flutter pub deps \
            > ../smartchem-v4.0.9-dependencies.txt

