          Color statusColor(MaterialStatus status) {
            switch (status) {
              case MaterialStatus.valid:
                return Colors.green;
              case MaterialStatus.nearExpiry:
                return Colors.amber;
              case MaterialStatus.expired:
                return Colors.red;
              case MaterialStatus.unapproved:
                return Colors.orange;
              case MaterialStatus.empty:
                return Colors.grey;
            }
          }

          String statusName(MaterialStatus status) {
            switch (status) {
              case MaterialStatus.valid:
                return 'صالح';
              case MaterialStatus.nearExpiry:
                return 'قريب الانتهاء';
              case MaterialStatus.expired:
                return 'منتهي';
              case MaterialStatus.unapproved:
                return 'غير معتمد';
              case MaterialStatus.empty:
                return 'نفدت الكمية';
            }
          }

          class InventoryScreen extends StatefulWidget {
            const InventoryScreen({super.key});

            @override
            State<InventoryScreen> createState() {
              return _InventoryScreenState();
            }
          }

          class _InventoryScreenState
              extends State<InventoryScreen> {
            Future<void> registerUsage(
              LabMaterial material,
            ) async {
              final user = AppStore.currentUser!;
              final status = material.status;

              if (!user.canUseMaterials) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(
                    content: Text(
                      'لا توجد لديك صلاحية تسجيل الاستخدام',
                    ),
                  ),
                );

                return;
              }

              if (status == MaterialStatus.expired ||
                  status == MaterialStatus.unapproved ||
                  status == MaterialStatus.empty) {
                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(
                    backgroundColor: statusColor(status),
                    content: Text(
                      status == MaterialStatus.expired
                          ? 'لا يمكن الاستخدام: المادة منتهية'
                          : status ==
                                  MaterialStatus.unapproved
                              ? 'لا يمكن الاستخدام: المادة غير معتمدة'
                              : 'لا يمكن الاستخدام: نفدت الكمية',
                    ),
                  ),
                );

                return;
              }

              if (status == MaterialStatus.nearExpiry) {
                final accepted =
                    await showDialog<bool>(
                  context: context,
                  builder: (dialogContext) {
                    return AlertDialog(
                      title: const Text(
                        'تنبيه قرب انتهاء الصلاحية',
                      ),
                      content: Text(
                        '${material.name}\n'
                        'تاريخ الانتهاء: '
                        '${DateFormat('dd/MM/yyyy').format(material.expiryDate)}',
                      ),
                      actions: [
                        TextButton(
                          onPressed: () {
                            Navigator.of(dialogContext)
                                .pop(false);
                          },
                          child: const Text('إلغاء'),
                        ),
                        FilledButton(
                          onPressed: () {
                            Navigator.of(dialogContext)
                                .pop(true);
                          },
                          child: const Text('متابعة'),
                        ),
                      ],
                    );
                  },
                );

                if (accepted != true || !mounted) {
                  return;
                }
              }

              final quantityController =
                  TextEditingController(text: '1');

              final usedQuantity =
                  await showDialog<double>(
                context: context,
                builder: (dialogContext) {
                  return AlertDialog(
                    title: Text(
                      'تسجيل استخدام ${material.name}',
                    ),
                    content: TextField(
                      controller: quantityController,
                      keyboardType:
                          const TextInputType
                              .numberWithOptions(
                        decimal: true,
                      ),
                      decoration: InputDecoration(
                        labelText:
                            'الكمية المستخدمة - المتبقي '
                            '${material.remainingQuantity}',
                      ),
                    ),
                    actions: [
                      TextButton(
                        onPressed: () {
                          Navigator.of(dialogContext).pop();
                        },
                        child: const Text('إلغاء'),
                      ),
                      FilledButton(
                        onPressed: () {
                          Navigator.of(dialogContext).pop(
                            double.tryParse(
                              quantityController.text,
                            ),
                          );
                        },
                        child: const Text('حفظ'),
                      ),
                    ],
                  );
                },
              );

              quantityController.dispose();

              if (usedQuantity == null ||
                  usedQuantity <= 0 ||
                  usedQuantity >
                      material.remainingQuantity) {
                return;
              }

              setState(() {
                material.usedQuantity += usedQuantity;
                material.openedAt ??= DateTime.now();

                AppStore.usageRecords.insert(
                  0,
                  UsageRecord(
                    materialName: material.name,
                    materialType: material.type,
                    device: material.device,
                    employee: user.name,
                    quantity: usedQuantity,
                    dateTime: DateTime.now(),
                  ),
                );
              });
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('المخزون'),
                ),
                body: AppStore.materials.isEmpty
                    ? const Center(
                        child:
                            Text('لا توجد مواد مسجلة'),
                      )
                    : ListView.separated(
                        padding:
                            const EdgeInsets.all(12),
                        itemCount:
                            AppStore.materials.length,
                        separatorBuilder: (_, __) {
                          return const SizedBox(height: 8);
                        },
                        itemBuilder: (_, index) {
                          final material =
                              AppStore.materials[index];

                          final currentStatus =
                              material.status;

                          return Card(
                            child: ListTile(
                              leading: CircleAvatar(
                                backgroundColor:
                                    statusColor(
                                  currentStatus,
                                ),
                                child: const Icon(
                                  Icons.science,
                                  color: Colors.white,
                                ),
                              ),
                              title: Text(material.name),
                              subtitle: Text(
                                '${material.type} • '
                                '${material.device}\n'
                                'LOT: ${material.lot}\n'
                                'الانتهاء: '
                                '${DateFormat('dd/MM/yyyy').format(material.expiryDate)}\n'
                                'المتبقي: '
                                '${material.remainingQuantity}',
                              ),
                              trailing: Text(
                                statusName(currentStatus),
                                style: TextStyle(
                                  color: statusColor(
                                    currentStatus,
                                  ),
                                  fontWeight:
                                      FontWeight.bold,
                                ),
                              ),
                              onTap: () {
                                registerUsage(material);
                              },
                            ),
                          );
                        },
                      ),
              );
            }
          }

          class ReportsScreen extends StatelessWidget {
            const ReportsScreen({super.key});

            List<UsageRecord> recordsFor(
              Duration duration,
            ) {
              final start =
                  DateTime.now().subtract(duration);

              return AppStore.usageRecords
                  .where(
                    (record) =>
                        record.dateTime.isAfter(start),
                  )
                  .toList();
            }

            Widget reportCard(
              BuildContext context,
              String title,
              Duration duration,
            ) {
              final records = recordsFor(duration);

              final total = records.fold<double>(
                0.0,
                (sum, record) =>
                    sum + record.quantity,
              );

              return Card(
                child: Padding(
                  padding: const EdgeInsets.all(16),
                  child: Column(
                    crossAxisAlignment:
                        CrossAxisAlignment.start,
                    children: [
                      Text(
                        title,
                        style: Theme.of(context)
                            .textTheme
                            .titleLarge,
                      ),
                      const SizedBox(height: 8),
                      Text(
                        'عدد العمليات: ${records.length}',
                      ),
                      Text(
                        'إجمالي الكمية المستخدمة: $total',
                      ),
                    ],
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar:
                    AppBar(title: const Text('التقارير')),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    reportCard(
                      context,
                      'التقرير اليومي',
                      const Duration(days: 1),
                    ),
                    const SizedBox(height: 10),
                    reportCard(
                      context,
                      'التقرير الأسبوعي',
                      const Duration(days: 7),
                    ),
                    const SizedBox(height: 10),
                    reportCard(
                      context,
                      'التقرير الشهري',
                      const Duration(days: 30),
                    ),
                    const SizedBox(height: 18),
                    Text(
                      'آخر عمليات الاستخدام',
                      style:
                          Theme.of(context).textTheme.titleLarge,
                    ),
                    const SizedBox(height: 8),
                    if (AppStore.usageRecords.isEmpty)
                      const Card(
                        child: Padding(
                          padding: EdgeInsets.all(16),
                          child: Text(
                            'لا توجد عمليات استخدام',
                          ),
                        ),
                      ),
                    ...AppStore.usageRecords.take(20).map(
                      (record) {
                        return Padding(
                          padding:
                              const EdgeInsets.only(
                            bottom: 8,
                          ),
                          child: Card(
                            child: ListTile(
                              title:
                                  Text(record.materialName),
                              subtitle: Text(
                                '${record.employee} • '
                                '${record.device}\n'
                                '${DateFormat('dd/MM/yyyy HH:mm').format(record.dateTime)}',
                              ),
                              trailing: Text(
                                record.quantity.toString(),
                              ),
                            ),
                          ),
                        );
                      },
                    ),
                  ],
                ),
              );
            }
          }

