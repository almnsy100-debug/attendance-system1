          class _InventoryScreenState
              extends State<InventoryScreen> {
            Future<void> registerUsage(
              LabMaterial material,
            ) async {
              final user =
                  AppStore.currentUser!;

              final currentStatus =
                  material.status;

              if (!user.canUseMaterials) {
                ScaffoldMessenger.of(context)
                    .showSnackBar(
                  const SnackBar(
                    content: Text(
                      'ليس لديك صلاحية تسجيل الاستخدام',
                    ),
                  ),
                );

                return;
              }

              if (currentStatus ==
                      MaterialStatus.expired ||
                  currentStatus ==
                      MaterialStatus
                          .unapproved ||
                  currentStatus ==
                      MaterialStatus.empty) {
                ScaffoldMessenger.of(context)
                    .showSnackBar(
                  SnackBar(
                    backgroundColor:
                        materialStatusColor(
                      currentStatus,
                    ),
                    content: Text(
                      currentStatus ==
                              MaterialStatus
                                  .expired
                          ? 'لا يمكن الاستخدام: المادة منتهية'
                          : currentStatus ==
                                  MaterialStatus
                                      .unapproved
                              ? 'لا يمكن الاستخدام: المادة غير معتمدة'
                              : 'لا يمكن الاستخدام: نفدت الكمية',
                    ),
                  ),
                );

                return;
              }

              if (currentStatus ==
                  MaterialStatus.nearExpiry) {
                final accepted =
                    await showDialog<bool>(
                  context: context,
                  builder:
                      (dialogContext) {
                    return AlertDialog(
                      title: const Text(
                        'تنبيه قرب انتهاء الصلاحية',
                      ),
                      content: Text(
                        '${material.name}\n'
                        'تاريخ الانتهاء: '
                        '${formatDate(material.expiryDate)}',
                      ),
                      actions: [
                        TextButton(
                          onPressed: () {
                            Navigator.of(
                              dialogContext,
                            ).pop(false);
                          },
                          child: const Text(
                            'إلغاء',
                          ),
                        ),
                        FilledButton(
                          onPressed: () {
                            Navigator.of(
                              dialogContext,
                            ).pop(true);
                          },
                          child: const Text(
                            'متابعة',
                          ),
                        ),
                      ],
                    );
                  },
                );

                if (accepted != true ||
                    !mounted) {
                  return;
                }
              }

              final quantityController =
                  TextEditingController(
                text: '1',
              );

              final usedQuantity =
                  await showDialog<double>(
                context: context,
                builder:
                    (dialogContext) {
                  return AlertDialog(
                    title: Text(
                      'تسجيل استخدام '
                      '${material.name}',
                    ),
                    content: TextField(
                      controller:
                          quantityController,
                      keyboardType:
                          const TextInputType
                              .numberWithOptions(
                        decimal: true,
                      ),
                      decoration:
                          InputDecoration(
                        labelText:
                            'المستخدم - المتبقي '
                            '${material.remainingQuantity}',
                      ),
                    ),
                    actions: [
                      TextButton(
                        onPressed: () {
                          Navigator.of(
                            dialogContext,
                          ).pop();
                        },
                        child:
                            const Text('إلغاء'),
                      ),
                      FilledButton(
                        onPressed: () {
                          Navigator.of(
                            dialogContext,
                          ).pop(
                            double.tryParse(
                              quantityController
                                  .text,
                            ),
                          );
                        },
                        child:
                            const Text('حفظ'),
                      ),
                    ],
                  );
                },
              );

              quantityController.dispose();

              if (usedQuantity == null ||
                  usedQuantity <= 0 ||
                  usedQuantity >
                      material
                          .remainingQuantity) {
                return;
              }

              setState(() {
                material.usedQuantity +=
                    usedQuantity;

                material.openedAt ??=
                    DateTime.now();

                AppStore.usageRecords.insert(
                  0,
                  UsageRecord(
                    materialName:
                        material.name,
                    materialType:
                        material.type,
                    device:
                        material.device,
                    employee: user.name,
                    quantity:
                        usedQuantity,
                    dateTime:
                        DateTime.now(),
                  ),
                );
              });
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title:
                      const Text('المخزون'),
                ),
                body: AppStore
                        .materials.isEmpty
                    ? const Center(
                        child: Text(
                          'لا توجد مواد مسجلة',
                        ),
                      )
                    : ListView.separated(
                        padding:
                            const EdgeInsets
                                .all(12),
                        itemCount:
                            AppStore
                                .materials.length,
                        separatorBuilder:
                            (_, __) {
                          return const SizedBox(
                            height: 8,
                          );
                        },
                        itemBuilder:
                            (_, index) {
                          final material =
                              AppStore
                                      .materials[
                                  index];

                          final status =
                              material.status;

                          return Card(
                            child: ListTile(
                              leading:
                                  CircleAvatar(
                                backgroundColor:
                                    materialStatusColor(
                                  status,
                                ),
                                child:
                                    const Icon(
                                  Icons.science,
                                  color:
                                      Colors.white,
                                ),
                              ),
                              title: Text(
                                material.name,
                              ),
                              subtitle: Text(
                                '${material.type} • '
                                '${material.device}\n'
                                'LOT: ${material.lot}\n'
                                'الانتهاء: '
                                '${formatDate(material.expiryDate)}\n'
                                'المتبقي: '
                                '${material.remainingQuantity}',
                              ),
                              trailing: Text(
                                materialStatusName(
                                  status,
                                ),
                                style:
                                    TextStyle(
                                  color:
                                      materialStatusColor(
                                    status,
                                  ),
                                  fontWeight:
                                      FontWeight
                                          .bold,
                                ),
                              ),
                              onTap: () {
                                registerUsage(
                                  material,
                                );
                              },
                            ),
                          );
                        },
                      ),
              );
            }
          }

          class ReportsScreen
              extends StatelessWidget {
            const ReportsScreen({super.key});

            List<UsageRecord> recordsFor(
              Duration duration,
            ) {
              final start =
                  DateTime.now().subtract(
                duration,
              );

              return AppStore.usageRecords
                  .where(
                    (record) =>
                        record.dateTime.isAfter(
                      start,
                    ),
                  )
                  .toList();
            }

            Widget reportCard(
              BuildContext context,
              String title,
              Duration duration,
            ) {
              final records =
                  recordsFor(duration);

              final total =
                  records.fold<double>(
                0.0,
                (sum, record) =>
                    sum + record.quantity,
              );

              return Card(
                child: Padding(
                  padding:
                      const EdgeInsets.all(16),
                  child: Column(
                    crossAxisAlignment:
                        CrossAxisAlignment.start,
                    children: [
                      Text(
                        title,
                        style: Theme.of(context)
                            .textTheme
                            .titleLarge,
                      ),
                      const SizedBox(height: 8),
                      Text(
                        'عدد عمليات الاستخدام: '
                        '${records.length}',
                      ),
                      Text(
                        'إجمالي الكمية المستخدمة: '
                        '$total',
                      ),
                    ],
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title:
                      const Text('التقارير'),
                ),
                body: ListView(
                  padding:
                      const EdgeInsets.all(16),
                  children: [
                    reportCard(
                      context,
                      'التقرير اليومي',
                      const Duration(days: 1),
                    ),
                    const SizedBox(height: 10),
                    reportCard(
                      context,
                      'التقرير الأسبوعي',
                      const Duration(days: 7),
                    ),
                    const SizedBox(height: 10),
                    reportCard(
                      context,
                      'التقرير الشهري',
                      const Duration(days: 30),
                    ),
                    const SizedBox(height: 18),
                    Text(
                      'آخر عمليات الاستخدام',
                      style: Theme.of(context)
                          .textTheme
                          .titleLarge,
                    ),
                    const SizedBox(height: 8),
                    if (AppStore
                        .usageRecords.isEmpty)
                      const Card(
                        child: Padding(
                          padding:
                              EdgeInsets.all(16),
                          child: Text(
                            'لا توجد عمليات استخدام',
                          ),
                        ),
                      ),
                    ...AppStore.usageRecords
                        .take(20)
                        .map(
                      (record) {
                        return Padding(
                          padding:
                              const EdgeInsets
                                  .only(
                            bottom: 8,
                          ),
                          child: Card(
                            child: ListTile(
                              title: Text(
                                record
                                    .materialName,
                              ),
                              subtitle: Text(
                                '${record.employee} • '
                                '${record.device}\n'
                                '${formatDateTime(record.dateTime)}',
