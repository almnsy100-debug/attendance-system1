                        ),
                        title: Text(user.name),
                        subtitle: Text(
                          '${user.username} • '
                          '${user.isAdmin ? 'رئيسي' : 'عادي'}'
                          '${currentUser ? ' • الحساب الحالي' : ''}',
                        ),
                        trailing: Switch(
                          value: user.isActive,
                          onChanged: currentUser
                              ? null
                              : (value) {
                                  setState(() {
                                    user.isActive =
                                        value;
                                  });
                                },
                        ),
                        children: [
                          SwitchListTile(
                            title: const Text(
                              'السماح بمسح الباركود',
                            ),
                            value: user.canScan,
                            onChanged: (value) {
                              setState(() {
                                user.canScan = value;
                              });
                            },
                          ),
                          SwitchListTile(
                            title: const Text(
                              'السماح بتسجيل الاستخدام',
                            ),
                            value:
                                user.canUseMaterials,
                            onChanged: (value) {
                              setState(() {
                                user.canUseMaterials =
                                    value;
                              });
                            },
                          ),
                          SwitchListTile(
                            title: const Text(
                              'عرض التقارير',
                            ),
                            value:
                                user.canViewReports,
                            onChanged: (value) {
                              setState(() {
                                user.canViewReports =
                                    value;
                              });
                            },
                          ),
                        ],
                      ),
                    );
                  },
                ),
              );
            }
          }
          DART

      - name: Configure Android
        working-directory: smartchem_v2
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text(encoding="utf-8")

          permission = (
              '<uses-permission '
              'android:name="android.permission.CAMERA" />'
          )

          if permission not in text:
              position = text.find(">")

              text = (
                  text[:position + 1]
                  + "\n    "
                  + permission
                  + text[position + 1:]
              )

          text = text.replace(
              'android:label="smartchem_track_v2"',
              'android:label="SmartChem Track v2.0.2"'
          )

          manifest.write_text(
              text,
              encoding="utf-8"
          )

          gradle = Path(
              "android/app/build.gradle.kts"
          )

          if gradle.exists():
              content = gradle.read_text(
                  encoding="utf-8"
              )

              content = content.replace(
                  'applicationId = '
                  '"om.smartchem.smartchem_track_v2"',
                  'applicationId = '
                  '"om.smartchem.track.v2"'
              )

              content = content.replace(
                  "minSdk = flutter.minSdkVersion",
                  "minSdk = 23"
              )

              gradle.write_text(
                  content,
                  encoding="utf-8"
              )
          PY

      - name: Build release APK
        working-directory: smartchem_v2
        run: |
          flutter build apk \
            --release \
            --build-name=2.0.2 \
            --build-number=4

      - name: Rename APK
        run: |
          cp \
            smartchem_v2/build/app/outputs/flutter-apk/app-release.apk \
            SmartChemTrack-v2.0.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartChemTrack-v2.0.2-APK
          path: SmartChemTrack-v2.0.2.apk
          retention-days: 30
          if-no-files-found: error
