            final AppStore store;

            Future<void> scanMaterial(
              BuildContext context,
            ) async {
              final String? raw =
                  await Navigator.of(context)
                      .push<String>(
                MaterialPageRoute<String>(
                  builder: (
                    BuildContext context,
                  ) {
                    return const ScannerScreen();
                  },
                ),
              );

              if (raw == null ||
                  raw.trim().isEmpty ||
                  !context.mounted) {
                return;
              }

              final ParsedGs1 parsed =
                  parseGs1Barcode(raw);

              final MaterialRecord? existing =
                  store.findMaterial(
                raw,
                parsed,
              );

              if (existing != null) {
                await Navigator.of(context).push(
                  MaterialPageRoute<void>(
                    builder: (
                      BuildContext context,
                    ) {
                      return MaterialDetailsScreen(
                        store: store,
                        materialId: existing.id,
                      );
                    },
                  ),
                );

                return;
              }

              final MaterialRecord? registered =
                  await Navigator.of(context)
                      .push<MaterialRecord>(
                MaterialPageRoute<MaterialRecord>(
                  builder: (
                    BuildContext context,
                  ) {
                    return RegisterMaterialScreen(
                      store: store,
                      rawBarcode: raw,
                      parsed: parsed,
                    );
                  },
                ),
              );

              if (registered == null ||
                  !context.mounted) {
                return;
              }

              await Navigator.of(context).push(
                MaterialPageRoute<void>(
                  builder: (
                    BuildContext context,
                  ) {
                    return MaterialDetailsScreen(
                      store: store,
                      materialId: registered.id,
                    );
                  },
                ),
              );
            }

