          }

          class _MaterialFormScreenState
              extends State<MaterialFormScreen> {
            late final TextEditingController
                internalNo;

            late final TextEditingController name;
            late final TextEditingController barcode;
            late final TextEditingController gtin;
            late final TextEditingController lot;
            late final TextEditingController serial;
            late final TextEditingController catalog;
            late final TextEditingController department;
            late final TextEditingController device;
            late final TextEditingController storage;
            late final TextEditingController manufacturer;
            late final TextEditingController originalQty;
            late final TextEditingController unit;
            late final TextEditingController minStock;
            late final TextEditingController receiptDate;
            late final TextEditingController expiryDate;
            late final TextEditingController openedDate;
            late final TextEditingController afterOpenDate;
            late final TextEditingController notes;
            late final TextEditingController reason;

            String type = 'Reagent';
            bool approved = false;
            bool blocked = false;
            bool saving = false;

            @override
            void initState() {
              super.initState();

              final MaterialRecord? item =
                  widget.material;

              final ParsedGs1? parsed =
                  widget.parsed;

              internalNo = TextEditingController(
                text: item?.internalNo ??
                    'MAT-${DateTime.now().millisecondsSinceEpoch}',
              );

              name = TextEditingController(
                text: item?.name ?? '',
              );

              barcode = TextEditingController(
                text: item?.rawBarcode ??
                    widget.rawBarcode,
              );

              gtin = TextEditingController(
                text: item?.gtin ??
                    parsed?.gtin ??
                    '',
              );

              lot = TextEditingController(
                text: item?.lotNumber ??
                    parsed?.lot ??
                    '',
              );

              serial = TextEditingController(
                text: item?.serialNumber ??
                    parsed?.serial ??
                    '',
              );

              catalog = TextEditingController(
                text: item?.catalogNumber ??
                    parsed?.catalog ??
                    '',
              );

              department = TextEditingController(
                text: item?.department ?? '',
              );

              device = TextEditingController(
                text: item?.deviceName ?? '',
              );

              storage = TextEditingController(
                text: item?.storageLocation ?? '',
              );

              manufacturer =
                  TextEditingController(
                text: item?.manufacturer ?? '',
              );

              originalQty =
                  TextEditingController(
                text: item == null
                    ? ''
                    : item.originalQuantity
                        .toString(),
              );

              unit = TextEditingController(
                text: item?.unit ?? 'mL',
              );

              minStock = TextEditingController(
                text: item == null
                    ? '0'
                    : item.minStock.toString(),
              );

              receiptDate =
                  TextEditingController(
                text: item == null
                    ? DateFormat('yyyy-MM-dd')
                        .format(DateTime.now())
                    : item.receivedAt
                            ?.toIso8601String()
                            .substring(0, 10) ??
                        '',
              );

              expiryDate =
                  TextEditingController(
                text: item == null
                    ? parsed?.expiryDate
                            ?.toIso8601String()
                            .substring(0, 10) ??
                        ''
                    : item.manufacturerExpiry
                            ?.toIso8601String()
                            .substring(0, 10) ??
                        '',
              );

              openedDate =
                  TextEditingController(
                text: item?.openedAt
                        ?.toIso8601String()
                        .substring(0, 10) ??
                    '',
              );

              afterOpenDate =
                  TextEditingController(
                text: item?.afterOpenExpiry
                        ?.toIso8601String()
                        .substring(0, 10) ??
                    '',
              );

              notes = TextEditingController(
                text: item?.notes ?? '',
              );

              reason = TextEditingController(
                text: item == null
                    ? 'تسجيل مادة جديدة'
                    : '',
              );

              type = item?.type ?? 'Reagent';
              approved = item?.isApproved ?? false;
              blocked = item?.isBlocked ?? false;
            }

            Future<void> save() async {
              final AppLocalizations text =
                  AppLocalizations.of(context);

              if (name.text.trim().isEmpty ||
                  internalNo.text.trim().isEmpty ||
                  unit.text.trim().isEmpty ||
                  originalQty.text.trim().isEmpty ||
                  reason.text.trim().isEmpty) {
                ScaffoldMessenger.of(context)
                    .showSnackBar(
                  SnackBar(
                    content:
                        Text(text.enterRequired),
                  ),
                );

                return;
              }

              final double quantity =
                  numberValue(
                normalizedDigits(
                  originalQty.text,
                ),
              );

              if (quantity < 0 ||
                  (widget.material != null &&
                      quantity <
                          widget.material!
                              .usedQuantity)) {
                ScaffoldMessenger.of(context)
                    .showSnackBar(
                  SnackBar(
                    content:
                        Text(text.invalidQuantity),
                  ),
                );

                return;
              }

              setState(() {
                saving = true;
              });

              try {
                final int id =
                    await widget.controller.db
                        .saveMaterial(
                  actor:
                      widget.controller.currentUser!,
                  materialId:
                      widget.material?.id,
                  reason: reason.text.trim(),
                  values: <String, Object?>{
                    'internal_no':
                        internalNo.text.trim(),
                    'name': name.text.trim(),
                    'type': type,
                    'raw_barcode_value':
                        barcode.text.trim(),
                    'barcode_format':
                        widget.material
                                ?.barcodeFormat ??
                            widget.barcodeFormat,
                    'gtin': gtin.text.trim(),
                    'lot_number':
                        lot.text.trim(),
                    'serial_number':
                        serial.text.trim(),
                    'catalog_number':
                        catalog.text.trim(),
                    'department':
                        department.text.trim(),
                    'device_name':
                        device.text.trim(),
                    'storage_location':
                        storage.text.trim(),
                    'manufacturer':
                        manufacturer.text.trim(),
                    'original_quantity':
                        quantity,
                    'unit': unit.text.trim(),
                    'min_stock': numberValue(
                      normalizedDigits(
                        minStock.text,
                      ),
                    ),
                    'received_at':
                        parseDateValue(
                                  receiptDate.text,
                                )
                                ?.toIso8601String(),
                    'manufacturer_expiry':
                        parseDateValue(
                                  expiryDate.text,
                                )
                                ?.toIso8601String(),
                    'opened_at': parseDateValue(
                              openedDate.text,
                            )
                            ?.toIso8601String(),
                    'after_open_expiry':
                        parseDateValue(
                                  afterOpenDate.text,
                                )
                                ?.toIso8601String(),
                    'is_approved':
                        approved ? 1 : 0,
                    'is_blocked':
                        blocked ? 1 : 0,
                    'notes': notes.text.trim(),
                  },
                );

                widget.controller.refresh();

                if (mounted) {
                  Navigator.of(context).pop(id);
                }
              } catch (error) {
                if (mounted) {
                  ScaffoldMessenger.of(context)
                      .showSnackBar(
                    SnackBar(
                      content:
                          Text(error.toString()),
                    ),
                  );
                }
              } finally {
                if (mounted) {
                  setState(() {
                    saving = false;
                  });
                }
              }
            }

            Widget field(
              TextEditingController controller,
              String label, {
              TextInputType? keyboardType,
              int maxLines = 1,
            }) {
              return Padding(
                padding:
                    const EdgeInsets.only(bottom: 12),
                child: TextField(
                  controller: controller,
                  keyboardType: keyboardType,
                  maxLines: maxLines,
                  decoration:
                      InputDecoration(
                    labelText: label,
                  ),
                ),
              );
            }

            @override
            void dispose() {
              for (final TextEditingController item
                  in <TextEditingController>[
                internalNo,
                name,
                barcode,
                gtin,
                lot,
                serial,
                catalog,
                department,
                device,
                storage,
                manufacturer,
                originalQty,
                unit,
                minStock,
                receiptDate,
                expiryDate,
                openedDate,
                afterOpenDate,
                notes,
                reason,
              ]) {
                item.dispose();
              }

              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              final AppLocalizations text =
                  AppLocalizations.of(context);

              return Scaffold(
                appBar: AppBar(
                  title: Text(
                    widget.material == null
                        ? text.addMaterial
                        : text.editMaterial,
                  ),
                ),
                body: ListView(
                  padding:
                      const EdgeInsets.all(16),
                  children: <Widget>[
                    field(
                      internalNo,
                      text.internalNo,
                    ),
                    field(name, text.name),
                    DropdownButtonFormField<String>(
                      initialValue: type,
                      decoration: InputDecoration(
                        labelText: text.type,
                      ),
                      items: const <String>[
                        'Reagent',
                        'Control',
                        'Calibrator',
                      ].map(
                        (String value) {
                          return DropdownMenuItem<
                              String>(
                            value: value,
                            child: Text(value),
                          );
                        },
                      ).toList(),
                      onChanged: (String? value) {
                        if (value != null) {
                          setState(() {
                            type = value;
                          });
                        }
                      },
                    ),
                    const SizedBox(height: 12),
                    field(
                      barcode,
                      text.rawBarcode,
                      maxLines: 3,
                    ),
                    field(gtin, text.gtin),
                    field(lot, text.lot),
                    field(serial, text.serial),
                    field(catalog, text.catalog),
                    field(
                      department,
                      text.department,
                    ),
                    field(device, text.device),
                    field(storage, text.storage),
                    field(
                      manufacturer,
                      text.manufacturer,
                    ),
                    field(
                      originalQty,
                      text.originalQty,
                      keyboardType:
                          const TextInputType
                              .numberWithOptions(
                        decimal: true,
                      ),
                    ),
                    field(unit, text.unit),
                    field(
                      minStock,
                      text.minStock,
                      keyboardType:
                          const TextInputType
                              .numberWithOptions(
                        decimal: true,
                      ),
                    ),
                    field(
                      receiptDate,
                      '${text.receiptDate} YYYY-MM-DD',
                    ),
                    field(
                      expiryDate,
                      '${text.expiryDate} YYYY-MM-DD',
                    ),
                    field(
                      openedDate,
                      '${text.openDate} YYYY-MM-DD',
                    ),
                    field(
                      afterOpenDate,
                      '${text.afterOpenExpiry} YYYY-MM-DD',
                    ),
                    SwitchListTile(
                      value: approved,
                      title: Text(text.approved),
                      onChanged: (bool value) {
                        setState(() {
                          approved = value;
                        });
                      },
                    ),
                    SwitchListTile(
                      value: blocked,
                      title: Text(text.blocked),
                      onChanged: (bool value) {
                        setState(() {
                          blocked = value;
                        });
                      },
                    ),
                    field(
                      notes,
                      text.notes,
                      maxLines: 4,
                    ),
                    field(
                      reason,
                      text.reason,
                      maxLines: 2,
                    ),
                    FilledButton.icon(
                      onPressed:
                          saving ? null : save,
                      icon: const Icon(Icons.save),
                      label: Padding(
                        padding:
                            const EdgeInsets.symmetric(
                          vertical: 14,
                        ),
                        child: saving
                            ? const CircularProgressIndicator()
                            : Text(text.save),
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class MaterialDetailsScreen
              extends StatefulWidget {
            const MaterialDetailsScreen({
              super.key,
              required this.controller,
              required this.materialId,
            });

            final AppController controller;
            final int materialId;

            @override
            State<MaterialDetailsScreen> createState() {
              return _MaterialDetailsScreenState();
            }
          }

          class _MaterialDetailsScreenState
              extends State<MaterialDetailsScreen> {
            MaterialRecord? material;
            List<UsageRecord> usages =
                <UsageRecord>[];

            bool loading = true;

            Future<void> load() async {
              material =
                  await widget.controller.db
                      .materialById(
                widget.materialId,
              );

              usages =
                  await widget.controller.db
                      .usageRecords(
                widget.materialId,
              );

              if (mounted) {
                setState(() {
                  loading = false;
                });
              }
            }

            @override
            void initState() {
              super.initState();
              load();
            }

            Future<String?> askReason(
              String title,
            ) async {
              final TextEditingController input =
                  TextEditingController();

              final String? result =
                  await showDialog<String>(
                context: context,
                builder:
                    (BuildContext dialogContext) {
                  final AppLocalizations text =
                      AppLocalizations.of(
                    dialogContext,
                  );

                  return AlertDialog(
                    title: Text(title),
                    content: TextField(
                      controller: input,
                      autofocus: true,
                      maxLines: 3,
                      decoration: InputDecoration(
                        labelText: text.reason,
                      ),
                    ),
                    actions: <Widget>[
                      TextButton(
                        onPressed: () {
                          Navigator.of(
                            dialogContext,
                          ).pop();
                        },
                        child:
                            Text(text.cancel),
                      ),
                      FilledButton(
                        onPressed: () {
                          if (input.text
                              .trim()
                              .isNotEmpty) {
                            Navigator.of(
                              dialogContext,
                            ).pop(
                              input.text.trim(),
                            );
                          }
                        },
                        child:
                            Text(text.confirm),
                      ),
                    ],
                  );
                },
              );

              input.dispose();
              return result;
            }

            Future<void> recordUsage() async {
              final AppLocalizations text =
                  AppLocalizations.of(context);

              final TextEditingController quantity =
                  TextEditingController();

              final TextEditingController note =
                  TextEditingController();

              final bool? confirmed =
                  await showDialog<bool>(
                context: context,
                builder:
                    (BuildContext dialogContext) {
                  return AlertDialog(
                    title:
                        Text(text.recordUsage),
                    content: Column(
                      mainAxisSize:
                          MainAxisSize.min,
                      children: <Widget>[
                        Text(
                          '${text.remainingQty}: '
                          '${material!.remainingQuantity.toStringAsFixed(2)} '
                          '${material!.unit}',
                        ),
                        const SizedBox(height: 12),
                        TextField(
                          controller: quantity,
                          autofocus: true,
                          keyboardType:
                              const TextInputType
                                  .numberWithOptions(
                            decimal: true,
                          ),
                          decoration:
                              InputDecoration(
                            labelText:
                                text.quantity,
                          ),
                        ),
                        const SizedBox(height: 12),
                        TextField(
                          controller: note,
                          maxLines: 2,
                          decoration:
                              InputDecoration(
                            labelText:
                                text.usageReason,
                          ),
                        ),
                      ],
                    ),
                    actions: <Widget>[
                      TextButton(
                        onPressed: () {
                          Navigator.of(
                            dialogContext,
                          ).pop(false);
                        },
                        child:
                            Text(text.cancel),
                      ),
                      FilledButton(
                        onPressed: () {
                          Navigator.of(
                            dialogContext,
                          ).pop(true);
                        },
                        child:
                            Text(text.confirm),
                      ),
                    ],
                  );
                },
              );

              if (confirmed == true) {
                try {
                  await widget.controller.db
                      .recordUsage(
                    actor: widget
                        .controller.currentUser!,
                    materialId:
                        widget.materialId,
                    quantity: numberValue(
                      normalizedDigits(
                        quantity.text,
                      ),
                    ),
                    note: note.text.trim(),
                  );

                  widget.controller.refresh();
                  await load();
                } catch (error) {
                  if (mounted) {
                    ScaffoldMessenger.of(context)
                        .showSnackBar(
                      SnackBar(
                        content: Text(
                          text.invalidQuantity,
                        ),
                      ),
                    );
                  }
                }
              }

              quantity.dispose();
              note.dispose();
            }

            Future<void> editUsage(
              UsageRecord usage,
            ) async {
              final AppLocalizations text =
                  AppLocalizations.of(context);

              final TextEditingController quantity =
                  TextEditingController(
                text: usage.usedQuantity.toString(),
              );

              final TextEditingController reason =
                  TextEditingController();

              final bool? confirmed =
                  await showDialog<bool>(
                context: context,
                builder:
                    (BuildContext dialogContext) {
                  return AlertDialog(
                    title:
                        Text(text.editUsage),
                    content: Column(
                      mainAxisSize:
                          MainAxisSize.min,
                      children: <Widget>[
                        TextField(
                          controller: quantity,
                          keyboardType:
                              const TextInputType
                                  .numberWithOptions(
                            decimal: true,
                          ),
                          decoration:
                              InputDecoration(
                            labelText:
                                text.usedQty,
                          ),
                        ),
                        const SizedBox(height: 12),
                        TextField(
                          controller: reason,
                          maxLines: 3,
                          decoration:
                              InputDecoration(
                            labelText:
                                text.reason,
                          ),
                        ),
                      ],
                    ),
                    actions: <Widget>[
                      TextButton(
                        onPressed: () {
                          Navigator.of(
                            dialogContext,
                          ).pop(false);
                        },
                        child:
                            Text(text.cancel),
                      ),
                      FilledButton(
                        onPressed: () {
                          Navigator.of(
                            dialogContext,
                          ).pop(true);
                        },
                        child:
                            Text(text.confirm),
                      ),
                    ],
                  );
                },
              );

              if (confirmed == true) {
                try {
                  await widget.controller.db
                      .editUsage(
                    actor: widget
                        .controller.currentUser!,
                    usageId: usage.id,
                    newQuantity: numberValue(
                      normalizedDigits(
                        quantity.text,
                      ),
                    ),
                    reason: reason.text.trim(),
                  );

                  widget.controller.refresh();
                  await load();
                } catch (error) {
                  if (mounted) {
                    ScaffoldMessenger.of(context)
                        .showSnackBar(
                      SnackBar(
                        content: Text(
                          error.toString().contains(
                                  'ADMIN_ONLY')
                              ? text.adminOnly
                              : text.invalidQuantity,
                        ),
                      ),
                    );
                  }
                }
              }

              quantity.dispose();
              reason.dispose();
            }

            Widget row(
              String label,
              String value,
            ) {
              return Padding(
                padding:
                    const EdgeInsets.symmetric(
                  vertical: 5,
                ),
                child: Row(
                  crossAxisAlignment:
                      CrossAxisAlignment.start,
                  children: <Widget>[
                    SizedBox(
                      width: 145,
                      child: Text(
                        label,
                        style: const TextStyle(
                          fontWeight:
                              FontWeight.bold,
                        ),
                      ),
                    ),
                    Expanded(
                      child: SelectableText(
                        value.isEmpty ? '-' : value,
                      ),
                    ),
                  ],
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              final AppLocalizations text =
                  AppLocalizations.of(context);

              if (loading || material == null) {
                return const Scaffold(
                  body: Center(
                    child:
                        CircularProgressIndicator(),
                  ),
                );
              }

              final MaterialRecord item =
                  material!;

              final UserRecord actor =
                  widget.controller.currentUser!;

              return Scaffold(
                appBar: AppBar(
                  title: Text(text.details),
                  actions: <Widget>[
                    if (actor.isSuperAdmin)
                      IconButton(
                        tooltip:
                            text.editMaterial,
                        onPressed: () async {
                          await Navigator.of(context)
                              .push<int>(
                            MaterialPageRoute<int>(
