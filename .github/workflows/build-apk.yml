class InventoryScreen extends StatefulWidget {
  const InventoryScreen({super.key});

  @override
  State<InventoryScreen> createState() {
    return _InventoryScreenState();
  }
}

class _InventoryScreenState extends State<InventoryScreen> {
  Future<void> useMaterial(LabMaterial item) async {
    final user = AppStore.currentUser!;
    final status = item.status;

    if (!user.canUseMaterials) {
      ScaffoldMessenger.of(context).showSnackBar(
        const SnackBar(
          content: Text('ليس لديك صلاحية تسجيل الاستخدام'),
        ),
      );
      return;
    }

    if (status == MaterialStatus.expired ||
        status == MaterialStatus.unapproved ||
        status == MaterialStatus.empty) {
      ScaffoldMessenger.of(context).showSnackBar(
        SnackBar(
          backgroundColor: statusColor(status),
          content: Text(
            status == MaterialStatus.expired
                ? 'لا يمكن الاستخدام: المادة منتهية'
                : status == MaterialStatus.unapproved
                    ? 'لا يمكن الاستخدام: المادة غير معتمدة'
                    : 'لا يمكن الاستخدام: نفدت الكمية',
          ),
        ),
      );
      return;
    }

    final controller = TextEditingController(text: '1');

    final used = await showDialog<double>(
      context: context,
      builder: (dialogContext) {
        return AlertDialog(
          title: Text('تسجيل استخدام ${item.name}'),
          content: TextField(
            controller: controller,
            keyboardType: const TextInputType.numberWithOptions(
              decimal: true,
            ),
            decoration: InputDecoration(
              labelText: 'الكمية المستخدمة - المتبقي ${item.remaining}',
            ),
          ),
          actions: [
            TextButton(
              onPressed: () {
                Navigator.of(dialogContext).pop();
              },
              child: const Text('إلغاء'),
            ),
            FilledButton(
              onPressed: () {
                Navigator.of(dialogContext).pop(
                  double.tryParse(controller.text),
                );
              },
              child: const Text('حفظ'),
            ),
          ],
        );
      },
    );

    controller.dispose();

    if (used == null || used <= 0 || used > item.remaining) {
      return;
    }

    setState(() {
      item.used += used;
      item.openedAt ??= DateTime.now();

      AppStore.usage.insert(
        0,
        UsageRecord(
          materialName: item.name,
          employee: user.name,
          device: item.device,
          quantity: used,
          dateTime: DateTime.now(),
        ),
      );
    });
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        title: const Text('المخزون'),
      ),
      body: AppStore.materials.isEmpty
          ? const Center(
              child: Text('لا توجد مواد مسجلة'),
            )
          : ListView.separated(
              padding: const EdgeInsets.all(12),
              itemCount: AppStore.materials.length,
              separatorBuilder: (_, __) {
                return const SizedBox(height: 8);
              },
              itemBuilder: (_, index) {
                final item = AppStore.materials[index];
                final status = item.status;

                return Card(
                  child: ListTile(
                    leading: CircleAvatar(
                      backgroundColor: statusColor(status),
                      child: const Icon(
                        Icons.science,
                        color: Colors.white,
                      ),
                    ),
                    title: Text(item.name),
                    subtitle: Text(
                      '${item.type} • ${item.device}\n'
                      'LOT: ${item.lot}\n'
                      'الانتهاء: ${formatDate(item.expiry)}\n'
                      'المتبقي: ${item.remaining}',
                    ),
                    trailing: Text(
                      statusText(status),
                      style: TextStyle(
                        color: statusColor(status),
                        fontWeight: FontWeight.bold,
                      ),
                    ),
                    onTap: () {
                      useMaterial(item);
                    },
                  ),
                );
              },
            ),
    );
  }
}

class ReportsScreen extends StatelessWidget {
  const ReportsScreen({super.key});

  List<UsageRecord> recordsFor(Duration duration) {
    final start = DateTime.now().subtract(duration);

    return AppStore.usage
        .where(
          (record) => record.dateTime.isAfter(start),
        )
        .toList();
  }

  Widget reportCard(
    BuildContext context,
    String title,
    Duration duration,
  ) {
    final records = recordsFor(duration);

    final total = records.fold<double>(
      0.0,
      (sum, record) => sum + record.quantity,
    );

    return Card(
      child: Padding(
        padding: const EdgeInsets.all(16),
        child: Column(
          crossAxisAlignment: CrossAxisAlignment.start,
          children: [
            Text(title, style: Theme.of(context).textTheme.titleLarge),
            const SizedBox(height: 8),
            Text('عدد عمليات الاستخدام: ${records.length}'),
            Text('إجمالي الكمية المستخدمة: $total'),
          ],
        ),
      ),
    );
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        title: const Text('التقارير'),
      ),
      body: ListView(
        padding: const EdgeInsets.all(16),
        children: [
          reportCard(
            context,
            'التقرير اليومي',
            const Duration(days: 1),
          ),
          const SizedBox(height: 10),
          reportCard(
            context,
            'التقرير الأسبوعي',
            const Duration(days: 7),
          ),
          const SizedBox(height: 10),
          reportCard(
            context,
            'التقرير الشهري',
            const Duration(days: 30),
          ),
          const SizedBox(height: 18),
          Text(
            'آخر عمليات الاستخدام',
            style: Theme.of(context).textTheme.titleLarge,
          ),
          const SizedBox(height: 8),
          if (AppStore.usage.isEmpty)
            const Card(
              child: Padding(
                padding: EdgeInsets.all(16),
                child: Text('لا توجد عمليات استخدام'),
              ),
            ),
          ...AppStore.usage.take(20).map(
            (record) {
              return Padding(
                padding: const EdgeInsets.only(bottom: 8),
                child: Card(
                  child: ListTile(
                    title: Text(record.materialName),
                    subtitle: Text(
                      '${record.employee} • ${record.device}\n'
                      '${formatDateTime(record.dateTime)}',
                    ),
                    trailing: Text(record.quantity.toString()),
                  ),
                ),
              );
            },
          ),
        ],
      ),
    );
  }
}

class AdminScreen extends StatefulWidget {
  const AdminScreen({super.key});

  @override
  State<AdminScreen> createState() {
    return _AdminScreenState();
  }
}

class _AdminScreenState extends State<AdminScreen> {
  Future<void> addUser() async {
    final name = TextEditingController();
    final username = TextEditingController();
    final password = TextEditingController(text: '1234');

    bool admin = false;

    final save = await showDialog<bool>(
      context: context,
      builder: (dialogContext) {
        return StatefulBuilder(
          builder: (context, updateDialog) {
            return AlertDialog(
              title: const Text('إضافة مستخدم'),
              content: SingleChildScrollView(
                child: Column(
                  mainAxisSize: MainAxisSize.min,
                  children: [
                    TextField(
                      controller: name,
                      decoration: const InputDecoration(
                        labelText: 'الاسم',
                      ),
                    ),
                    const SizedBox(height: 8),
                    TextField(
                      controller: username,
                      decoration: const InputDecoration(
                        labelText: 'اسم المستخدم',
                      ),
                    ),
                    const SizedBox(height: 8),
                    TextField(
                      controller: password,
                      decoration: const InputDecoration(
                        labelText: 'كلمة المرور',
                      ),
                    ),
                    SwitchListTile(
                      title: const Text('مستخدم رئيسي'),
                      value: admin,
                      onChanged: (value) {
                        updateDialog(() {
                          admin = value;
                        });
                      },
                    ),
                  ],
                ),
              ),
              actions: [
                TextButton(
                  onPressed: () {
                    Navigator.of(dialogContext).pop(false);
                  },
                  child: const Text('إلغاء'),
                ),
                FilledButton(
                  onPressed: () {
                    Navigator.of(dialogContext).pop(true);
                  },
                  child: const Text('إضافة'),
                ),
              ],
            );
          },
        );
      },
    );

    if (save == true) {
      final userNameValue = username.text.trim();

      final exists = AppStore.users.any(
        (user) => user.username == userNameValue,
      );

      if (name.text.trim().isEmpty ||
          userNameValue.isEmpty ||
          password.text.isEmpty) {
        if (mounted) {
          ScaffoldMessenger.of(context).showSnackBar(
            const SnackBar(
              content: Text('أكمل جميع البيانات'),
            ),
          );
        }
      } else if (exists) {
        if (mounted) {
          ScaffoldMessenger.of(context).showSnackBar(
            const SnackBar(
              content: Text('اسم المستخدم موجود مسبقًا'),
            ),
          );
        }
      } else {
        setState(() {
          AppStore.users.add(
            AppUser(
              name: name.text.trim(),
              username: userNameValue,
              password: password.text,
              isAdmin: admin,
            ),
          );
        });
      }
    }

    name.dispose();
    username.dispose();
    password.dispose();
  }

  Future<void> editSettings() async {
    final scan = TextEditingController(text: AppStore.scanButtonName);
    final inventory = TextEditingController(text: AppStore.inventoryButtonName);
    final reports = TextEditingController(text: AppStore.reportsButtonName);
    final days = TextEditingController(
      text: AppStore.nearExpiryDays.toString(),
    );

    final save = await showDialog<bool>(
      context: context,
      builder: (dialogContext) {
        return AlertDialog(
          title: const Text('إعدادات الواجهة'),
          content: SingleChildScrollView(
            child: Column(
              mainAxisSize: MainAxisSize.min,
              children: [
                TextField(
                  controller: scan,
                  decoration: const InputDecoration(
                    labelText: 'اسم زر المسح',
                  ),
                ),
                const SizedBox(height: 8),
                TextField(
                  controller: inventory,
                  decoration: const InputDecoration(
                    labelText: 'اسم زر المخزون',
                  ),
                ),
                const SizedBox(height: 8),
                TextField(
                  controller: reports,
                  decoration: const InputDecoration(
                    labelText: 'اسم زر التقارير',
                  ),
                ),
                const SizedBox(height: 8),
                TextField(
                  controller: days,
                  keyboardType: TextInputType.number,
                  decoration: const InputDecoration(
                    labelText: 'أيام قرب الانتهاء',
                  ),
                ),
              ],
            ),
          ),
          actions: [
            TextButton(
              onPressed: () {
                Navigator.of(dialogContext).pop(false);
              },
              child: const Text('إلغاء'),
            ),
            FilledButton(
              onPressed: () {
                Navigator.of(dialogContext).pop(true);
              },
              child: const Text('حفظ'),
            ),
          ],
        );
      },
    );

    if (save == true) {
      setState(() {
        if (scan.text.trim().isNotEmpty) {
          AppStore.scanButtonName = scan.text.trim();
        }

        if (inventory.text.trim().isNotEmpty) {
          AppStore.inventoryButtonName = inventory.text.trim();
        }

        if (reports.text.trim().isNotEmpty) {
          AppStore.reportsButtonName = reports.text.trim();
        }

        final parsedDays = int.tryParse(days.text) ?? 30;
        AppStore.nearExpiryDays = parsedDays < 1 ? 1 : parsedDays;
      });
    }

    scan.dispose();
    inventory.dispose();
    reports.dispose();
    days.dispose();
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        title: const Text('لوحة المستخدم الرئيسي'),
        actions: [
          IconButton(
            onPressed: editSettings,
            icon: const Icon(Icons.tune),
          ),
        ],
      ),
      floatingActionButton: FloatingActionButton.extended(
        onPressed: addUser,
        icon: const Icon(Icons.person_add_alt_1),
        label: const Text('إضافة مستخدم'),
      ),
      body: ListView.separated(
        padding: const EdgeInsets.all(12),
        itemCount: AppStore.users.length,
        separatorBuilder: (_, __) {
          return const SizedBox(height: 8);
        },
        itemBuilder: (_, index) {
          final user = AppStore.users[index];
          final current = user == AppStore.currentUser;

          return Card(
            child: ExpansionTile(
              leading: Icon(
                user.isAdmin
                    ? Icons.admin_panel_settings
                    : Icons.person_outline,
              ),
              title: Text(user.name),
              subtitle: Text(
                '${user.username} • '
                '${user.isAdmin ? 'رئيسي' : 'عادي'}'
                '${current ? ' • الحساب الحالي' : ''}',
              ),
              trailing: Switch(
                value: user.isActive,
                onChanged: current
                    ? null
                    : (value) {
                        setState(() {
                          user.isActive = value;
                        });
                      },
              ),
              children: [
                SwitchListTile(
                  title: const Text('السماح بمسح الباركود'),
                  value: user.canScan,
                  onChanged: (value) {
                    setState(() {
                      user.canScan = value;
                    });
                  },
                ),
                SwitchListTile(
                  title: const Text('السماح بتسجيل الاستخدام'),
                  value: user.canUseMaterials,
                  onChanged: (value) {
                    setState(() {
                      user.canUseMaterials = value;
                    });
                  },
                ),
                SwitchListTile(
                  title: const Text('عرض التقارير'),
                  value: user.canViewReports,
                  onChanged: (value) {
                    setState(() {
                      user.canViewReports = value;
                    });
                  },
                ),
              ],
            ),
          );
        },
      ),
    );
  }
}
