          class _ScannerScreenState
              extends State<ScannerScreen>
              with WidgetsBindingObserver {
            late final MobileScannerController scanner;

            bool locked = false;
            bool showManualHint = false;
            String lastValue = '';
            Timer? manualTimer;

            @override
            void initState() {
              super.initState();

              scanner = MobileScannerController(
                autoStart: false,
                cameraResolution:
                    const Size(1280, 720),
                detectionSpeed:
                    DetectionSpeed.normal,
                detectionTimeoutMs: 250,
                facing: CameraFacing.back,
                formats: const <BarcodeFormat>[
                  BarcodeFormat.dataMatrix,
                  BarcodeFormat.qrCode,
                  BarcodeFormat.code128,
                  BarcodeFormat.code39,
                  BarcodeFormat.code93,
                  BarcodeFormat.ean8,
                  BarcodeFormat.ean13,
                  BarcodeFormat.upcA,
                  BarcodeFormat.upcE,
                  BarcodeFormat.itf,
                  BarcodeFormat.pdf417,
                  BarcodeFormat.aztec,
                  BarcodeFormat.codabar,
                ],
                returnImage: false,
                autoZoom: true,
              );

              WidgetsBinding.instance
                  .addObserver(this);

              unawaited(scanner.start());

              manualTimer = Timer(
                const Duration(seconds: 8),
                () {
                  if (mounted && !locked) {
                    setState(() {
                      showManualHint = true;
                    });
                  }
                },
              );
            }

            @override
            void didChangeAppLifecycleState(
              AppLifecycleState state,
            ) {
              if (!scanner.value.hasCameraPermission) {
                return;
              }

              if (state == AppLifecycleState.resumed) {
                unawaited(scanner.start());
                return;
              }

              if (state ==
                      AppLifecycleState.inactive ||
                  state ==
                      AppLifecycleState.paused ||
                  state ==
                      AppLifecycleState.hidden) {
                unawaited(scanner.stop());
              }
            }

            Future<void> processCapture(
              BarcodeCapture capture,
            ) async {
              if (locked) {
                return;
              }

              Barcode? selected;

              for (final Barcode barcode
                  in capture.barcodes) {
                final String value =
                    barcode.rawValue?.trim() ?? '';

                if (value.isNotEmpty) {
                  selected = barcode;
                  break;
                }
              }

              if (selected == null) {
                return;
              }

              final String value =
                  selected.rawValue!.trim();

              setState(() {
                lastValue = value;
              });

              locked = true;
              manualTimer?.cancel();

              await HapticFeedback.lightImpact();
              await SystemSound.play(
                SystemSoundType.click,
              );

              if (!mounted) {
                return;
              }

              ScaffoldMessenger.of(context)
                  .showSnackBar(
                SnackBar(
                  content: Text(
                    AppLocalizations.of(context)
                        .scanSuccess,
                  ),
                  duration: const Duration(
                    milliseconds: 700,
                  ),
                ),
              );

              await Future<void>.delayed(
                const Duration(
                  milliseconds: 450,
                ),
              );

              if (!mounted) {
                return;
              }

              Navigator.of(context).pop(
                ScannedCode(
                  rawValue: value,
                  format: selected.format.name,
                ),
              );
            }

            Future<void> manualEntry() async {
              final TextEditingController input =
                  TextEditingController();

              final String? result =
                  await showDialog<String>(
                context: context,
                builder:
                    (BuildContext dialogContext) {
                  final AppLocalizations text =
                      AppLocalizations.of(
                    dialogContext,
                  );

                  return AlertDialog(
                    title:
                        Text(text.manualEntry),
                    content: TextField(
                      controller: input,
                      minLines: 2,
                      maxLines: 6,
                      autofocus: true,
                      decoration: InputDecoration(
                        labelText: text.barcode,
                      ),
                    ),
                    actions: <Widget>[
                      TextButton(
                        onPressed: () {
                          Navigator.of(
                            dialogContext,
                          ).pop();
                        },
                        child:
                            Text(text.cancel),
                      ),
                      FilledButton(
                        onPressed: () {
                          final String value =
                              input.text.trim();

                          if (value.isNotEmpty) {
                            Navigator.of(
                              dialogContext,
                            ).pop(value);
                          }
                        },
                        child:
                            Text(text.confirm),
                      ),
                    ],
                  );
                },
              );

              input.dispose();

              if (result != null &&
                  result.isNotEmpty &&
                  mounted) {
                Navigator.of(context).pop(
                  ScannedCode(
                    rawValue: result,
                    format: 'manual',
                  ),
                );
              }
            }

            Future<void> analyzeGallery() async {
              final XFile? image =
                  await ImagePicker().pickImage(
                source: ImageSource.gallery,
              );

              if (image == null) {
                return;
              }

              final BarcodeCapture? capture =
                  await scanner.analyzeImage(
                image.path,
              );

              if (capture == null ||
                  capture.barcodes.isEmpty) {
                if (mounted) {
                  ScaffoldMessenger.of(context)
                      .showSnackBar(
                    SnackBar(
                      content: Text(
                        AppLocalizations.of(context)
                            .scanFailedManual,
                      ),
                    ),
                  );
                }

                return;
              }

              await processCapture(capture);
            }

            Future<void> restart() async {
              locked = false;

              setState(() {
                lastValue = '';
                showManualHint = false;
              });

              await scanner.stop();
              await scanner.start();

              manualTimer?.cancel();

              manualTimer = Timer(
                const Duration(seconds: 8),
                () {
                  if (mounted && !locked) {
                    setState(() {
                      showManualHint = true;
                    });
                  }
                },
              );
            }

            @override
            void dispose() {
              WidgetsBinding.instance
                  .removeObserver(this);

              manualTimer?.cancel();
              unawaited(scanner.dispose());

              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              final AppLocalizations text =
                  AppLocalizations.of(context);

              return Scaffold(
                backgroundColor: Colors.black,
                appBar: AppBar(
                  title: Text(text.scanMaterial),
                  actions: <Widget>[
                    IconButton(
                      tooltip: text.gallery,
                      onPressed: analyzeGallery,
                      icon: const Icon(
                        Icons.photo_library,
                      ),
                    ),
                    IconButton(
                      tooltip: text.manualEntry,
                      onPressed: manualEntry,
                      icon: const Icon(
                        Icons.keyboard,
                      ),
                    ),
                  ],
                ),
                body: Stack(
                  fit: StackFit.expand,
                  children: <Widget>[
                    MobileScanner(
                      controller: scanner,
                      onDetect: processCapture,
                    ),
                    IgnorePointer(
                      child: Center(
                        child: Container(
                          width: min(
                            MediaQuery.sizeOf(context)
                                    .width *
                                0.82,
                            480,
                          ),
                          height: 230,
                          decoration: BoxDecoration(
                            border: Border.all(
                              color: Colors.greenAccent,
                              width: 3,
                            ),
                            borderRadius:
                                BorderRadius.circular(18),
                          ),
                        ),
                      ),
                    ),
                    Positioned(
                      left: 16,
                      right: 16,
                      bottom: 20,
                      child: Card(
                        color: Colors.black87,
                        child: Padding(
                          padding:
                              const EdgeInsets.all(12),
                          child: Column(
                            mainAxisSize:
                                MainAxisSize.min,
                            children: <Widget>[
                              Text(
                                text.scanHint,
                                textAlign:
                                    TextAlign.center,
                                style:
                                    const TextStyle(
                                  color: Colors.white,
                                  fontWeight:
                                      FontWeight.bold,
                                ),
                              ),
                              if (showManualHint) ...<
                                  Widget>[
                                const SizedBox(height: 6),
                                TextButton(
                                  onPressed:
                                      manualEntry,
                                  child: Text(
                                    text.scanFailedManual,
                                  ),
                                ),
                              ],
                              if (lastValue.isNotEmpty) ...<
                                  Widget>[
                                Text(
                                  '${text.lastRead}: '
                                  '$lastValue',
                                  maxLines: 2,
                                  overflow:
                                      TextOverflow.ellipsis,
                                  style:
                                      const TextStyle(
                                    color: Colors.white70,
                                  ),
                                ),
                              ],
                              const SizedBox(height: 8),
                              Row(
                                mainAxisAlignment:
                                    MainAxisAlignment
                                        .spaceEvenly,
                                children: <Widget>[
                                  IconButton.filledTonal(
                                    tooltip: text.flash,
                                    onPressed: () {
                                      scanner
                                          .toggleTorch();
                                    },
                                    icon: const Icon(
                                      Icons.flash_on,
                                    ),
                                  ),
                                  IconButton.filledTonal(
                                    tooltip: text.retry,
                                    onPressed: restart,
                                    icon: const Icon(
                                      Icons.refresh,
                                    ),
                                  ),
                                  IconButton.filledTonal(
                                    tooltip:
                                        text.manualEntry,
                                    onPressed:
                                        manualEntry,
                                    icon: const Icon(
                                      Icons.keyboard,
                                    ),
                                  ),
                                ],
                              ),
                            ],
                          ),
                        ),
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class InventoryScreen extends StatefulWidget {
            const InventoryScreen({
              super.key,
              required this.controller,
              required this.initialFilter,
            });

            final AppController controller;
            final MaterialFilter initialFilter;

            @override
            State<InventoryScreen> createState() {
              return _InventoryScreenState();
            }
          }

          class _InventoryScreenState
              extends State<InventoryScreen> {
            late MaterialFilter filter;
            final TextEditingController search =
                TextEditingController();

            List<MaterialRecord> materials =
                <MaterialRecord>[];

            bool loading = true;

            @override
            void initState() {
              super.initState();
              filter = widget.initialFilter;
              load();
            }

            Future<void> load() async {
              setState(() {
                loading = true;
              });

              materials =
                  await widget.controller.db.materials();

              if (mounted) {
                setState(() {
                  loading = false;
                });
              }
            }

            List<MaterialRecord> filtered() {
              final String query =
                  search.text.trim().toLowerCase();

              Iterable<MaterialRecord> result =
                  materials;

              switch (filter) {
                case MaterialFilter.all:
                  result = result.where(
                    (MaterialRecord item) =>
                        !item.isArchived,
                  );
                case MaterialFilter.available:
                  result = result.where(
                    (MaterialRecord item) =>
                        item.isAvailable,
                  );
                case MaterialFilter.expiredOrEmpty:
                  result = result.where(
                    (MaterialRecord item) =>
                        item.isExpiredOrEmpty,
                  );
                case MaterialFilter.unused:
                  result = result.where(
                    (MaterialRecord item) =>
                        item.isUnused,
                  );
                case MaterialFilter.archived:
                  result = result.where(
                    (MaterialRecord item) =>
                        item.isArchived,
                  );
              }

              if (query.isNotEmpty) {
                result = result.where(
                  (MaterialRecord item) {
                    return item.name
                            .toLowerCase()
                            .contains(query) ||
                        item.rawBarcode
                            .toLowerCase()
                            .contains(query) ||
                        item.serialNumber
                            .toLowerCase()
                            .contains(query) ||
                        item.lotNumber
                            .toLowerCase()
                            .contains(query) ||
                        item.gtin
                            .toLowerCase()
                            .contains(query);
                  },
                );
              }

              return result.toList();
            }

            String title(
              AppLocalizations text,
            ) {
              switch (filter) {
                case MaterialFilter.all:
                  return text.allMaterials;
                case MaterialFilter.available:
                  return text.availableMaterials;
                case MaterialFilter.expiredOrEmpty:
                  return text.expiredMaterials;
                case MaterialFilter.unused:
                  return text.unusedMaterials;
                case MaterialFilter.archived:
                  return text.archivedMaterials;
              }
            }

            Future<void> addMaterial() async {
              final int? id =
                  await Navigator.of(context).push<int>(
                MaterialPageRoute<int>(
                  builder: (BuildContext context) {
                    return MaterialFormScreen(
                      controller: widget.controller,
                    );
                  },
                ),
              );

              if (id != null) {
                await load();
                widget.controller.refresh();
              }
            }

            Future<void> exportExcel(
              List<MaterialRecord> items,
            ) async {
              final AppLocalizations text =
                  AppLocalizations.of(context);

              if (items.isEmpty) {
                ScaffoldMessenger.of(context)
                    .showSnackBar(
                  SnackBar(
                    content:
                        Text(text.noMaterials),
                  ),
                );

                return;
              }

              final xls.Excel excel =
                  xls.Excel.createExcel();

              final String sheetName =
                  widget.controller.locale
                              .languageCode ==
                          'ar'
                      ? 'المواد'
                      : 'Materials';

              final xls.Sheet sheet =
                  excel[sheetName];

              sheet.isRTL =
                  widget.controller.locale
                          .languageCode ==
                      'ar';

              sheet.appendRow(
                <xls.CellValue>[
                  xls.TextCellValue(text.internalNo),
                  xls.TextCellValue(text.name),
                  xls.TextCellValue(text.type),
                  xls.TextCellValue(text.barcode),
                  xls.TextCellValue(text.gtin),
                  xls.TextCellValue(text.lot),
                  xls.TextCellValue(text.serial),
                  xls.TextCellValue(text.department),
                  xls.TextCellValue(text.device),
                  xls.TextCellValue(text.originalQty),
                  xls.TextCellValue(text.usedQty),
                  xls.TextCellValue(text.remainingQty),
                  xls.TextCellValue(text.unit),
                  xls.TextCellValue(text.expiryDate),
                  xls.TextCellValue(text.status),
                ],
              );

              for (final MaterialRecord item
                  in items) {
                sheet.appendRow(
                  <xls.CellValue>[
                    xls.TextCellValue(
                      item.internalNo,
                    ),
                    xls.TextCellValue(item.name),
                    xls.TextCellValue(item.type),
                    xls.TextCellValue(
                      item.rawBarcode,
                    ),
                    xls.TextCellValue(item.gtin),
                    xls.TextCellValue(
                      item.lotNumber,
                    ),
                    xls.TextCellValue(
                      item.serialNumber,
                    ),
                    xls.TextCellValue(
                      item.department,
                    ),
                    xls.TextCellValue(
                      item.deviceName,
                    ),
                    xls.DoubleCellValue(
                      item.originalQuantity,
                    ),
                    xls.DoubleCellValue(
                      item.usedQuantity,
                    ),
                    xls.DoubleCellValue(
                      item.remainingQuantity,
                    ),
                    xls.TextCellValue(item.unit),
                    xls.TextCellValue(
                      formatDate(
                        item.effectiveExpiry,
                      ),
                    ),
                    xls.TextCellValue(
                      item.status,
                    ),
                  ],
                );
              }

              excel.delete('Sheet1');

              final List<int>? bytes =
                  excel.save();

              if (bytes == null) {
                return;
              }

              final Directory directory =
                  await getTemporaryDirectory();

              final File file = File(
                path_util.join(
                  directory.path,
                  'SmartChem_Materials_'
                  '${DateTime.now().millisecondsSinceEpoch}'
                  '.xlsx',
                ),
              );

              await file.writeAsBytes(bytes);

              await widget.controller.db.audit(
                actor: widget
                    .controller.currentUser!,
                entityType: 'report',
                entityId: null,
                action: 'EXPORT_EXCEL',
                newValue:
                    'records=${items.length}',
                reason: title(text),
              );

              await Share.shareXFiles(
                <XFile>[
                  XFile(file.path),
                ],
                text: text.exportExcel,
              );
            }

            Future<void> exportPdf(
              List<MaterialRecord> items,
            ) async {
              final AppLocalizations text =
                  AppLocalizations.of(context);

              if (items.isEmpty) {
                ScaffoldMessenger.of(context)
                    .showSnackBar(
                  SnackBar(
                    content:
                        Text(text.noMaterials),
                  ),
                );

                return;
              }

              final pw.Font font =
                  await PdfGoogleFonts
                      .notoNaskhArabicRegular();

              final pw.Font bold =
                  await PdfGoogleFonts
                      .notoNaskhArabicBold();

              final bool arabic =
                  widget.controller.locale
                          .languageCode ==
                      'ar';

              final pw.Document document =
                  pw.Document(
                theme: pw.ThemeData.withFont(
                  base: font,
                  bold: bold,
                ),
              );

              final List<String> headers =
                  <String>[
                text.internalNo,
                text.name,
                text.type,
                text.lot,
                text.department,
                text.originalQty,
                text.usedQty,
                text.remainingQty,
                text.expiryDate,
              ];

              final List<List<String>> data =
                  items.map(
                (MaterialRecord item) {
                  return <String>[
                    item.internalNo,
                    item.name,
                    item.type,
                    item.lotNumber,
                    item.department,
                    item.originalQuantity
                        .toStringAsFixed(2),
                    item.usedQuantity
                        .toStringAsFixed(2),
                    item.remainingQuantity
                        .toStringAsFixed(2),
                    formatDate(
                      item.effectiveExpiry,
                    ),
                  ];
                },
              ).toList();

              document.addPage(
                pw.MultiPage(
                  pageFormat:
                      PdfPageFormat.a4.landscape,
                  margin:
                      const pw.EdgeInsets.all(24),
                  header: (pw.Context context) {
                    return pw.Directionality(
                      textDirection: arabic
                          ? pw.TextDirection.rtl
                          : pw.TextDirection.ltr,
                      child: pw.Column(
                        crossAxisAlignment:
                            pw.CrossAxisAlignment
                                .stretch,
                        children: <pw.Widget>[
                          pw.Text(
                            text.appTitle,
                            style: pw.TextStyle(
                              font: bold,
                              fontSize: 18,
                            ),
                          ),
                          pw.Text(
                            title(text),
                            style: pw.TextStyle(
                              font: bold,
                              fontSize: 14,
                            ),
                          ),
                          pw.Text(
                            '${formatDate(DateTime.now(), includeTime: true)}'
                            ' — ${widget.controller.currentUser!.fullName}',
                          ),
                          pw.SizedBox(height: 8),
                        ],
                      ),
                    );
                  },
                  footer: (pw.Context context) {
                    return pw.Align(
                      alignment:
                          pw.Alignment.center,
                      child: pw.Text(
                        '${context.pageNumber} / '
                        '${context.pagesCount}',
                      ),
                    );
                  },
                  build: (pw.Context context) {
                    return <pw.Widget>[
                      pw.Directionality(
                        textDirection: arabic
                            ? pw.TextDirection.rtl
                            : pw.TextDirection.ltr,
                        child: pw.Table.fromTextArray(
                          headers: headers,
                          data: data,
                          headerStyle: pw.TextStyle(
                            font: bold,
                            fontSize: 8,
                          ),
                          cellStyle: pw.TextStyle(
                            font: font,
                            fontSize: 7,
                          ),
                          headerDecoration:
                              const pw.BoxDecoration(
                            color:
                                PdfColors.blueGrey200,
                          ),
                          cellAlignment:
                              pw.Alignment.center,
                        ),
                      ),
                    ];
                  },
                ),
              );

              final Uint8List bytes =
                  await document.save();

              await widget.controller.db.audit(
                actor: widget
                    .controller.currentUser!,
                entityType: 'report',
                entityId: null,
                action: 'EXPORT_PDF',
                newValue:
                    'records=${items.length}',
                reason: title(text),
              );

              await Printing.sharePdf(
                bytes: bytes,
                filename:
                    'SmartChem_Materials.pdf',
              );
            }

            @override
            void dispose() {
              search.dispose();
              super.dispose();
            }

            @override
