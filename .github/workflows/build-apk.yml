      - name: Write application source
        run: |
          cat > smartchem_v4/lib/main.dart <<'DART'
          import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'dart:math';
          import 'dart:typed_data';

          import 'package:cross_file/cross_file.dart';
          import 'package:crypto/crypto.dart';
          import 'package:excel/excel.dart' as xls;
          import 'package:file_picker/file_picker.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:flutter_localizations/flutter_localizations.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:intl/intl.dart';
          import 'package:mobile_scanner/mobile_scanner.dart';
          import 'package:path/path.dart' as path_util;
          import 'package:path_provider/path_provider.dart';
          import 'package:pdf/pdf.dart';
          import 'package:pdf/widgets.dart' as pw;
          import 'package:printing/printing.dart';
          import 'package:share_plus/share_plus.dart';
          import 'package:sqflite/sqflite.dart';

          import 'l10n/app_localizations.dart';

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();

            final AppController controller = AppController();
            await controller.initialize();

            runApp(
              SmartChemApp(
                controller: controller,
              ),
            );
          }

          String isoNow() {
            return DateTime.now().toIso8601String();
          }

          DateTime? parseDateValue(dynamic value) {
            if (value == null) {
              return null;
            }

            final String text = value.toString().trim();

            if (text.isEmpty) {
              return null;
            }

            return DateTime.tryParse(text);
          }

          String formatDate(
            DateTime? value, {
            bool includeTime = false,
          }) {
            if (value == null) {
              return '-';
            }

            if (includeTime) {
              return DateFormat('dd/MM/yyyy HH:mm').format(value);
            }

            return DateFormat('dd/MM/yyyy').format(value);
          }

          double numberValue(dynamic value) {
            if (value is num) {
              return value.toDouble();
            }

            return double.tryParse(
                  value?.toString().trim() ?? '',
                ) ??
                0;
          }

          String normalizedDigits(String input) {
            const String arabic = '٠١٢٣٤٥٦٧٨٩';
            const String persian = '۰۱۲۳۴۵۶۷۸۹';

            String result = input;

            for (int index = 0; index < 10; index++) {
              result = result.replaceAll(
                arabic[index],
                index.toString(),
              );

              result = result.replaceAll(
                persian[index],
                index.toString(),
              );
            }

            return result;
          }

          class ParsedGs1 {
            const ParsedGs1({
              required this.raw,
              required this.gtin,
              required this.lot,
              required this.expiryDate,
              required this.serial,
              required this.catalog,
              required this.additional,
            });

            final String raw;
            final String gtin;
            final String lot;
            final DateTime? expiryDate;
            final String serial;
            final String catalog;
            final Map<String, String> additional;
          }

          DateTime? parseGs1Expiry(String input) {
            final String value = normalizedDigits(input);

            if (!RegExp(r'^\d{6}$').hasMatch(value)) {
              return null;
            }

            final int year =
                2000 + int.parse(value.substring(0, 2));

            final int month =
                int.parse(value.substring(2, 4));

            int day =
                int.parse(value.substring(4, 6));

            if (month < 1 || month > 12) {
              return null;
            }

            final int lastDay =
                DateTime(year, month + 1, 0).day;

            if (day == 0) {
              day = lastDay;
            }

            if (day < 1 || day > lastDay) {
              return null;
            }

            return DateTime(
              year,
              month,
              day,
            );
          }

          String _parenthesizedValue(
            String raw,
            String ai,
          ) {
            final RegExp expression = RegExp(
              '\\($ai\\)(.*?)'
              '(?=\\(\\d{2,4}\\)|\$)',
              dotAll: true,
            );

            return expression
                    .firstMatch(raw)
                    ?.group(1)
                    ?.trim() ??
                '';
          }

          ParsedGs1 parseGs1(String input) {
            String raw = input.trim();

            raw = raw.replaceAll(
              '<GS>',
              String.fromCharCode(29),
            );

            raw = raw.replaceFirst(
              RegExp(r'^\][dD]2'),
              '',
            );

            final Map<String, String> additional =
                <String, String>{};

            String gtin = '';
            String lot = '';
            String serial = '';
            String catalog = '';
            DateTime? expiryDate;

            if (raw.contains(RegExp(r'\(\d{2,4}\)'))) {
              final RegExp expression =
                  RegExp(r'\((\d{2,4})\)(.*?)(?=\(\d{2,4}\)|$)');

              for (final RegExpMatch match
                  in expression.allMatches(raw)) {
                final String ai =
                    match.group(1) ?? '';

                final String value =
                    match.group(2)?.trim() ?? '';

                additional[ai] = value;
              }

              gtin = _parenthesizedValue(raw, '01');
              lot = _parenthesizedValue(raw, '10');
              serial = _parenthesizedValue(raw, '21');
              catalog = _parenthesizedValue(raw, '240');

              expiryDate = parseGs1Expiry(
                _parenthesizedValue(raw, '17'),
              );
            } else {
              int index = 0;

              String readVariable(int start) {
                int end = start;

                while (end < raw.length &&
                    raw.codeUnitAt(end) != 29) {
                  end++;
                }

                return raw.substring(start, end).trim();
              }

              while (index < raw.length) {
                if (raw.codeUnitAt(index) == 29) {
                  index++;
                  continue;
                }

                if (raw.startsWith('01', index) &&
                    index + 16 <= raw.length) {
                  gtin = raw.substring(
                    index + 2,
                    index + 16,
                  );

                  additional['01'] = gtin;
                  index += 16;
                  continue;
                }

                if (raw.startsWith('17', index) &&
                    index + 8 <= raw.length) {
                  final String value = raw.substring(
                    index + 2,
                    index + 8,
                  );

                  expiryDate = parseGs1Expiry(value);
                  additional['17'] = value;
                  index += 8;
                  continue;
                }

                if (raw.startsWith('240', index)) {
                  catalog = readVariable(index + 3);
                  additional['240'] = catalog;

                  index += 3 + catalog.length;

                  if (index < raw.length &&
                      raw.codeUnitAt(index) == 29) {
                    index++;
                  }

                  continue;
                }

                if (raw.startsWith('21', index)) {
                  serial = readVariable(index + 2);
                  additional['21'] = serial;

                  index += 2 + serial.length;

                  if (index < raw.length &&
                      raw.codeUnitAt(index) == 29) {
                    index++;
                  }

                  continue;
                }

                if (raw.startsWith('10', index)) {
                  lot = readVariable(index + 2);
                  additional['10'] = lot;

                  index += 2 + lot.length;

                  if (index < raw.length &&
                      raw.codeUnitAt(index) == 29) {
                    index++;
                  }

                  continue;
                }

                index++;
              }
            }

            return ParsedGs1(
              raw: input,
              gtin: gtin,
              lot: lot,
              expiryDate: expiryDate,
              serial: serial,
              catalog: catalog,
              additional: additional,
            );
          }

          class UserRecord {
            const UserRecord({
              required this.id,
              required this.fullName,
              required this.username,
              required this.employeeNo,
              required this.department,
              required this.role,
              required this.isActive,
              required this.isArchived,
              required this.createdAt,
              required this.lastLogin,
            });

            factory UserRecord.fromMap(
              Map<String, Object?> map,
            ) {
              return UserRecord(
                id: map['id'] as int,
                fullName:
                    map['full_name']?.toString() ?? '',
                username:
                    map['username']?.toString() ?? '',
                employeeNo:
                    map['employee_no']?.toString() ?? '',
                department:
                    map['department']?.toString() ?? '',
                role:
                    map['role']?.toString() ?? 'user',
                isActive:
                    (map['is_active'] as int? ?? 0) == 1,
                isArchived:
                    (map['is_archived'] as int? ?? 0) == 1,
                createdAt: parseDateValue(
                  map['created_at'],
                ),
                lastLogin: parseDateValue(
                  map['last_login'],
                ),
              );
            }

            final int id;
            final String fullName;
            final String username;
            final String employeeNo;
            final String department;
            final String role;
            final bool isActive;
            final bool isArchived;
            final DateTime? createdAt;
            final DateTime? lastLogin;

            bool get isSuperAdmin {
              return role == 'super_admin';
            }
          }

          class MaterialRecord {
            const MaterialRecord({
              required this.id,
              required this.internalNo,
              required this.name,
              required this.type,
              required this.rawBarcode,
              required this.barcodeFormat,
              required this.gtin,
              required this.lotNumber,
              required this.serialNumber,
              required this.catalogNumber,
              required this.department,
              required this.deviceName,
              required this.storageLocation,
              required this.manufacturer,
              required this.originalQuantity,
              required this.usedQuantity,
              required this.unit,
              required this.minStock,
              required this.receivedAt,
              required this.manufacturerExpiry,
              required this.openedAt,
              required this.afterOpenExpiry,
              required this.status,
              required this.isApproved,
              required this.isBlocked,
              required this.isDisposed,
              required this.deletedAt,
              required this.createdBy,
              required this.createdAt,
              required this.lastUsedBy,
              required this.lastUsedAt,
              required this.usageCount,
              required this.notes,
            });

            factory MaterialRecord.fromMap(
              Map<String, Object?> map,
            ) {
              return MaterialRecord(
                id: map['id'] as int,
                internalNo:
                    map['internal_no']?.toString() ?? '',
                name: map['name']?.toString() ?? '',
                type: map['type']?.toString() ?? '',
                rawBarcode:
                    map['raw_barcode_value']?.toString() ??
                        '',
                barcodeFormat:
                    map['barcode_format']?.toString() ?? '',
                gtin: map['gtin']?.toString() ?? '',
                lotNumber:
                    map['lot_number']?.toString() ?? '',
                serialNumber:
                    map['serial_number']?.toString() ?? '',
                catalogNumber:
                    map['catalog_number']?.toString() ?? '',
                department:
                    map['department']?.toString() ?? '',
                deviceName:
                    map['device_name']?.toString() ?? '',
                storageLocation:
                    map['storage_location']?.toString() ??
                        '',
                manufacturer:
                    map['manufacturer']?.toString() ?? '',
                originalQuantity:
                    numberValue(map['original_quantity']),
                usedQuantity:
                    numberValue(map['used_quantity']),
                unit: map['unit']?.toString() ?? '',
                minStock:
                    numberValue(map['min_stock']),
                receivedAt: parseDateValue(
                  map['received_at'],
                ),
                manufacturerExpiry: parseDateValue(
                  map['manufacturer_expiry'],
                ),
                openedAt: parseDateValue(
                  map['opened_at'],
                ),
                afterOpenExpiry: parseDateValue(
                  map['after_open_expiry'],
                ),
                status:
                    map['status']?.toString() ?? 'active',
                isApproved:
                    (map['is_approved'] as int? ?? 0) == 1,
                isBlocked:
                    (map['is_blocked'] as int? ?? 0) == 1,
                isDisposed:
                    (map['is_disposed'] as int? ?? 0) == 1,
                deletedAt: parseDateValue(
                  map['deleted_at'],
                ),
                createdBy:
                    map['created_by_name']?.toString() ?? '',
                createdAt: parseDateValue(
                  map['created_at'],
                ),
                lastUsedBy:
                    map['last_used_by_name']?.toString() ??
                        '',
                lastUsedAt: parseDateValue(
                  map['last_used_at'],
                ),
                usageCount:
                    map['usage_count'] as int? ?? 0,
                notes: map['notes']?.toString() ?? '',
              );
            }

            final int id;
            final String internalNo;
            final String name;
            final String type;
            final String rawBarcode;
            final String barcodeFormat;
            final String gtin;
            final String lotNumber;
            final String serialNumber;
            final String catalogNumber;
            final String department;
            final String deviceName;
            final String storageLocation;
            final String manufacturer;
            final double originalQuantity;
            final double usedQuantity;
            final String unit;
            final double minStock;
            final DateTime? receivedAt;
            final DateTime? manufacturerExpiry;
            final DateTime? openedAt;
            final DateTime? afterOpenExpiry;
            final String status;
            final bool isApproved;
            final bool isBlocked;
            final bool isDisposed;
            final DateTime? deletedAt;
            final String createdBy;
            final DateTime? createdAt;
            final String lastUsedBy;
            final DateTime? lastUsedAt;
            final int usageCount;
            final String notes;

            double get remainingQuantity {
              return max(
                0,
                originalQuantity - usedQuantity,
              );
            }

            DateTime? get effectiveExpiry {
              if (afterOpenExpiry != null) {
                return afterOpenExpiry;
              }

              return manufacturerExpiry;
            }

            bool get isExpired {
              final DateTime? expiry = effectiveExpiry;

              if (expiry == null) {
                return false;
              }

              final DateTime today = DateTime(
                DateTime.now().year,
                DateTime.now().month,
                DateTime.now().day,
              );

              return expiry.isBefore(today);
            }

            bool get isAvailable {
              return deletedAt == null &&
                  isApproved &&
                  !isBlocked &&
                  !isDisposed &&
                  status != 'returned' &&
                  remainingQuantity > 0 &&
                  !isExpired;
            }

            bool get isExpiredOrEmpty {
              return deletedAt == null &&
                  (isExpired ||
                      remainingQuantity <= 0 ||
                      status == 'empty' ||
                      status == 'disposed');
            }

            bool get isUnused {
              return deletedAt == null &&
                  !isDisposed &&
                  usedQuantity == 0 &&
                  usageCount == 0;
            }

            bool get isArchived {
              return deletedAt != null;
            }
          }

