          class ScannerScreen extends StatefulWidget {
            const ScannerScreen({super.key});

            @override
            State<ScannerScreen> createState() {
              return _ScannerScreenState();
            }
          }

          class _ScannerScreenState
              extends State<ScannerScreen> {
            bool processing = false;

            Future<void> processCode(
              String rawValue,
            ) async {
              if (processing ||
                  rawValue.trim().isEmpty) {
                return;
              }

              setState(() {
                processing = true;
              });

              final parsed =
                  parseBarcode(rawValue);

              await Navigator.of(context).push(
                MaterialPageRoute<void>(
                  builder: (_) =>
                      MaterialFormScreen(
                    parsedBarcode: parsed,
                  ),
                ),
              );

              if (mounted) {
                setState(() {
                  processing = false;
                });
              }
            }

            void onDetect(
              BarcodeCapture capture,
            ) {
              if (processing ||
                  capture.barcodes.isEmpty) {
                return;
              }

              for (final barcode
                  in capture.barcodes) {
                final rawValue =
                    barcode.rawValue;

                if (rawValue != null &&
                    rawValue.trim().isNotEmpty) {
                  processCode(rawValue);
                  return;
                }
              }
            }

            Future<void> manualEntry() async {
              final textController =
                  TextEditingController(
                text:
                    '(01)00380740150005'
                    '(17)260731'
                    '(10)50532Y600'
                    '(240)09P9510',
              );

              final result =
                  await showDialog<String>(
                context: context,
                builder: (dialogContext) {
                  return AlertDialog(
                    title: const Text(
                      'إدخال كود للتجربة',
                    ),
                    content: TextField(
                      controller:
                          textController,
                      maxLines: 4,
                      decoration:
                          const InputDecoration(
                        labelText:
                            'الباركود أو GS1',
                      ),
                    ),
                    actions: [
                      TextButton(
                        onPressed: () {
                          Navigator.of(
                            dialogContext,
                          ).pop();
                        },
                        child:
                            const Text('إلغاء'),
                      ),
                      FilledButton(
                        onPressed: () {
                          Navigator.of(
                            dialogContext,
                          ).pop(
                            textController.text
                                .trim(),
                          );
                        },
                        child:
                            const Text('متابعة'),
                      ),
                    ],
                  );
                },
              );

              textController.dispose();

              if (result != null &&
                  result.isNotEmpty) {
                await processCode(result);
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: Colors.black,
                appBar: AppBar(
