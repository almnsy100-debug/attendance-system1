          class ScannerScreen extends StatefulWidget {
            const ScannerScreen({
              super.key,
            });

            @override
            State<ScannerScreen> createState() {
              return _ScannerScreenState();
            }
          }

          class _ScannerScreenState
              extends State<ScannerScreen> {
            Key scannerKey = UniqueKey();

            bool codeHandled = false;
            bool controllerReady = false;

            String cameraError = '';

            Timer? cameraTimer;

            @override
            void initState() {
              super.initState();
              startCameraTimer();
            }

            void startCameraTimer() {
              cameraTimer?.cancel();

              cameraTimer = Timer(
                const Duration(seconds: 15),
                () {
                  if (!mounted ||
                      controllerReady ||
                      cameraError.isNotEmpty) {
                    return;
                  }

                  setState(() {
                    cameraError =
                        'تأخر تشغيل الكاميرا. '
                        'تأكد من منح التطبيق صلاحية الكاميرا '
                        'ثم اضغط إعادة المحاولة.';
                  });
                },
              );
            }

            void onControllerCreated(
              CameraController? controller,
              Exception? error,
            ) {
              if (!mounted) {
                return;
              }

              if (error != null) {
                cameraTimer?.cancel();

                setState(() {
                  cameraError = error.toString();
                  controllerReady = false;
                });

                return;
              }

              if (controller != null) {
                cameraTimer?.cancel();

                setState(() {
                  controllerReady = true;
                  cameraError = '';
                });
              }
            }

            void onScan(Code code) {
              if (codeHandled ||
                  !code.isValid ||
                  !mounted) {
                return;
              }

              final String value =
                  code.text?.trim() ?? '';

              if (value.isEmpty) {
                return;
              }

              codeHandled = true;
              cameraTimer?.cancel();

              Navigator.of(context).pop(
                value,
              );
            }

            void retryCamera() {
              setState(() {
                scannerKey = UniqueKey();
                cameraError = '';
                controllerReady = false;
                codeHandled = false;
              });

              startCameraTimer();
            }

            Future<void> manualEntry() async {
              final TextEditingController
                  controller =
                  TextEditingController(
                text:
                    '(01)00380740150005'
                    '(17)260731'
                    '(10)50532Y600'
                    '(240)09P9510',
              );

              final String? result =
                  await showDialog<String>(
                context: context,
                builder: (
                  BuildContext dialogContext,
                ) {
                  return AlertDialog(
                    title: const Text(
                      'إدخال الباركود يدويًا',
                    ),
                    content: TextField(
                      controller: controller,
                      maxLines: 5,
                      decoration:
                          const InputDecoration(
                        labelText:
                            'الباركود أو GS1',
                      ),
                    ),
                    actions: <Widget>[
                      TextButton(
                        onPressed: () {
                          Navigator.of(
                            dialogContext,
                          ).pop();
                        },
                        child:
                            const Text('إلغاء'),
                      ),
                      FilledButton(
                        onPressed: () {
                          Navigator.of(
                            dialogContext,
                          ).pop(
                            controller.text.trim(),
                          );
                        },
                        child:
                            const Text('متابعة'),
                      ),
                    ],
                  );
                },
              );

              controller.dispose();

              if (result != null &&
                  result.isNotEmpty &&
                  mounted) {
                Navigator.of(context).pop(
                  result,
                );
              }
            }

            @override
            void dispose() {
              cameraTimer?.cancel();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: Colors.black,
                appBar: AppBar(
                  title:
                      const Text('مسح المادة'),
                  actions: <Widget>[
                    IconButton(
                      tooltip:
                          'إدخال يدوي',
                      onPressed: manualEntry,
                      icon: const Icon(
                        Icons.keyboard,
