                          ),
                          TextField(
                            controller:
                                inventoryController,
                            decoration:
                                const InputDecoration(
                              labelText:
                                  'اسم زر المخزون',
                            ),
                          ),
                          const SizedBox(
                            height: 8,
                          ),
                          TextField(
                            controller:
                                reportsController,
                            decoration:
                                const InputDecoration(
                              labelText:
                                  'اسم زر التقارير',
                            ),
                          ),
                          const SizedBox(
                            height: 8,
                          ),
                          TextField(
                            controller:
                                daysController,
                            keyboardType:
                                TextInputType
                                    .number,
                            decoration:
                                const InputDecoration(
                              labelText:
                                  'أيام قرب الانتهاء',
                            ),
                          ),
                        ],
                      ),
                    ),
                    actions: [
                      TextButton(
                        onPressed: () {
                          Navigator.of(
                            dialogContext,
                          ).pop(false);
                        },
                        child:
                            const Text('إلغاء'),
                      ),
                      FilledButton(
                        onPressed: () {
                          Navigator.of(
                            dialogContext,
                          ).pop(true);
                        },
                        child:
                            const Text('حفظ'),
                      ),
                    ],
                  );
                },
              );

              if (save == true) {
                final days = int.tryParse(
                      daysController.text,
                    ) ??
                    30;

                setState(() {
                  if (scanController.text
                      .trim()
                      .isNotEmpty) {
                    AppStore.scanButtonName =
                        scanController.text
                            .trim();
                  }

                  if (inventoryController
                      .text
                      .trim()
                      .isNotEmpty) {
                    AppStore
                            .inventoryButtonName =
                        inventoryController
                            .text
                            .trim();
                  }

                  if (reportsController.text
                      .trim()
                      .isNotEmpty) {
                    AppStore
                            .reportsButtonName =
                        reportsController.text
                            .trim();
                  }

                  AppStore.nearExpiryDays =
                      days < 1 ? 1 : days;
                });
              }

              scanController.dispose();
              inventoryController.dispose();
              reportsController.dispose();
              daysController.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text(
                    'لوحة المستخدم الرئيسي',
                  ),
                  actions: [
                    IconButton(
                      tooltip:
                          'إعدادات الواجهة',
                      onPressed:
                          editApplicationSettings,
                      icon: const Icon(
                        Icons.tune,
                      ),
                    ),
                  ],
                ),
                floatingActionButton:
                    FloatingActionButton
                        .extended(
                  onPressed: addUser,
                  icon: const Icon(
                    Icons.person_add_alt_1,
                  ),
                  label: const Text(
                    'إضافة مستخدم',
                  ),
                ),
                body: ListView.separated(
                  padding:
                      const EdgeInsets.all(12),
                  itemCount:
                      AppStore.users.length,
                  separatorBuilder: (_, __) {
                    return const SizedBox(
                      height: 8,
                    );
                  },
                  itemBuilder: (_, index) {
                    final user =
                        AppStore.users[index];

                    final current =
                        user ==
                            AppStore
                                .currentUser;

                    return Card(
                      child: ExpansionTile(
                        leading: Icon(
                          user.isAdmin
                              ? Icons
                                  .admin_panel_settings
                              : Icons
                                  .person_outline,
                        ),
                        title:
                            Text(user.name),
                        subtitle: Text(
                          '${user.username} • '
                          '${user.isAdmin ? 'رئيسي' : 'عادي'}'
                          '${current ? ' • الحساب الحالي' : ''}',
                        ),
                        trailing: Switch(
                          value:
                              user.isActive,
                          onChanged: current
                              ? null
                              : (value) {
                                  setState(
                                    () {
                                      user.isActive =
                                          value;
                                    },
                                  );
                                },
                        ),
                        children: [
                          SwitchListTile(
                            title: const Text(
                              'السماح بمسح الباركود',
                            ),
                            value:
                                user.canScan,
                            onChanged: (value) {
                              setState(() {
                                user.canScan =
                                    value;
                              });
                            },
                          ),
                          SwitchListTile(
                            title: const Text(
                              'السماح بتسجيل الاستخدام',
                            ),
                            value: user
                                .canUseMaterials,
                            onChanged: (value) {
                              setState(() {
                                user.canUseMaterials =
                                    value;
                              });
                            },
                          ),
                          SwitchListTile(
                            title: const Text(
                              'عرض التقارير',
                            ),
                            value: user
                                .canViewReports,
                            onChanged: (value) {
                              setState(() {
                                user.canViewReports =
                                    value;
                              });
                            },
                          ),
                        ],
                      ),
                    );
                  },
                ),
              );
            }
          }
          DART

      - name: Configure Android application
        working-directory: smartchem_v203
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text(encoding="utf-8")

          camera_permission = (
              '<uses-permission '
              'android:name="android.permission.CAMERA" />'
          )

          camera_feature = (
              '<uses-feature '
              'android:name="android.hardware.camera.any" '
              'android:required="false" />'
          )

          if camera_permission not in text:
              position = text.find(">")

              text = (
                  text[:position + 1]
                  + "\n    "
                  + camera_permission
                  + "\n    "
                  + camera_feature
                  + text[position + 1:]
              )

          text = text.replace(
              'android:label="smartchem_track_v203"',
              'android:label="SmartChem Track v2.0.3"'
          )

          manifest.write_text(
              text,
              encoding="utf-8"
          )

          gradle = Path(
              "android/app/build.gradle.kts"
          )

          if gradle.exists():
              content = gradle.read_text(
                  encoding="utf-8"
              )

              content = content.replace(
                  'applicationId = '
                  '"om.smartchem.smartchem_track_v203"',
                  'applicationId = '
                  '"om.smartchem.track.v203"'
              )

              content = content.replace(
                  "minSdk = flutter.minSdkVersion",
                  "minSdk = 23"
              )

              gradle.write_text(
                  content,
                  encoding="utf-8"
              )
          PY

      - name: Show generated Android manifest
        working-directory: smartchem_v203
        run: |
          cat android/app/src/main/AndroidManifest.xml

      - name: Build release APK
        working-directory: smartchem_v203
        run: |
          flutter build apk \
            --release \
            --build-name=2.0.3 \
            --build-number=5

      - name: Copy APK
        run: |
          cp \
            smartchem_v203/build/app/outputs/flutter-apk/app-release.apk \
            SmartChemTrack-v2.0.3.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartChemTrack-v2.0.3-APK
          path: SmartChemTrack-v2.0.3.apk
          retention-days: 30
          if-no-files-found: error
