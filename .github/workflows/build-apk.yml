                      showScannerOverlay: true,
                      showFlashlight: true,
                      showToggleCamera: true,
                      showGallery: false,
                      allowPinchZoom: true,
                      loading:
                          const ColoredBox(
                        color: Colors.black,
                        child: Center(
                          child: Column(
