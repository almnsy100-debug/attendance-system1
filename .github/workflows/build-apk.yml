          class _UserFormScreenState
              extends State<UserFormScreen> {
            late final TextEditingController fullName;
            late final TextEditingController username;
            late final TextEditingController employeeNo;
            late final TextEditingController department;
            late final TextEditingController password;
            late final TextEditingController confirmPassword;
            late final TextEditingController reason;

            String role = 'user';
            bool active = true;
            bool archived = false;
            bool saving = false;

            @override
            void initState() {
              super.initState();

              fullName = TextEditingController(
                text: widget.user?.fullName ?? '',
              );

              username = TextEditingController(
                text: widget.user?.username ?? '',
              );

              employeeNo = TextEditingController(
                text: widget.user?.employeeNo ?? '',
              );

              department =
                  TextEditingController(
                text: widget.user?.department ?? '',
              );

              password = TextEditingController();
              confirmPassword =
                  TextEditingController();

              reason = TextEditingController(
                text: widget.user == null
                    ? 'إضافة مستخدم'
                    : '',
              );

              role =
                  widget.user?.role ?? 'user';

              active =
                  widget.user?.isActive ?? true;

              archived =
                  widget.user?.isArchived ?? false;
            }

            Future<void> save() async {
              final AppLocalizations text =
                  AppLocalizations.of(context);

              if (fullName.text.trim().isEmpty ||
                  username.text.trim().isEmpty ||
                  reason.text.trim().isEmpty ||
                  (widget.user == null &&
                      password.text.isEmpty) ||
                  password.text !=
                      confirmPassword.text) {
                ScaffoldMessenger.of(context)
                    .showSnackBar(
                  SnackBar(
                    content:
                        Text(text.enterRequired),
                  ),
                );

                return;
              }

              setState(() {
                saving = true;
              });

              try {
                await widget.controller.db.saveUser(
                  actor:
                      widget.controller.currentUser!,
                  userId: widget.user?.id,
                  fullName:
                      fullName.text.trim(),
                  username:
                      username.text.trim(),
                  employeeNo:
                      employeeNo.text.trim(),
                  department:
                      department.text.trim(),
                  role: role,
                  isActive: active,
                  isArchived: archived,
                  password:
                      password.text.isEmpty
                          ? null
                          : password.text,
                  reason: reason.text.trim(),
                );

                widget.controller.refresh();

                if (mounted) {
                  Navigator.of(context).pop();
                }
              } catch (error) {
                if (mounted) {
                  ScaffoldMessenger.of(context)
                      .showSnackBar(
                    SnackBar(
                      content: Text(
                        error
                                .toString()
                                .contains(
                                  'LAST_ADMIN',
                                )
                            ? text.cannotDisableLastAdmin
                            : error.toString(),
                      ),
                    ),
                  );
                }
              } finally {
                if (mounted) {
                  setState(() {
                    saving = false;
                  });
                }
              }
            }

            @override
            void dispose() {
              fullName.dispose();
              username.dispose();
              employeeNo.dispose();
              department.dispose();
              password.dispose();
              confirmPassword.dispose();
              reason.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              final AppLocalizations text =
                  AppLocalizations.of(context);

              return Scaffold(
                appBar: AppBar(
                  title: Text(
                    widget.user == null
                        ? text.addUser
                        : text.editUser,
                  ),
                ),
                body: ListView(
                  padding:
                      const EdgeInsets.all(16),
                  children: <Widget>[
                    TextField(
                      controller: fullName,
                      decoration:
                          InputDecoration(
                        labelText: text.fullName,
                      ),
                    ),
                    const SizedBox(height: 12),
                    TextField(
                      controller: username,
                      decoration:
                          InputDecoration(
                        labelText: text.username,
                      ),
                    ),
                    const SizedBox(height: 12),
                    TextField(
                      controller: employeeNo,
                      decoration:
                          InputDecoration(
                        labelText: text.employeeNo,
                      ),
                    ),
                    const SizedBox(height: 12),
                    TextField(
                      controller: department,
                      decoration:
                          InputDecoration(
                        labelText: text.department,
                      ),
                    ),
                    const SizedBox(height: 12),
                    DropdownButtonFormField<String>(
                      initialValue: role,
                      decoration:
                          InputDecoration(
                        labelText: text.role,
                      ),
                      items: <DropdownMenuItem<
                          String>>[
                        DropdownMenuItem<String>(
                          value: 'user',
                          child:
                              Text(text.normalUser),
                        ),
                        DropdownMenuItem<String>(
                          value: 'super_admin',
                          child:
                              Text(text.superAdmin),
                        ),
                      ],
                      onChanged: (String? value) {
                        if (value != null) {
                          setState(() {
                            role = value;
                          });
                        }
                      },
                    ),
                    const SizedBox(height: 12),
                    TextField(
                      controller: password,
                      obscureText: true,
                      decoration:
                          InputDecoration(
                        labelText:
                            text.changePassword,
                      ),
                    ),
                    const SizedBox(height: 12),
                    TextField(
                      controller: confirmPassword,
                      obscureText: true,
                      decoration:
                          InputDecoration(
                        labelText:
                            '${text.confirm} '
                            '${text.password}',
                      ),
                    ),
                    SwitchListTile(
                      value: active,
                      title: Text(text.active),
                      onChanged: (bool value) {
                        setState(() {
                          active = value;
                        });
                      },
                    ),
                    SwitchListTile(
                      value: archived,
                      title: Text(text.archived),
                      onChanged: (bool value) {
                        setState(() {
                          archived = value;
                        });
                      },
                    ),
                    TextField(
                      controller: reason,
                      maxLines: 3,
                      decoration:
                          InputDecoration(
                        labelText: text.reason,
                      ),
                    ),
                    const SizedBox(height: 16),
                    FilledButton.icon(
                      onPressed:
                          saving ? null : save,
                      icon: const Icon(Icons.save),
                      label: Padding(
                        padding:
                            const EdgeInsets.symmetric(
                          vertical: 14,
                        ),
                        child: Text(text.save),
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class AuditScreen extends StatelessWidget {
            const AuditScreen({
              super.key,
              required this.controller,
            });

            final AppController controller;

            @override
            Widget build(BuildContext context) {
              final AppLocalizations text =
                  AppLocalizations.of(context);

              return Scaffold(
                appBar: AppBar(
                  title: Text(text.auditTrail),
                ),
                body: FutureBuilder<
                    List<Map<String, Object?>>>(
                  future:
                      controller.db.auditLogs(),
                  builder: (
                    BuildContext context,
                    AsyncSnapshot<
                            List<Map<String, Object?>>>
                        snapshot,
                  ) {
                    if (!snapshot.hasData) {
                      return const Center(
                        child:
                            CircularProgressIndicator(),
                      );
                    }

                    final List<Map<String, Object?>>
                        rows =
                        snapshot.data!;

                    if (rows.isEmpty) {
                      return const Center(
                        child: Text('-'),
                      );
                    }

                    return ListView.separated(
                      padding:
                          const EdgeInsets.all(12),
                      itemCount: rows.length,
                      separatorBuilder: (
                        BuildContext context,
                        int index,
                      ) {
                        return const SizedBox(
                          height: 8,
                        );
                      },
                      itemBuilder: (
                        BuildContext context,
                        int index,
                      ) {
                        final Map<String, Object?>
                            row =
                            rows[index];

                        return Card(
                          child: ExpansionTile(
                            title: Text(
                              row['action']
                                      ?.toString() ??
                                  '',
                            ),
                            subtitle: Text(
                              '${row['performer_name'] ?? ''}\n'
                              '${formatDate(parseDateValue(row['performed_at']), includeTime: true)}',
                            ),
                            childrenPadding:
                                const EdgeInsets.all(
                              14,
                            ),
                            children: <Widget>[
                              SelectableText(
                                '${text.oldValue}: '
                                '${row['old_value'] ?? '-'}\n\n'
                                '${text.newValue}: '
                                '${row['new_value'] ?? '-'}\n\n'
                                '${text.reason}: '
                                '${row['reason'] ?? '-'}',
                              ),
                            ],
                          ),
                        );
                      },
                    );
                  },
                ),
              );
            }
          }
          DART

