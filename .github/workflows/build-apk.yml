          class _InventoryScreenState
              extends State<InventoryScreen> {
            final TextEditingController
                searchController =
                TextEditingController();

            String searchText = '';

            @override
            void dispose() {
              searchController.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return AnimatedBuilder(
                animation: widget.store,
                builder: (
                  BuildContext context,
                  Widget? child,
                ) {
                  final String query =
                      searchText
                          .trim()
                          .toLowerCase();

                  final List<MaterialRecord>
                      filtered =
                      widget.store.materials.where(
                    (MaterialRecord material) {
                      if (query.isEmpty) {
                        return true;
                      }

                      return material.name
                              .toLowerCase()
                              .contains(query) ||
                          material.serialNumber
                              .toLowerCase()
                              .contains(query) ||
                          material.lotNumber
                              .toLowerCase()
                              .contains(query) ||
                          material.gtin
                              .toLowerCase()
                              .contains(query) ||
                          normalizeBarcode(
                            material.barcode,
                          )
                              .toLowerCase()
                              .contains(query);
                    },
                  ).toList();

                  return Scaffold(
                    appBar: AppBar(
                      title:
                          const Text('المخزون'),
                    ),
                    body: Column(
                      children: <Widget>[
                        Padding(
                          padding:
                              const EdgeInsets.all(
                            12,
                          ),
                          child: TextField(
                            controller:
                                searchController,
                            onChanged: (
                              String value,
                            ) {
                              setState(() {
                                searchText =
                                    value;
                              });
                            },
                            decoration:
                                const InputDecoration(
                              labelText:
                                  'البحث بالاسم أو LOT '
                                  'أو الرقم التسلسلي أو الباركود',
                              prefixIcon: Icon(
                                Icons.search,
                              ),
                            ),
                          ),
                        ),
                        Expanded(
                          child: filtered.isEmpty
                              ? const Center(
                                  child: Text(
                                    'لا توجد مواد مطابقة',
                                  ),
                                )
                              : ListView.separated(
                                  padding:
                                      const EdgeInsets
                                          .fromLTRB(
                                    12,
                                    0,
                                    12,
                                    12,
                                  ),
                                  itemCount:
                                      filtered.length,
                                  separatorBuilder: (
                                    BuildContext context,
                                    int index,
                                  ) {
                                    return const SizedBox(
                                      height: 8,
                                    );
                                  },
                                  itemBuilder: (
                                    BuildContext context,
                                    int index,
                                  ) {
                                    final MaterialRecord
                                        material =
                                        filtered[index];

                                    return Card(
                                      child:
                                          ListTile(
                                        leading:
                                            CircleAvatar(
                                          backgroundColor:
                                              material
                                                  .statusColor,
                                          child:
