name: Build SmartChem Track v2.0.2

on:
  push:
    branches:
      - smartchem-apk-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter information
        run: |
          flutter --version
          flutter doctor -v

      - name: Create Android project
        run: |
          rm -rf smartchem_v2
          flutter create smartchem_v2 \
            --platforms=android \
            --org om.smartchem \
            --project-name smartchem_track_v2

      - name: Write pubspec
        working-directory: smartchem_v2
        shell: bash
        run: |
          cat > pubspec.yaml <<'PUBSPEC'
          name: smartchem_track_v2
          description: Smart laboratory materials tracking application
          publish_to: "none"
          version: 2.0.2+4

          environment:
            sdk: ">=3.5.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            mobile_scanner: 7.2.1
            intl: 0.20.3

          dev_dependencies:
            flutter_test:
              sdk: flutter

          flutter:
            uses-material-design: true
          PUBSPEC

          flutter pub get

      - name: Write SmartChem application
        working-directory: smartchem_v2
        shell: bash
        run: |
          cat > lib/main.dart <<'DART'
          import 'dart:async';

          import 'package:flutter/material.dart';
          import 'package:intl/intl.dart';
          import 'package:mobile_scanner/mobile_scanner.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const SmartChemApp());
          }

          class SmartChemApp extends StatelessWidget {
            const SmartChemApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'SmartChem Track v2.0.2',
                builder: (context, child) {
                  return Directionality(
                    textDirection: TextDirection.rtl,
                    child: child ?? const SizedBox.shrink(),
                  );
                },
                theme: ThemeData(
                  useMaterial3: true,
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: const Color(0xFF006C70),
                  ),
                  scaffoldBackgroundColor: const Color(0xFFF4F8F8),
                  inputDecorationTheme: const InputDecorationTheme(
                    border: OutlineInputBorder(),
                    filled: true,
                  ),
                ),
                home: const LoginScreen(),
              );
            }
          }

          class AppUser {
            AppUser({
              required this.name,
              required this.username,
              required this.password,
              required this.isAdmin,
              this.isActive = true,
              this.canScan = true,
              this.canUseMaterials = true,
              this.canViewReports = true,
            });

            String name;
            String username;
            String password;

            bool isAdmin;
            bool isActive;
            bool canScan;
            bool canUseMaterials;
            bool canViewReports;
          }

          enum MaterialStatus {
            valid,
            nearExpiry,
            expired,
            unapproved,
            empty,
          }

          class LabMaterial {
            LabMaterial({
              required this.id,
              required this.name,
              required this.type,
              required this.rawBarcode,
              required this.gtin,
              required this.lot,
              required this.catalogNumber,
              required this.serialNumber,
              required this.expiryDate,
              required this.device,
              required this.department,
              required this.registeredBy,
              required this.totalQuantity,
              required this.isApproved,
            });

            final String id;

            String name;
            String type;
            String rawBarcode;
            String gtin;
            String lot;
            String catalogNumber;
            String serialNumber;
            String device;
            String department;
            String registeredBy;

            DateTime expiryDate;
            DateTime? openedAt;

            double totalQuantity;
            double usedQuantity = 0.0;

            bool isApproved;

            double get remainingQuantity {
              final remaining = totalQuantity - usedQuantity;

              if (remaining < 0) {
                return 0.0;
              }

              return remaining;
            }

            MaterialStatus get status {
              if (remainingQuantity <= 0) {
                return MaterialStatus.empty;
              }

              if (!isApproved) {
                return MaterialStatus.unapproved;
              }

              final now = DateTime.now();

              final today = DateTime(
                now.year,
                now.month,
                now.day,
              );

              final expiry = DateTime(
                expiryDate.year,
                expiryDate.month,
                expiryDate.day,
              );

              if (expiry.isBefore(today)) {
                return MaterialStatus.expired;
              }

              if (expiry.difference(today).inDays <=
                  AppStore.nearExpiryDays) {
                return MaterialStatus.nearExpiry;
              }

              return MaterialStatus.valid;
            }
          }

          class UsageRecord {
            UsageRecord({
              required this.materialName,
              required this.materialType,
              required this.device,
              required this.employee,
              required this.quantity,
              required this.dateTime,
            });

            final String materialName;
            final String materialType;
            final String device;
            final String employee;
            final double quantity;
            final DateTime dateTime;
          }

          class ParsedBarcode {
            const ParsedBarcode({
              required this.rawValue,
              required this.gtin,
              required this.lot,
              required this.catalogNumber,
              required this.serialNumber,
              required this.expiryDate,
            });

            final String rawValue;
            final String gtin;
            final String lot;
            final String catalogNumber;
            final String serialNumber;
            final DateTime? expiryDate;
          }

          class AppStore {
            static int nearExpiryDays = 30;

            static AppUser? currentUser;

            static final List<AppUser> users = [
              AppUser(
                name: 'المستخدم الرئيسي',
                username: 'admin',
                password: '1234',
                isAdmin: true,
              ),
              AppUser(
                name: 'موظف قسم الكيمياء',
                username: 'staff',
                password: '1234',
                isAdmin: false,
              ),
            ];

            static final List<LabMaterial> materials = [];
            static final List<UsageRecord> usageRecords = [];

            static AppUser? login(
              String username,
              String password,
            ) {
              for (final user in users) {
                if (user.username == username &&
                    user.password == password &&
                    user.isActive) {
                  return user;
                }
              }

              return null;
            }

            static int countStatus(
              MaterialStatus requiredStatus,
            ) {
              return materials
                  .where(
                    (material) =>
                        material.status == requiredStatus,
                  )
                  .length;
            }
          }

          ParsedBarcode parseGs1Barcode(String input) {
            String raw = input.trim();

            raw = raw.replaceAll(
              '<GS>',
              String.fromCharCode(29),
            );

            if (raw.startsWith(']d2') ||
                raw.startsWith(']D2')) {
              raw = raw.substring(3);
            }

            String findParenthesized(String pattern) {
              return RegExp(pattern)
                      .firstMatch(raw)
                      ?.group(1)
                      ?.trim() ??
                  '';
            }

            DateTime? parseExpiry(String value) {
              if (!RegExp(r'^\d{6}$').hasMatch(value)) {
                return null;
              }

              final year =
                  2000 + int.parse(value.substring(0, 2));

              final month =
                  int.parse(value.substring(2, 4));

              int day =
                  int.parse(value.substring(4, 6));

              if (month < 1 || month > 12) {
                return null;
              }

              final lastDay =
                  DateTime(year, month + 1, 0).day;

              if (day == 0 || day > lastDay) {
                day = lastDay;
              }

              return DateTime(year, month, day);
            }

            if (raw.contains('(01)') ||
                raw.contains('(10)') ||
                raw.contains('(17)') ||
                raw.contains('(21)') ||
                raw.contains('(240)')) {
              final expiryCode =
                  findParenthesized(r'\(17\)(\d{6})');

              return ParsedBarcode(
                rawValue: input,
                gtin: findParenthesized(
                  r'\(01\)(\d{14})',
                ),
                lot: findParenthesized(
                  r'\(10\)(.*?)(?=\(\d{2,3}\)|$)',
                ),
                serialNumber: findParenthesized(
                  r'\(21\)(.*?)(?=\(\d{2,3}\)|$)',
                ),
                catalogNumber: findParenthesized(
                  r'\(240\)(.*?)(?=\(\d{2,3}\)|$)',
                ),
                expiryDate: parseExpiry(expiryCode),
              );
            }

            String gtin = '';
            String lot = '';
            String catalogNumber = '';
            String serialNumber = '';
            DateTime? expiryDate;

            int index = 0;

            while (index < raw.length) {
              if (raw.codeUnitAt(index) == 29) {
                index++;
                continue;
              }

              if (raw.startsWith('01', index) &&
                  index + 16 <= raw.length) {
                gtin = raw.substring(
                  index + 2,
                  index + 16,
                );

                index += 16;
                continue;
              }

              if (raw.startsWith('17', index) &&
                  index + 8 <= raw.length) {
                expiryDate = parseExpiry(
                  raw.substring(
                    index + 2,
                    index + 8,
                  ),
                );

                index += 8;
                continue;
              }

              if (raw.startsWith('240', index)) {
                final result = readVariableField(
                  raw,
                  index + 3,
                );

                catalogNumber = result.$1;
                index = result.$2;
                continue;
              }

              if (raw.startsWith('21', index)) {
                final result = readVariableField(
                  raw,
                  index + 2,
                );

                serialNumber = result.$1;
                index = result.$2;
                continue;
              }

              if (raw.startsWith('10', index)) {
                final result = readVariableField(
                  raw,
                  index + 2,
                );

                lot = result.$1;
                index = result.$2;
                continue;
              }

              index++;
            }

            return ParsedBarcode(
              rawValue: input,
              gtin: gtin,
              lot: lot,
              catalogNumber: catalogNumber,
              serialNumber: serialNumber,
              expiryDate: expiryDate,
            );
          }

          (String, int) readVariableField(
            String raw,
            int start,
          ) {
            int end = start;

            while (end < raw.length &&
                raw.codeUnitAt(end) != 29) {
              end++;
            }

            return (
              raw.substring(start, end).trim(),
              end < raw.length ? end + 1 : end,
            );
          }

